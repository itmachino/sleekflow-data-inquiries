    const m = SB.main, c = SB.compare, r = SB.topicRows[0];
    k2 = r ? kpi({ label: 'Top customer issue', src: TAG_B, value: esc(r.name), txt: true, sub: npText(r.chats, m.chats) + ' chats', cmp: SB.canCompare ? (r.isNew ? 'New this period' : cmpB + ': ' + num(r.compare) + ' chats') : '' })
      : kpi({ label: 'Top customer issue', src: TAG_B, value: '–', sub: 'No topics chosen yet' });
    k3 = kpi({ label: 'Human assistance', src: TAG_B, value: share(m.HUMAN, m.chats), sub: ofChats(m.HUMAN, m.chats), cmp: SB.canCompare && c.chats ? cmpB + ': ' + ofChats(c.HUMAN, c.chats) : '' });
    let cmp4 = '';
    if (SA && SA.weekday && SA.weekday.busiest) cmp4 = 'Busiest day: ' + SA.weekday.busiest.day + 's';
    else if (SB.busiestHandedHour !== null) cmp4 = 'Human assistance busiest: ' + hourShort(SB.busiestHandedHour);
    k4 = SB.busiestHour !== null ? kpi({ label: 'Busiest time', src: TAG_B, value: hourShort(SB.busiestHour), txt: true, sub: 'Most chats start then', cmp: cmp4 })
      : kpi({ label: 'Busiest time', src: TAG_B, value: '–', sub: 'Needs about ' + CFG.BUSIEST_MIN_CHATS + ' chats to tell', cmp: cmp4 });
  } else {
    k2 = kpi({ label: 'Top customer issue', src: TAG_B, value: '–', sub: notB });
    k3 = kpi({ label: 'Human assistance', src: TAG_B, value: '–', sub: notB });
    k4 = kpi({ label: 'Busiest time', src: TAG_B, value: '–', sub: notB });
  }

  // 2. Anything unusual
  const al = (SA ? SA.alerts : []).concat(SB ? SB.alerts : []);
  let strip = '';
  if (al.length) strip = '<div class="status warn" role="status"><span class="ico" aria-hidden="true">!</span><div><p class="st-h">Things to check</p><ul>' + al.slice(0, 3).map(a => '<li>' + esc(a.text) + '</li>').join('') + '</ul>' + (al.length > 3 ? '<p class="src">+ ' + (al.length - 3) + ' more in the other tabs</p>' : '') + '</div></div>';
  else if (okA || okB) strip = '<div class="status ok" role="status"><span class="ico" aria-hidden="true">✓</span><p class="st-h">Nothing unusual detected.</p></div>';

  // 3. What customers ask about, and the common concerns
  const srcB = okB ? TAG_B + ' · ' + num(SB.main.chats) + ' chats' : TAG_B;
  let ask;
  if (!SB || !SB.topicRows.length) ask = msg('What customers ask about', notB);
  else {
    const m = SB.main; const small = m.chats < CFG.SMALL_TOTAL;
    ask = '<section class="card">' + cardHead('What customers ask about', srcB, ['bot', 'All topics']) + takeaway(SB) +
      rankBars(SB.topicRows.map(r => ({ name: r.name, n: r.chats, p: small ? '' : pct(r.chats, m.chats), vs: SB.canCompare ? (r.isNew ? 'new' : 'was ' + num(r.compare)) : '' }))) +
      (small ? '<p class="foot">Only ' + m.chats + ' chat' + (m.chats === 1 ? '' : 's') + ' in this period, so no percentages.</p>' : '<p class="def">Share of all chats. A chat can pick more than one topic, so the shares add up to more than 100%.' + (SB.canCompare ? ' "was" = ' + cmpB + '.' : '') + '</p>') + '</section>';
  }
  let concerns;
  if (!okB) concerns = msg('Common concerns', notB);
  else {
    const rows = SB.concernRows.map(r => ({ r, d: CFG.DETAILS.find(x => x.label === r.label) }))
      .filter(x => x.d && !x.d.systemError && NOT_A_CONCERN.indexOf(x.r.label) === -1).slice(0, 5)
      .map(x => ({ name: x.r.label, sub: x.d.topic, n: x.r.chats }));
    concerns = '<section class="card">' + cardHead('Common concerns', TAG_B + ' · what customers picked inside a topic', ['bot', 'All sub-topics']) +
      (rows.length ? rankBars(rows, { narrow: true }) : '<p class="muted">No concerns recorded in this period.</p>') + '</section>';
  }

  // 4. Enquiries over time, and by channel
  let time, chans;
  if (!okA) { time = msg('Enquiries over time', notA); chans = msg('Enquiries by channel', notA); }
  else {
    const m = SA.main; const tot = m.wa + m.ig + m.tt + m.em;
    time = '<section class="card">' + cardHead('Enquiries over time', TAG_A + ' · all channels · per ' + SA.unit, ['all-channels', 'Full detail']) + timeChart(SA, 'cTimeOv') + timeFacts(SA) + '</section>';
    const last = SA.mainList[SA.mainList.length - 1];
    chans = '<section class="card">' + cardHead('Enquiries by channel', TAG_A + ' · ' + num(tot) + ' enquiries', ['all-channels', 'Detail']) +
      rankBars(activeChannels(SA).map(c => ({ name: c[0], sub: Math.round(m[c[1]] / m.days) + ' a day', n: m[c[1]], p: pct(m[c[1]], tot), c: c[1] }))) +
      (last ? '<div class="reply"><p class="main">Latest day (' + esc(dayText(last.ms)) + '): <b>' + num(last.total) + '</b> enquiries</p><div class="legend">' + activeChannels(SA).map(c => '<span><i style="background:var(--' + c[1] + ')"></i>' + c[0] + ' <b>' + num(last[c[1]]) + '</b></span>').join('') + '</div></div>' : '') +
      '<p class="def">Instagram and TikTok have no FAQ menu, only automatic replies.</p></section>';
  }

  // 5. How chats ended, who replied
  let ended;
  if (!okB) ended = msg('How WhatsApp FAQ chats ended', notB);
  else {
    const m = SB.main; const ks = ['BOT', 'HUMAN', 'QUIET', 'UNKNOWN'].filter(k => k !== 'UNKNOWN' || m.UNKNOWN);
    ended = '<section class="card">' + cardHead('How WhatsApp FAQ chats ended', srcB, ['bot', 'Detail'], '(WhatsApp only: each chat with the FAQ menu, and how it finished)') + splitBar(ks.map(k => [OUTCOME_COLOUR[k], m[k], WORD[k]]), m.chats, 'How chats ended') +
      '<ul class="oc">' + ks.map(k => '<li>' + key(OUTCOME_COLOUR[k]) + '<span class="oc-name">' + WORD[k] + '</span><span class="oc-v">' + share(m[k], m.chats) + '</span><span class="oc-c">' + ofChats(m[k], m.chats) + '</span></li>').join('') + '</ul></section>';
  }
  let replied;
  if (!okA) replied = msg('Who replied to enquiries', notA);
  else {
    const m = SA.main; const rows = [['ok', m.bot, 'Bot or auto-reply only'], ['person', m.staff, 'Answered by staff'], ['quiet', m.none, 'No reply from us (same day)']];
    replied = '<section class="card">' + cardHead('Who replied to enquiries', TAG_A, ['all-channels', 'Detail'], '(All channels: every customer on WhatsApp, Instagram and TikTok, and who answered them that day)') + (m.who ? splitBar(rows, m.who, 'Who replied') : '') +
      '<ul class="oc">' + rows.map(x => '<li>' + key(x[0]) + '<span class="oc-name">' + x[2] + '</span><span class="oc-v">' + (m.who ? pct(x[1], m.who) : '–') + '</span><span class="oc-c">' + num(x[1]) + ' of ' + num(m.who) + ' enquiries</span></li>').join('') + '</ul>' +
      (m.reply && m.reply.n >= 3 ? '<div class="reply"><p class="main">Staff reply time: <b>' + m.reply.mid + ' min</b> <span class="muted">(typical day)</span></p></div>' : '') + '</section>';
  }

  return '<div class="kpis">' + k1 + k2 + k3 + k4 + '</div>' + strip + '<div class="cols c32">' + ask + concerns + '</div>' + '<div class="cols c21">' + time + chans + '</div>' + '<div class="cols c11">' + ended + replied + '</div>';
}

// ------------------------------------------------------------ Daily Log (SleekFlow data)
function partA(SA) {
  const up = READ_A && READ_A.lastMs !== null ? ' · filled up to ' + dayText(READ_A.lastMs) + ' ' + wall(READ_A.lastMs).y : '';
  const head = pageHead(SRC_A, 'All channels: every customer who messaged us on WhatsApp, Instagram or TikTok, counted once a day, and who replied to them.', TAG_A + up);
  if (!SA) return head + msg('Summary', ERR_A ? 'The ' + SRC_A + ' could not be loaded. The ' + SRC_B + ' is still correct.' : READ_A ? 'No Daily Log days yet.' : 'Loading the Daily Log…');
  const m = SA.main, c = SA.cmp;
  if (!m.days) return head + msg('Summary', 'No Daily Log days in this period. It started on ' + esc(dayText(READ_A.firstMs)) + ' ' + wall(READ_A.firstMs).y + ' and is filled up to ' + esc(dayText(READ_A.lastMs)) + ' ' + wall(READ_A.lastMs).y + '.');
  const src = TAG_A + up;
  const wasShare = cn => (SA.shareOk && c.who ? esc(SA.p.compareText) + ': ' + npText(cn, c.who) : '');

  // Summary
  const three = [
    ['ok', m.bot, 'Bot or auto-reply only', 'No staff reply that day. Not proof it was solved.', c.bot],
    ['person', m.staff, 'Answered by staff', 'A staff member replied at least once.', c.staff],
    ['quiet', m.none, 'No reply from us (same day)', 'Nobody on our side replied that day.', c.none],
  ];
  let s1 = '<section class="card">' + cardHead('Summary', src);
  s1 += '<div class="kpis">' + kpi({ label: 'Total enquiries', value: num(m.enq), sub: num(Math.round(m.perDay)) + ' a day', cmp: SA.covered && c.perDay !== null ? esc(SA.p.compareText) + ': ' + num(c.enq) + ' (' + Math.round(c.perDay) + ' a day)' : '', def: 'Customers who messaged us. One customer, one channel, one day = 1.' }) +
    three.map(x => kpi({ label: x[2], dot: x[0], value: m.who ? pct(x[1], m.who) : '–', sub: num(x[1]) + ' of ' + num(m.who), cmp: wasShare(x[4]), def: x[3] })).join('') + '</div>';
  if (m.who) s1 += splitBar(three, m.who, 'Who replied');
  if (m.reply && m.reply.n >= 3) s1 += '<div class="reply"><p class="main">Staff reply time: <b>' + m.reply.mid + ' min</b> <span class="muted">(typical day; half of days between ' + m.reply.lo + ' and ' + m.reply.hi + ' min)</span></p><p class="def">Clock time, nights and weekends included, same-day replies only. It shows how long customers wait, not any one person\'s speed.</p></div>';
  else s1 += '<p class="foot">Staff reply time: not enough days with staff replies in this period yet.</p>';
  if (m.completeDays < m.days) s1 += '<p class="foot">Shares and reply time use ' + m.completeDays + ' of ' + m.days + ' days. ' + esc(joinAnd(m.incomplete.map(x => dayText(x.ms)))) + ' ' + (m.incomplete.length === 1 ? 'is' : 'are') + ' incomplete in the sheet.</p>';
  s1 += '</section>';

  // By channel
  const chRows = activeChannels(SA);
  const chTotal = m.wa + m.ig + m.tt + m.em;
  const vs = k => { if (!SA.covered || c.perDay === null) return '–'; const x = Math.round(m[k] / m.days), y = Math.round(c[k] / c.days); return y + ' a day' + (x === y ? '' : '<span class="chg">' + (x > y ? '▲ ' : '▼ ') + Math.abs(x - y) + '</span>'); };
  const maxCh = Math.max(1, ...chRows.map(r => m[r[1]]));
  const s2 = '<section class="card">' + cardHead('Enquiries by channel', src) + '<div class="tw"><table class="topics"><thead><tr><th>Channel</th><th class="num">Enquiries</th><th class="hide-sm"><span class="sr">Bar</span></th><th class="num">A day</th>' + (SA.covered ? '<th class="num hide-sm">' + esc(SA.p.compareText) + '</th>' : '') + '</tr></thead><tbody>' +
    chRows.map(r => '<tr><td><span class="lab-c">' + key(r[1]) + ' <b>' + r[0] + '</b></span></td><td class="num"><b>' + np(m[r[1]], chTotal) + '</b></td><td class="barcell hide-sm"><div class="bar" style="width:' + (100 * m[r[1]] / maxCh) + '%;background:var(--' + r[1] + ')"></div></td><td class="num">' + Math.round(m[r[1]] / m.days) + '</td>' + (SA.covered ? '<td class="num muted hide-sm">' + vs(r[1]) + '</td>' : '') + '</tr>').join('') + '</tbody></table></div>' +
    '<p class="foot">Bot or auto-reply only rises and falls with Instagram\'s share, so read the two together. Instagram and TikTok have no FAQ menu, only automatic replies.</p></section>';

  // Over time
  let s3 = '<section class="card">' + cardHead('Enquiries over time', src + ' · per ' + SA.unit) + timeChart(SA, 'cTime') + timeFacts(SA);
  if (SA.months.length) s3 += '<h4 class="subh">Month by month</h4><div class="tw"><table><thead><tr><th>Month</th><th class="num">Enquiries</th><th class="num">A day</th><th class="num">Bot or auto-reply only</th><th class="num">Answered by staff</th><th class="num">No reply from us</th><th class="num">Staff reply time</th></tr></thead><tbody>' +
    SA.months.map(r => '<tr><td><b>' + esc(monthLabel(r.label)) + '</b></td><td class="num"><b>' + num(r.enq) + '</b></td><td class="num">' + Math.round(r.perDay) + '</td><td class="num">' + np(r.bot, r.who) + '</td><td class="num">' + np(r.staff, r.who) + '</td><td class="num">' + np(r.none, r.who) + '</td><td class="num">' + (r.reply && r.reply.n >= 3 ? r.reply.mid + ' min' : '–') + '</td></tr>').join('') + '</tbody></table></div>' +
    '<p class="def">Shares are out of the enquiries on complete days. The current month counts the days filled so far.</p>';
  s3 += '</section>';
  return head + alertBox(SA.alerts) + s1 + s3 + s2;
}

// ------------------------------------------------------------ WhatsApp FAQ customer data
/** Chats per day (or week) by ending, per hour, per weekday and per month. Display only: re-groups the chats the logic block already read, and every total is checked against SB.main in the test script. */
function botViz(SB, rb) {
  const p = SB.p, m = SB.main;
  const start = rb.logStartMs !== null ? Math.max(p.main.start, dayStart(rb.logStartMs)) : p.main.start;
  const end = Math.min(p.main.end, p.today.end);
  const inR = rb.chats.filter(c => c.ms >= start && c.ms < end);
  const unit = end - start <= 62 * DAY ? 'day' : 'week'; const step = unit === 'day' ? DAY : 7 * DAY;
  const day = [];
  for (let t = start; t < end; t += step) day.push({ start: t, end: Math.min(t + step, end), label: dayText(t), partial: unit === 'week' && t + step > end, BOT: 0, HUMAN: 0, QUIET: 0, UNKNOWN: 0 });
  inR.forEach(c => { const b = day[Math.floor((c.ms - start) / step)]; if (b) b[c.outcome]++; });
  const hour = Array.from({ length: 24 }, () => ({ all: 0, human: 0 }));
  inR.forEach(c => { const h = hour[wall(c.ms).h]; h.all++; if (c.outcome === 'HUMAN') h.human++; });
  // weekday averages use whole days only (today is not finished), and only when every weekday occurs often enough
  const fullEnd = Math.min(end, p.today.start); const occ = [0, 0, 0, 0, 0, 0, 0];
  for (let t = start; t < fullEnd; t += DAY) occ[wall(t).dow]++;
  const wd = Array.from({ length: 7 }, () => ({ all: 0, human: 0 }));
  rb.chats.filter(c => c.ms >= start && c.ms < fullEnd).forEach(c => { const w = wd[wall(c.ms).dow]; w.all++; if (c.outcome === 'HUMAN') w.human++; });
  const wdOk = occ.every(n => n >= CFG.WEEKDAY_MIN_EACH);
  const order = [1, 2, 3, 4, 5, 6, 0];
  return {
    day, unit, hour, hourOk: m.chats >= CFG.BUSIEST_MIN_CHATS, hourHuman: m.HUMAN >= CFG.BUSIEST_HANDED_MIN,
    wd: { ok: wdOk, labels: order.map(d => DAYS[d].slice(0, 3)), all: order.map(d => (occ[d] ? wd[d].all / occ[d] : 0)), human: order.map(d => (occ[d] ? wd[d].human / occ[d] : 0)) },
    months: SB.months.map(r => ({ label: monthLabel(r.label), BOT: r.BOT, HUMAN: r.HUMAN, QUIET: r.QUIET, UNKNOWN: r.chats - r.BOT - r.HUMAN - r.QUIET })),
  };
}
let BOTVIZ = null;

/** The two cards: topics (with sub-topics) in chats completed by the bot, and in chats that needed a person.
    Bot counts every topic the chat picked. Human counts only the topic the customer was on at the end (the logic block's rule), so its shares add up to 100%. */
function sideData(SB, rb) {
  const m = SB.main; const bots = subBotCounts(rb, SB.p.main);
  const side = (n, noTopic) => ({ total: n, noTopic, rows: [] });
  const out = { bot: side(m.BOT, bots.noTopicBot), human: side(m.HUMAN, m.noTopicHuman) };
  SB.topicRows.forEach(r => {
    const o = SB.res[r.name] || { resolved: 0, handed: 0, chats: 0 }; const st = SB.sub.tables[r.name]; const bt = bots.tables[r.name] || { subs: {}, noSub: 0 };
    const complete = !!st && st.base >= o.chats;
    const subsOf = (counts, noSub) => { const a = Object.keys(counts).map(l => ({ name: l, n: counts[l] })).filter(s => s.n > 0).sort((x, y) => y.n - x.n || x.name.localeCompare(y.name)); if (a.length && noSub) a.push({ name: 'No sub-topic chosen', n: noSub }); return a; };
    if (o.resolved > 0) out.bot.rows.push({ name: r.name, n: o.resolved, subs: st ? subsOf(bt.subs, bt.noSub) : [], complete });
    if (o.handed > 0) out.human.rows.push({ name: r.name, n: o.handed, subs: st ? subsOf(st.handed, st.noSubHanded) : [], complete });
  });
  ['bot', 'human'].forEach(k => out[k].rows.sort((a, b) => b.n - a.n || topicOrder(a.name) - topicOrder(b.name)));
  return out;
}

function sideCard(kind, S, max, SB) {
  const bot = kind === 'bot'; const colour = bot ? 'ok' : 'person'; const total = S.total; const m = SB.main;
  const title = bot ? WORD.BOT : WORD.HUMAN;
  const note = bot ? '(What customers picked in chats where the bot finished the job. Share = out of these ' + num(total) + ' chats. A chat can pick several topics, so the shares add up to more than 100%.)'
    : '(What customers picked in chats that needed a person. A chat is counted under the topic the customer was on when it was passed on, so the shares add up to 100%.)';
  let h = '<section class="card side side-' + kind + '"><div class="card-h"><div><h3>' + key(colour) + ' ' + title + ': what customers picked</h3><p class="note">' + note + '</p><p class="src">' + esc(TAG_B) + '</p></div>' +
    '<p class="side-total"><b>' + num(total) + '</b> chats<span class="pc"> ' + (m.chats < CFG.SMALL_TOTAL ? '' : '(' + pct(total, m.chats) + ' of all)') + '</span></p></div>';
  if (!total) return h + '<p class="muted">None in this period.</p></section>';
  let body = '';
  S.rows.forEach((r, i) => {
    const has = r.subs.length > 0; const open = has && OPEN.has(r.name); const ids = r.subs.map((_, j) => 'sd-' + kind + '-' + i + '-' + j);
    const name = has
      ? '<button type="button" class="tgl" aria-expanded="' + open + '" aria-controls="' + ids.join(' ') + '" data-topic="' + esc(r.name) + '"><span class="chev">' + CHEV + '</span><span>' + esc(r.name) + ' <span class="hint">' + r.subs.length + ' sub-topic' + (r.subs.length === 1 ? '' : 's') + '</span></span></button>'
      : '<span class="plain">' + esc(r.name) + '</span>';
    body += '<tbody class="grp' + (open ? ' open' : '') + '" data-topic="' + esc(r.name) + '"><tr class="top"><td>' + name + '</td><td class="barcell hide-sm"><div class="bar" style="width:' + (100 * r.n / max) + '%;background:var(--' + colour + ')"></div></td><td class="num">' + np(r.n, total) + '</td></tr>';
    const cl = (inner, cls) => '<td' + (cls ? ' class="' + cls + '"' : '') + '><div class="cl"><div><div class="p">' + inner + '</div></div></div></td>';
    r.subs.forEach((s, j) => {
      body += '<tr class="sub' + (j === r.subs.length - 1 ? ' last' : '') + '" id="' + ids[j] + '">' + cl('<span class="tree">' + esc(s.name) + '</span>', '') +
        cl('<div class="bar" style="width:' + (100 * s.n / max) + '%;background:var(--' + colour + ');opacity:.55"></div>', 'barcell hide-sm') + cl(r.complete ? np(s.n, r.n) : num(s.n), 'num') + '</tr>';
    });
    body += '</tbody>';
  });
  if (S.noTopic) body += '<tbody class="grp"><tr class="top"><td class="muted"><span class="plain">No topic chosen</span></td><td class="barcell hide-sm"><div class="bar" style="opacity:.4;width:' + (100 * S.noTopic / max) + '%;background:var(--' + colour + ')"></div></td><td class="num">' + np(S.noTopic, total) + '</td></tr></tbody>';
  h += '<div class="tw"><table class="topics side-t"><thead><tr><th>Topic</th><th class="hide-sm"><span class="sr">Bar</span></th><th class="num">Chats (share of ' + num(total) + ')</th></tr></thead>' + body + '</table></div>';
  h += '<p class="def">Click a topic to see the sub-topics inside it. A sub-topic share is out of its topic' + (S.rows.some(r => !r.complete && r.subs.length) ? '; where sub-topics were only recorded from a later date, only the number is shown' : '') + '.</p></section>';
  return h;
}

function partB(SB, rb) {
  const head = pageHead(SRC_B, 'WhatsApp only: each chat with the FAQ menu, what the customer picked, and how the chat ended. Counts chats, not customers. Instagram and TikTok have no FAQ menu.', SB ? TAG_B + ' · ' + num(SB.main.chats) + ' chats in this period' : '');
  BOTVIZ = null;

  // How chats ended
  let s4 = '<section class="card">' + cardHead('How chats ended', src);
  if (!m.chats) {
    s4 += '<p class="muted">No chats in this period. Chats have been recorded since ' + esc(dayText(rb.logStartMs)) + ' ' + wall(rb.logStartMs).y + '.</p></section>';

  s4 += smallNote;
  s4 += '<div class="kpis">' +
    kpi({ label: 'Total chats', value: num(m.chats), sub: 'One WhatsApp conversation with the FAQ menu.', cmp: SB.canCompare ? esc(SB.p.compareText) + ': ' + num(c.chats) + ' chats' : '' }) +
    kpi({ label: WORD.BOT, dot: 'ok', value: share(m.BOT, m.chats), sub: ofChats(m.BOT, m.chats), cmp: SB.canCompare && c.chats ? esc(SB.p.compareText) + ': ' + ofChats(c.BOT, c.chats) : '', def: 'The customer finished with "Nope, that\'s all".' }) +
    kpi({ label: WORD.HUMAN, dot: 'person', value: share(m.HUMAN, m.chats), sub: ofChats(m.HUMAN, m.chats), cmp: SB.canCompare && c.chats ? esc(SB.p.compareText) + ': ' + ofChats(c.HUMAN, c.chats) : '', def: 'Passed to a person. Often on purpose, not a failure.' }) +
    kpi({ label: WORD.QUIET, dot: 'quiet', value: share(m.QUIET, m.chats), sub: ofChats(m.QUIET, m.chats), cmp: SB.canCompare && c.chats ? esc(SB.p.compareText) + ': ' + ofChats(c.QUIET, c.chats) : '', def: 'The customer went quiet and the chat was closed after one reminder.' }) + '</div>';
  s4 += splitBar(['BOT', 'HUMAN', 'QUIET', 'UNKNOWN'].filter(k => m[k]).map(k => [OUTCOME_COLOUR[k], m[k], WORD[k]]), m.chats, 'How chats ended');
  if (m.UNKNOWN) s4 += '<p class="foot">' + m.UNKNOWN + ' chat(s) have an ending the page does not recognise. Please tell ' + esc(CFG.ADMIN_NAME) + '.</p>';
  s4 += '</section>';

  const endLegend = legend([{ c: 'ok', t: WORD.BOT }, { c: 'person', t: WORD.HUMAN }, { c: 'quiet', t: WORD.QUIET }].concat(m.UNKNOWN ? [{ c: 'unknown', t: WORD.UNKNOWN }] : []));
  const bchart = (kind, id) => '<div class="chart"><canvas class="js-bot" data-kind="' + kind + '" id="' + id + '" role="img" aria-label="' + kind + ' chart"></canvas></div>';

  // Chats per day
  const sDay = '<section class="card">' + cardHead('Chats per ' + BOTVIZ.unit + ', by how they ended', src) + endLegend + bchart('day', 'cBotDay') +
    '<p class="def">WhatsApp FAQ chats only, so these bars are not the same as the all-channel enquiries on the Daily Log tab. A quiet day can also mean nothing was recorded.</p></section>';

  // The two cards
  const SD = sideData(SB, rb); const max = Math.max(1, ...SD.bot.rows.map(r => r.n), ...SD.human.rows.map(r => r.n), SD.bot.noTopic, SD.human.noTopic);
  const anySub = SD.bot.rows.concat(SD.human.rows).some(r => r.subs.length);
  const sCards = (anySub ? '<div class="tblctl noprint"><button type="button" class="lnk" data-act="expand">Expand all</button><button type="button" class="lnk" data-act="collapse">Collapse all</button><span class="src">Both cards open together. The bars use the same scale, so you can compare them.</span></div>' : '') +
    '<div class="cols c11">' + sideCard('bot', SD.bot, max, SB) + sideCard('human', SD.human, max, SB) + '</div>';

  // When customers message
  const hourFacts = [SB.busiestHour !== null ? 'Busiest time for chats: <b>' + hourText(SB.busiestHour) + '</b>' : '', SB.busiestHandedHour !== null ? 'Human assistance busiest: <b>' + hourText(SB.busiestHandedHour) + '</b>' : ''].filter(Boolean);
  const hourCard = '<section class="card">' + cardHead('When customers message', src + ' · hour of the day, Malaysia time') +
    (BOTVIZ.hourOk ? bchart('hour', 'cBotHour') + (hourFacts.length ? '<div class="facts">' + hourFacts.map(x => '<span class="fact">' + x + '</span>').join('') + '</div>' : '') +
      '<p class="def">Shows when people ask, not how many staff you need. The hour is the time recorded for the chat.</p>' : '<p class="muted">Shows once there are about ' + CFG.BUSIEST_MIN_CHATS + ' chats in the period.</p>') + '</section>';
  const wdCard = '<section class="card">' + cardHead('Average chats per day, by weekday', src) +
    (BOTVIZ.wd.ok ? bchart('wd', 'cBotWd') + '<p class="def">Whole days only. Special days such as a sale or a launch can lift a weekday.</p>' : '<p class="muted">Shows for periods of about 4 weeks or more.</p>') + '</section>';
  const sWhen = '<div class="cols c11">' + hourCard + wdCard + '</div>';

  // Topics and sub-topics: the full table. Every row reads the same way: its own chats, then how those chats ended (adds up to 100% of the row).
  let s5 = '<section class="card">' + cardHead('All topics in one table', src, null, '(How to read it: each row is one topic or sub-topic. Chats = how many chats picked it. The three numbers after it show how those chats ended, as a share of that row\'s own chats, so every row adds up to 100%.)');
  EXPANDABLE = [];
  if (!SB.topicRows.length && !m.noTopic) {
    s5 += '<p class="muted">No topics picked in this period.</p></section>';
  } else {
    s5 += smallNote;
    const cmp = SB.canCompare;
    const bots = subBotCounts(rb, SB.p.main);
    const always = (n, t) => (n === t && t >= CFG.SMALL_TOTAL ? '<span class="tag">always needs a person</span>' : '');
    const cl = (inner, cls) => '<td' + (cls ? ' class="' + cls + '"' : '') + '><div class="cl"><div><div class="p">' + inner + '</div></div></div></td>';
    const before = (now, was, isNew) => (isNew ? 'new' : num(was) + (now === was ? '' : '<span class="chg">' + (now > was ? '▲ ' : '▼ ') + Math.abs(now - was) + '</span>'));
    /** The three endings of one row: completed by bot, human assistance, and the rest (stopped replying, or went on to another topic). */
    const ends = (n, b, hu) => {
      const o = Math.max(0, n - b - hu);
      return { bar: '<div class="endbar" role="img" aria-label="' + esc(WORD.BOT + ' ' + b + ', ' + WORD.HUMAN + ' ' + hu + ', rest ' + o) + '">' + [['ok', b], ['person', hu], ['quiet', o]].filter(x => x[1]).map(x => '<span style="flex:' + x[1] + ' 1 0;background:var(--' + x[0] + ')"></span>').join('') + '</div>', b: np(b, n), h: np(hu, n), o: np(o, n) };
    };
    let body = '';
    SB.topicRows.forEach((r, i) => {
      const o = SB.res[r.name] || { resolved: 0, handed: 0 }; const st = SB.sub.tables[r.name]; const bt = bots.tables[r.name] || { subs: {}, noSub: 0 };
      const subs = st ? Object.keys(st.subs).sort((a, b) => st.subs[b] - st.subs[a] || a.localeCompare(b)) : [];
      const rows = subs.map(l => ({ name: l, n: st.subs[l], b: bt.subs[l] || 0, h: st.handed[l] || 0 }));
      if (subs.length && st.noSub) rows.push({ name: 'No sub-topic chosen', n: st.noSub, b: bt.noSub, h: st.noSubHanded });
      const has = subs.length > 0; const open = has && OPEN.has(r.name);
      if (has) EXPANDABLE.push(r.name);
      const ids = rows.map((_, j) => 'tb-' + i + '-' + j);
      const name = has
        ? '<button type="button" class="tgl" aria-expanded="' + open + '" aria-controls="' + ids.join(' ') + '" data-topic="' + esc(r.name) + '"><span class="chev">' + CHEV + '</span><span>' + esc(r.name) + ' <span class="hint">' + subs.length + ' sub-topic' + (subs.length === 1 ? '' : 's') + '</span></span></button>'
        : '<span class="plain">' + esc(r.name) + '</span>';
      const e = ends(r.chats, o.resolved, o.handed);
      body += '<tbody class="grp' + (open ? ' open' : '') + '" data-topic="' + esc(r.name) + '"><tr class="top"><td>' + name + '</td><td class="num">' + num(r.chats) + '</td><td class="num muted hide-sm">' + (small ? '' : pct(r.chats, m.chats)) + '</td><td class="barcell hide-sm">' + e.bar + '</td><td class="num">' + e.b + '</td><td class="num">' + e.h + always(o.handed, r.chats) + '</td><td class="num">' + e.o + '</td>' + (cmp ? '<td class="num muted hide-sm">' + before(r.chats, r.compare, r.isNew) + '</td>' : '') + '</tr>';
      rows.forEach((s, j) => {
        const f = ends(s.n, s.b, s.h);
        body += '<tr class="sub' + (j === rows.length - 1 ? ' last' : '') + '" id="' + ids[j] + '">' + cl('<span class="tree">' + esc(s.name) + '</span>', '') + cl(num(s.n), 'num') + cl(st.base < CFG.SMALL_TOTAL ? '' : pct(s.n, st.base) + ' of topic', 'num hide-sm') + cl(f.bar, 'barcell hide-sm') + cl(f.b, 'num') + cl(f.h + always(s.h, s.n), 'num') + cl(f.o, 'num') + (cmp ? cl('', 'hide-sm') : '') + '</tr>';
      });
      body += '</tbody>';
    });
    if (m.noTopic) {
      const e = ends(m.noTopic, bots.noTopicBot, m.noTopicHuman);
      body += '<tbody class="grp"><tr class="top"><td class="muted"><span class="plain">No topic chosen</span></td><td class="num">' + num(m.noTopic) + '</td><td class="num muted hide-sm">' + (small ? '' : (m.noTopic / m.chats < 0.005 ? '&lt;1%' : pct(m.noTopic, m.chats))) + '</td><td class="barcell hide-sm">' + e.bar + '</td><td class="num">' + e.b + '</td><td class="num">' + e.h + '</td><td class="num">' + e.o + '</td>' + (cmp ? '<td class="num muted hide-sm">' + before(m.noTopic, SB.compare.noTopic, false) + '</td>' : '') + '</tr></tbody>';
    }
    if (EXPANDABLE.length) s5 += '<div class="tblctl noprint"><button type="button" class="lnk" data-act="expand">Expand all</button><button type="button" class="lnk" data-act="collapse">Collapse all</button></div>';
    const ex = SB.topicRows[0]; const eo = ex && SB.res[ex.name];
    if (ex && eo && !small) {
      const rest = Math.max(0, ex.chats - eo.resolved - eo.handed);
      s5 += '<p class="example"><b>Example:</b> of the ' + num(ex.chats) + ' chats that picked ' + esc(ex.name) + ', ' + num(eo.resolved) + ' (' + pct(eo.resolved, ex.chats) + ') were completed by the bot, ' + num(eo.handed) + ' (' + pct(eo.handed, ex.chats) + ') needed a person, and ' + num(rest) + ' (' + pct(rest, ex.chats) + ') stopped replying or went on to another topic.</p>';
    }
    s5 += '<div class="tw"><table class="topics wide"><thead><tr><th>Topic</th><th class="num">Chats</th><th class="num hide-sm">Share of all chats</th><th class="hide-sm"><span class="sr">How they ended</span></th><th class="num">' + WORD.BOT + '</th><th class="num">' + WORD.HUMAN + '</th><th class="num">Stopped replying or went to another topic</th>' + (cmp ? '<th class="num hide-sm" title="' + esc(SB.p.compareText) + '">Chats ' + cmpName.toLowerCase() + '</th>' : '') + '</tr></thead>' + body + '</table></div>';
    s5 += '<p class="def">A chat can pick several topics, so the Chats column adds up to more than the number of chats. Human assistance counts a chat only under the topic the customer was on when it was passed to a person. A sub-topic\'s share is out of its topic, and its three numbers are out of the sub-topic\'s own chats.' + (cmp ? ' "Chats ' + cmpName.toLowerCase() + '" = ' + esc(SB.p.compareText) + '.' : '') + '</p>';
    const subTopics = Object.keys(SB.sub.tables);
    if (!subTopics.length) s5 += '<p class="foot">Sub-topics are not recorded yet.</p>';
    else {
      const late = subTopics.filter(t => SB.sub.tables[t].base < (SB.res[t] ? SB.res[t].chats : 0));
      if (late.length) s5 += '<p class="foot">Sub-topic shares count only chats since the sub-topics were first recorded (' + late.map(t => esc(t) + ' from ' + esc(dayText(SB.sub.tables[t].since))).join(', ') + ').</p>';
    }
    if (SB.sub.unrecognised) s5 += '<p class="foot">' + SB.sub.unrecognised + ' sub-topic(s) did not match a topic in their own chat and are not shown. Please tell ' + esc(CFG.ADMIN_NAME) + '.</p>';
    s5 += '</section>';
  }

  // By month
  const s6 = SB.months.length ? '<section class="card">' + cardHead('Total chats by month', TAG_B + ' · every month, whatever period is picked above') + endLegend + bchart('month', 'cBotMonth') + '<div class="tw"><table><thead><tr><th>Month</th><th class="num">Total chats</th><th class="num">' + WORD.BOT + '</th><th class="num">' + WORD.HUMAN + '</th><th class="num">' + WORD.QUIET + '</th></tr></thead><tbody>' +
    SB.months.map(r => '<tr><td><b>' + esc(monthLabel(r.label)) + '</b></td><td class="num"><b>' + num(r.chats) + '</b></td><td class="num">' + np(r.BOT, r.chats) + '</td><td class="num">' + np(r.HUMAN, r.chats) + '</td><td class="num">' + np(r.QUIET, r.chats) + '</td></tr>').join('') + '</tbody></table></div>' +
    '<p class="def">Shares are out of that month\'s total chats. The current month counts the days so far.</p></section>' : '';
  return head + alertBox(SB.alerts) + s4 + sDay + sCards + sWhen + s5 + s6;
}

// ------------------------------------------------------------ Chart
/** Shades the special days (CFG.EVENTS) behind the bars. */
const eventBands = {
  id: 'eventBands',
  beforeDatasetsDraw(chart, args, o) {
    if (!o || !o.idx || !o.idx.length) return;
    const { ctx, chartArea: a, scales: { x } } = chart; const half = x.width / Math.max(1, chart.data.labels.length) / 2;
    ctx.save(); ctx.fillStyle = o.color;
    o.idx.forEach(i => { const cx = x.getPixelForValue(i); ctx.fillRect(cx - half, a.top, half * 2, a.bottom - a.top); });
    ctx.restore();
  },
};
function drawChart(SA, quiet) {
  CHARTS.forEach(c => c.destroy()); CHARTS = [];
  const els = SA ? Array.from(document.querySelectorAll('canvas.js-time')) : []; const bels = BOTVIZ ? Array.from(document.querySelectorAll('canvas.js-bot')) : [];
  if (!els.length && !bels.length) return;
  if (!window.Chart) { document.querySelectorAll('.chart').forEach(e => { e.style.display = 'none'; }); document.querySelectorAll('.nochart').forEach(e => { e.textContent = 'The chart could not load. The tables are still correct.'; }); return; }
  Chart.defaults.font.family = getComputedStyle(document.body).fontFamily; Chart.defaults.font.size = 12.5; Chart.defaults.color = css('--muted');
  if (els.length) drawTimeCharts(SA, els, quiet);
  bels.forEach(el => { const cfg = botChartConfig(el.dataset.kind, quiet); if (cfg) CHARTS.push(new Chart(el, cfg)); });
}

/** Chart.js settings shared by the stacked WhatsApp FAQ charts. */
function botChartConfig(kind, quiet) {
  const V = BOTVIZ; if (!V) return null;
  const col = k => css('--' + k);
  const ds = (label, data, k, top) => ({ label, data, backgroundColor: col(k), borderRadius: top ? { topLeft: 4, topRight: 4 } : 0, borderSkipped: false, maxBarThickness: 34, stack: 's' });
  let labels, sets, title, decimals = 0;
  const ending = rows => { const s = [ds(WORD.BOT, rows.map(r => r.BOT), 'ok'), ds(WORD.HUMAN, rows.map(r => r.HUMAN), 'person'), ds(WORD.QUIET, rows.map(r => r.QUIET), 'quiet')]; if (rows.some(r => r.UNKNOWN)) s.push(ds(WORD.UNKNOWN, rows.map(r => r.UNKNOWN), 'unknown')); s[s.length - 1].borderRadius = { topLeft: 4, topRight: 4 }; return s; };
  if (kind === 'day') { labels = V.day.map(b => b.label); sets = ending(V.day); title = it => (V.unit === 'week' ? 'Week from ' : '') + it[0].label + (V.day[it[0].dataIndex].partial ? ' (part week)' : ''); }
  else if (kind === 'month') { labels = V.months.map(r => r.label); sets = ending(V.months); title = it => it[0].label; }
  else if (kind === 'hour') {
    labels = V.hour.map((_, h) => (h % 12 || 12) + (h < 12 ? 'a' : 'p')); title = it => hourText(it[0].dataIndex);
    sets = [ds('Chats', V.hour.map(h => h.all), 'accent', true)];
  } else if (kind === 'wd') {
    labels = V.wd.labels; decimals = 1; title = it => it[0].label;
    sets = [ds('Chats', V.wd.all.map(x => +x.toFixed(1)), 'accent', true)];
  } else return null;
  const unit = kind === 'wd' ? ' a day' : '';
  return {
    type: 'bar', data: { labels, datasets: sets },
    options: {
      animation: quiet ? false : { duration: 300 }, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
      plugins: { legend: { display: false }, tooltip: { backgroundColor: css('--ink'), titleColor: css('--panel'), bodyColor: css('--panel'), footerColor: css('--panel'), cornerRadius: 8, padding: 10, boxPadding: 4,
        callbacks: { title, label: x => ' ' + x.dataset.label + ': ' + x.raw + unit, footer: kind === 'hour' || kind === 'wd' ? () => '' : it => 'Total: ' + (+it.reduce((a, x) => a + x.raw, 0).toFixed(decimals)) + ' chats' } } },
      scales: { x: { stacked: true, grid: { display: false }, border: { display: false }, ticks: { autoSkip: true, maxRotation: 0 } }, y: { stacked: true, beginAtZero: true, border: { display: false }, grid: { color: css('--line') }, ticks: { precision: decimals ? undefined : 0 } } },
    },
  };
}

function drawTimeCharts(SA, els, quiet) {
  const per = channelBuckets(SA); const evIdx = SA.buckets.map((b, i) => (b.event ? i : -1)).filter(i => i >= 0);
  const datasets = activeChannels(SA).map(([name, k], i, all) => ({ label: name, data: per.map(p => p[k]), backgroundColor: css('--' + k), borderRadius: i === all.length - 1 ? { topLeft: 4, topRight: 4 } : 0, borderSkipped: false, maxBarThickness: 34, stack: 'ch' }));
  els.forEach(el => CHARTS.push(new Chart(el, {
    type: 'bar',
    data: { labels: SA.buckets.map(b => b.label), datasets },
    plugins: [eventBands],
    options: {
      animation: quiet ? false : { duration: 300 }, maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: false },
        eventBands: { idx: evIdx, color: css('--event') },
        tooltip: {
          backgroundColor: css('--ink'), titleColor: css('--panel'), bodyColor: css('--panel'), footerColor: css('--panel'), cornerRadius: 8, padding: 10, boxPadding: 4,
          callbacks: {
            title: it => (SA.unit === 'week' ? 'Week from ' : '') + it[0].label + (SA.buckets[it[0].dataIndex].partial ? ' (part week)' : '') + (SA.buckets[it[0].dataIndex].event ? ' · special day' : ''),
            label: x => ' ' + x.dataset.label + ': ' + x.raw,
            footer: it => 'Total: ' + SA.buckets[it[0].dataIndex].total + ' enquiries',
          },
        },
      },
      scales: { x: { stacked: true, grid: { display: false }, border: { display: false }, ticks: { autoSkip: true, maxRotation: 0 } }, y: { stacked: true, beginAtZero: true, border: { display: false }, grid: { color: css('--line') }, ticks: { precision: 0 } } },
    },
  })));
}

function applyDates() {
  let f = $('#from').value, t = $('#to').value;
  if (!f || !t) return;
  if (t < f) { const x = f; f = t; t = x; $('#from').value = f; $('#to').value = t; $('#live').textContent = 'The From date was after the To date, so they were swapped.'; }
  $('#period').value = 'custom';
  setKey('r:' + f + ':' + t);
}

const currentTheme = () => document.documentElement.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
const themeLabel = () => { $('#theme').textContent = currentTheme() === 'dark' ? 'Light mode' : 'Dark mode'; };

$('#period').addEventListener('change', () => {
  const v = $('#period').value;
  if (v === 'custom') { $('#from').focus(); if ($('#from').value && $('#to').value) applyDates(); return; }
  setKey(v);
});
$('#from').addEventListener('change', applyDates);
$('#to').addEventListener('change', applyDates);
$('#refresh').addEventListener('click', () => load(true));
$('#print').addEventListener('click', () => window.print());
$('#theme').addEventListener('click', () => {
  const next = currentTheme() === 'dark' ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', next); store('theme', next); themeLabel(); render(true);
});
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (!document.documentElement.getAttribute('data-theme')) { themeLabel(); if (RENDERED) render(true); } }); } catch (e) { /* older browsers */ }
$('#tabs').addEventListener('click', e => { const b = e.target.closest('.tab'); if (b) setTab(b.dataset.tab, true); });
$('#tabs').addEventListener('keydown', e => {
  const i = TABS.indexOf(TAB); const j = { ArrowRight: (i + 1) % TABS.length, ArrowLeft: (i + TABS.length - 1) % TABS.length, Home: 0, End: TABS.length - 1 }[e.key];
  if (j !== undefined) { e.preventDefault(); setTab(TABS[j], true, true); }
});
window.addEventListener('hashchange', () => { setTab(tabFromHash()); const r = $('#tabs').getBoundingClientRect(); if (r.top < 0) window.scrollTo(0, window.scrollY + r.top - 8); });
/** One open/closed state per topic name, so the Completed-by-bot card, the Human-assistance card and the table always open together. */
function setOpen(name, open) {
  if (open) OPEN.add(name); else OPEN.delete(name);
  document.querySelectorAll('.tgl').forEach(b => { if (b.dataset.topic === name) { b.setAttribute('aria-expanded', String(open)); b.closest('tbody').classList.toggle('open', open); } });
}
$('#app').addEventListener('click', e => {
  const t = e.target.closest('.tgl');
  if (t) { setOpen(t.dataset.topic, !OPEN.has(t.dataset.topic)); return; }
  const a = e.target.closest('[data-act]');
  if (a) { const on = a.dataset.act === 'expand'; document.querySelectorAll('.tgl').forEach(b => setOpen(b.dataset.topic, on)); }
});
window.addEventListener('beforeprint', () => { document.querySelectorAll('.tabpanel').forEach(p => { p.hidden = false; }); document.querySelectorAll('details').forEach(d => { d.open = true; }); CHARTS.forEach(c => c.resize()); });
window.addEventListener('afterprint', () => { document.querySelectorAll('details').forEach(d => { d.open = false; }); setTab(TAB); });
(function init() {
  const t = store('theme'); if (t) document.documentElement.setAttribute('data-theme', t); themeLabel();
  TAB = tabFromHash(); setTab(TAB);
  load(true);
  setInterval(() => { if (!document.hidden) load(false); }, CFG.REFRESH_MINUTES * 60000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden && FETCHED_AT && Date.now() - FETCHED_AT > CFG.REFRESH_MINUTES * 60000) load(false); });
})();
</script>
