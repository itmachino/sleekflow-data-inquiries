<style>
/* Warm report style. One system font, one brown accent for bars.
   Colour only means something: sage = completed by bot, terracotta = human assistance, warm grey = customer stopped replying / no reply,
   red-brown = something to check. Channels have their own colours (WhatsApp green, Instagram red, TikTok blue) and only appear in channel charts. */
:root {
  color-scheme: light;
  --bg: #f7f1e7; --panel: #fffdf9; --soft: #f1e9dc; --hover: #faf5ec; --ink: #201e1d; --muted: #5c544a; --faint: #6c6357; --line: #e2d7c5; --line2: #cfc4b2;
  --accent: #4b4038; --accent-soft: #a89885; --track: #efe6d8;
  --wa: #2e9e5b; --ig: #d4473f; --tt: #2f6db5; --em: #8a8178; --moved: #e3d8c6; --event: rgba(75, 64, 56, .08);
  --ok: #5f7448; --person: #cf7640; --quiet: #bdb5a9; --unknown: #6a5aa0; --alert: #a8431b; --alert-bg: #f9e4d4; --focus: #b8622c;
  --shadow: 0 1px 2px rgba(60, 40, 20, .05), 0 6px 18px rgba(60, 40, 20, .04);
  --r-lg: 16px; --r-md: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #141210; --panel: #1e1b18; --soft: #2a2622; --hover: #25211d; --ink: #f3ede4; --muted: #cbc1b3; --faint: #aca294; --line: #3a342d; --line2: #4f4840;
    --accent: #d8cbb8; --accent-soft: #7d7063; --track: #2b2723;
    --wa: #5cc98a; --ig: #f07a72; --tt: #74a9ea; --em: #a89f94; --moved: #45403a; --event: rgba(216, 203, 184, .09);
    --ok: #93aa73; --person: #e3905d; --quiet: #857d73; --unknown: #a295e6; --alert: #f2a47c; --alert-bg: #3b2519; --focus: #e3905d;
    --shadow: none;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #141210; --panel: #1e1b18; --soft: #2a2622; --hover: #25211d; --ink: #f3ede4; --muted: #cbc1b3; --faint: #aca294; --line: #3a342d; --line2: #4f4840;
  --accent: #d8cbb8; --accent-soft: #7d7063; --track: #2b2723;
  --wa: #5cc98a; --ig: #f07a72; --tt: #74a9ea; --em: #a89f94; --moved: #45403a; --event: rgba(216, 203, 184, .09);
  --ok: #93aa73; --person: #e3905d; --quiet: #857d73; --unknown: #a295e6; --alert: #f2a47c; --alert-bg: #3b2519; --focus: #e3905d;
  --shadow: none;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-variant-numeric: tabular-nums; }
.wrap { max-width: 1440px; margin: 0 auto; padding: 28px 32px 96px; }
a { color: var(--ink); text-decoration-color: var(--line2); text-underline-offset: 3px; }
a:hover { text-decoration-color: currentColor; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
p { text-wrap: pretty; margin: 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---- Header panel (title, tabs) */
.topbar { background: var(--panel); border: 1px solid var(--line2); border-radius: 18px; box-shadow: var(--shadow); padding: 26px 30px 0; }
.hdr { display: flex; flex-wrap: wrap; gap: 16px 24px; align-items: flex-start; justify-content: space-between; }
.brand { font-size: 12.5px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
h1 { margin: 0; font-size: clamp(28px, 4vw, 40px); line-height: 1.1; font-weight: 750; letter-spacing: -.028em; text-wrap: balance; }
.period { margin-top: 8px; font-size: clamp(17px, 2.2vw, 21px); font-weight: 600; color: var(--accent); }
.morning { margin-top: 12px; font-size: 15px; color: var(--ink); }
.morning:empty { display: none; }
.meta { margin-top: 6px; font-size: 13px; color: var(--faint); }
.tools { display: flex; gap: 8px; }
.btn { font: inherit; font-size: 14px; font-weight: 500; color: var(--ink); background: var(--panel); border: 1px solid var(--line2); border-radius: 10px; padding: 0 14px; height: 36px; cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--muted); background: var(--hover); }
.btn:active { background: var(--soft); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.ghost { background: none; color: var(--muted); }
.btn.ghost:hover { color: var(--ink); background: var(--panel); }

/* ---- Tabs */
.tabs { display: flex; gap: 30px; margin-top: 24px; border-top: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { font: inherit; font-size: 15.5px; font-weight: 600; color: var(--muted); background: none; border: 0; border-bottom: 3px solid transparent; padding: 14px 2px 12px; cursor: pointer; white-space: nowrap; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }

/* ---- Filters (quiet) */
.filters { display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: center; padding: 16px 4px 0; }
.f { display: flex; align-items: center; gap: 8px; }
.f label { font-size: 13px; color: var(--muted); }
select, input[type="date"] { font: inherit; font-size: 14px; color: var(--ink); background: var(--panel); border: 1px solid var(--line2); border-radius: 10px; padding: 0 10px; height: 36px; }
select:hover, input[type="date"]:hover { border-color: var(--muted); }
.spacer { flex: 1; }

/* ---- Notices */
#notices { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }
#notices:empty { display: none; }
.notice { background: var(--alert-bg); border-radius: var(--r-md); padding: 12px 18px; font-size: 14px; }
.notice.info { background: var(--soft); }
.notice p + p { margin-top: 2px; }
.notice .tech { font-size: 12.5px; color: var(--muted); }

/* ---- Layout */
.tabpanel { margin-top: 24px; display: flex; flex-direction: column; gap: 20px; }
.tabpanel:focus { outline: none; }
.cols { display: grid; gap: 20px; align-items: stretch; }
.c32 { grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); }
.c11 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.c21 { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); }
.pagehead { display: flex; flex-direction: column; gap: 4px; padding: 4px 2px 0; }
.pagehead h2 { margin: 0; font-size: 26px; line-height: 1.2; font-weight: 750; letter-spacing: -.02em; }
.pagehead p { color: var(--muted); }
.pagehead .src { font-size: 13px; color: var(--faint); }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow); padding: 26px 28px 26px; display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.card-h { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 4px 16px; }
.card-h h3 { margin: 0; font-size: 20px; line-height: 1.25; font-weight: 700; letter-spacing: -.012em; }
.src { font-size: 13px; color: var(--faint); }
.card-h .src { margin-top: 2px; }
.note { font-size: 13px; color: var(--muted); margin-top: 3px; max-width: 62ch; }
.pc { color: var(--muted); font-weight: 400; }
.chg { margin-left: 6px; font-size: 12.5px; color: var(--faint); font-weight: 400; }
.more { font-size: 14px; font-weight: 600; white-space: nowrap; }
.lede { font-size: 16px; }
.def { font-size: 12.5px; color: var(--faint); }
.foot { font-size: 13.5px; color: var(--muted); }
.muted { color: var(--muted); }
h4.subh { margin: 8px 0 0; font-size: 16px; font-weight: 700; }
.lab-c { display: inline-flex; align-items: center; gap: 8px; }
.key { display: inline-block; width: 10px; height: 10px; border-radius: 999px; flex: none; }

/* ---- Number cards */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow); padding: 22px 24px 20px; display: flex; flex-direction: column; min-width: 0; }
.k-label { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.k-src { margin-top: auto; padding-top: 14px; font-size: 12px; color: var(--faint); }
.k-val { margin-top: 12px; font-size: clamp(36px, 4.4vw, 50px); font-weight: 750; letter-spacing: -.035em; line-height: 1.05; overflow-wrap: anywhere; }
.k-val.txt { font-size: clamp(26px, 2.9vw, 34px); letter-spacing: -.025em; line-height: 1.12; padding: 4px 0 3px; overflow-wrap: normal; text-wrap: balance; }

.kpi .def { margin-top: 10px; }
.card .kpi { box-shadow: none; background: var(--hover); }
.card .k-label { min-height: 3.1em; align-items: flex-start; }
.card .k-label .key { margin-top: .3em; }
.kpi > :last-child { margin-bottom: 0; }

/* ---- Status strip (things to check) */
.status { display: flex; gap: 14px; align-items: flex-start; padding: 16px 22px; border-radius: var(--r-lg); background: var(--panel); border: 1px solid var(--line); }
.status.warn { background: var(--alert-bg); border-color: transparent; }
.status .ico { flex: none; width: 24px; height: 24px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800; line-height: 1; color: var(--panel); background: var(--ok); margin-top: 1px; }
.status.warn .ico { background: var(--alert); }
.st-h { font-weight: 700; font-size: 15px; }
.status.ok .st-h { font-weight: 600; color: var(--muted); }
.status ul { list-style: none; margin: 6px 0 0; padding: 0; display: flex; flex-direction: column; gap: 4px; font-size: 14.5px; }
.status li { padding-left: 16px; position: relative; }
.status li::before { content: ""; position: absolute; left: 2px; top: .62em; width: 6px; height: 6px; border-radius: 999px; background: var(--alert); }
.status .src { margin-top: 6px; }

/* ---- Ranked bars (what customers ask about, common concerns) */
.rank { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 16px; }
.rk { display: grid; grid-template-columns: minmax(110px, 170px) minmax(0, 1fr) 46px 44px; grid-template-areas: "name bar n p"; align-items: center; gap: 4px 14px; }
.rk.cmp { grid-template-columns: minmax(110px, 170px) minmax(0, 1fr) 46px 44px 88px; grid-template-areas: "name bar n p vs"; }
.rk.narrow { grid-template-columns: minmax(0, 1fr) 46px; grid-template-areas: "name n" "bar bar"; }
.rk-name { grid-area: name; font-size: 15px; font-weight: 600; line-height: 1.3; }
.rk-name small { display: block; font-size: 12.5px; font-weight: 400; color: var(--faint); }
.rk-track { grid-area: bar; height: 12px; border-radius: 999px; background: var(--track); overflow: hidden; }
.rk-track i { display: block; height: 100%; min-width: 4px; border-radius: 999px; background: var(--accent-soft); }
.rk.first .rk-track i { background: var(--accent); }
.rk-n { grid-area: n; text-align: right; font-size: 17px; font-weight: 700; }
.rk-p { grid-area: p; text-align: right; font-size: 13.5px; color: var(--muted); }
.rk-vs { grid-area: vs; text-align: right; font-size: 12.5px; color: var(--faint); white-space: nowrap; }

/* ---- Outcome rows (small, quiet) */
.oc-bar { display: flex; gap: 3px; height: 12px; }
.oc-bar span { display: block; border-radius: 999px; min-width: 6px; }
.oc { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.oc li { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; align-items: baseline; gap: 2px 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.oc li:last-child { border-bottom: 0; padding-bottom: 0; }
.oc .key { align-self: center; }
.oc-name { font-size: 15px; font-weight: 600; }
.oc-v { font-size: 22px; font-weight: 700; letter-spacing: -.02em; text-align: right; }
.oc-c { grid-column: 2 / 4; font-size: 13px; color: var(--muted); }
.reply { background: var(--soft); border-radius: var(--r-md); padding: 14px 18px; display: flex; flex-direction: column; gap: 2px; }
.reply .main { font-size: 15px; }

/* ---- Two "chosen most" lists */

/* ---- Tables */
.tw { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14.5px; }
th { text-align: left; font-weight: 650; font-size: 12px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); padding: 0 12px 10px; border-bottom: 1px solid var(--line2); vertical-align: bottom; }
td { padding: 13px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th:first-child, td:first-child { padding-left: 4px; }
tbody tr:last-child td { border-bottom: 0; }

.defs td:first-child { font-weight: 650; white-space: nowrap; }
.defs td { vertical-align: top; }

.tblctl { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 14px; }
.tblctl .lnk { white-space: nowrap; }
.lnk { font: inherit; background: none; border: 0; padding: 4px 0; color: var(--ink); cursor: pointer; text-decoration: underline; text-decoration-color: var(--line2); text-underline-offset: 3px; }
.lnk:hover { text-decoration-color: currentColor; }
.topics td.barcell { width: 18%; }

.bar { height: 10px; border-radius: 999px; background: var(--accent); min-width: 4px; }
.topics tbody.grp { border-bottom: 1px solid var(--line); }

.topics tbody.grp td { border-bottom: 0; }

.topics tr.top td.muted { font-weight: 400; }
.tgl { font: inherit; font-weight: 700; color: var(--ink); background: none; border: 0; display: inline-flex; align-items: center; gap: 9px; cursor: pointer; min-height: 40px; border-radius: 999px; padding: 4px 14px 4px 4px; margin: -6px 0 -6px -4px; text-align: left; }
.tgl:hover { background: var(--soft); }
.chev { width: 28px; height: 28px; flex: none; border-radius: 999px; background: var(--soft); display: inline-flex; align-items: center; justify-content: center; transition: transform .2s ease; }

.hint { font-size: 12.5px; font-weight: 500; color: var(--faint); white-space: nowrap; }
.plain { display: inline-block; padding-left: 37px; }
.topics tr.sub td { padding: 0; border: 0; color: var(--muted); font-size: 14px; }
.cl { display: grid; grid-template-rows: 1fr; transition: grid-template-rows .2s ease; }
.cl > div { min-height: 0; overflow: hidden; }

.tree { position: relative; display: block; padding-left: 50px; }
.tree::before { content: ""; position: absolute; left: 15px; top: -6px; bottom: -6px; border-left: 1.5px solid var(--line2); }
.tree::after { content: ""; position: absolute; left: 15px; top: 50%; width: 22px; border-top: 1.5px solid var(--line2); }
tr.sub.last .tree::before { bottom: 50%; }
tr.sub.last .p { padding-bottom: 12px !important; }
tr.sub .bar { height: 6px; background: var(--accent-soft); }
.tag { display: block; width: max-content; margin: 3px 0 0 auto; font-size: 11.5px; font-weight: 600; color: var(--ink); background: var(--soft); border-radius: 999px; padding: 1px 9px; }

/* ---- Colour key */
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13.5px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 7px; }

.legend i.ev { background: var(--event); border: 1px dashed var(--line2); }
.legend b { color: var(--ink); font-weight: 650; }

/* ---- Completed-by-bot and human-assistance cards (matched pair) */
.side { border-top: 4px solid var(--line2); }
.side-bot { border-top-color: var(--ok); }
.side-human { border-top-color: var(--person); }
.side .card-h h3 { display: flex; align-items: center; gap: 10px; }
.side-total { font-size: 14px; color: var(--muted); white-space: nowrap; text-align: right; }
.side-total b { display: block; font-size: 32px; line-height: 1.05; letter-spacing: -.03em; color: var(--ink); font-weight: 750; }
.side-t td.barcell { width: 34%; }
.endbar { display: flex; gap: 2px; height: 10px; min-width: 110px; }
.endbar span { display: block; border-radius: 3px; min-width: 3px; }
.topics.wide td.barcell { width: 16%; }
.topics.wide th { white-space: normal; }
.example { font-size: 14.5px; background: var(--soft); border-radius: var(--r-md); padding: 12px 16px; }
.side-t td.num { white-space: nowrap; }
.tblctl .src { margin-left: auto; align-self: center; }

/* ---- Chart and small facts */
.chart { position: relative; height: 300px; }
.facts { display: flex; flex-wrap: wrap; gap: 8px; }
.fact { background: var(--soft); border-radius: 999px; padding: 7px 16px; font-size: 14px; }
.notes ul { margin: 0; padding-left: 18px; color: var(--muted); font-size: 14px; }
.notes li { margin: 5px 0; }
.loading { padding: 60px 6px; color: var(--muted); }
details.more-info { border-top: 1px solid var(--line); padding-top: 14px; }
details.more-info summary { cursor: pointer; font-size: 14px; font-weight: 600; color: var(--muted); }
details.more-info summary:hover { color: var(--ink); }
details.more-info .tw { margin-top: 12px; }

@media (max-width: 900px) {
  .cols { grid-template-columns: minmax(0, 1fr); }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

@media (prefers-reduced-motion: reduce) { .cl, .chev, .grp:not(.open) tr.sub .cl > div { transition: none; } }

@media print {
  :root, :root[data-theme="dark"], :root:not([data-theme="light"]) {
    color-scheme: light; --bg: #fff; --panel: #fff; --soft: #f3eee6; --hover: #fff; --ink: #1d1b1a; --muted: #4d463e; --faint: #5f574d; --line: #d9d1c3; --line2: #b9ae9c;
    --accent: #4b4038; --accent-soft: #a89885; --track: #eee7db; --wa: #2e9e5b; --ig: #d4473f; --tt: #2f6db5; --em: #8a8178; --moved: #e3d8c6; --event: rgba(75, 64, 56, .08); --ok: #5f7448; --person: #cf7640; --quiet: #bdb5a9; --unknown: #6a5aa0; --alert: #a8431b; --alert-bg: #f9e4d4; --shadow: none;
  }

  .rk { grid-template-columns: minmax(90px, 130px) minmax(0, 1fr) 40px 40px; grid-template-areas: "name bar n p"; }
  .rk.cmp { grid-template-columns: minmax(90px, 130px) minmax(0, 1fr) 40px 40px 70px; grid-template-areas: "name bar n p vs"; }
  .rk.narrow { grid-template-columns: minmax(0, 1fr) 40px; grid-template-areas: "name n" "bar bar"; }
  .rk-vs { display: block; }
  .card-h, h4.subh { break-after: avoid; }

  .side-t td.barcell, .side-t th.hide-sm { display: none; }
  .cl { grid-template-rows: 1fr !important; }
  .cl > div { visibility: visible !important; }
  .chev { display: none; }
  .tgl { padding-left: 0; margin-left: 0; }

  .tree { padding-left: 34px; }

  .chart { height: 220px; }

}

const norm = s => String(s == null ? '' : s).toLowerCase().replace(/[^a-z0-9]/g, '');

/** RFC-4180-style CSV to rows (quoted commas, "" escapes, CRLF). */
function parseCSV(text) {
  const rows = []; let row = []; let field = ''; let q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else q = false; }
      else field += c;
    } else if (c === '"') q = true;
    else if (c === ',') { row.push(field); field = ''; }

      row.push(field); rows.push(row); row = []; field = '';
    } else field += c;
  }
  if (field !== '' || row.length) { row.push(field); rows.push(row); }

}

function findColumns(header) {
  const n = header.map(norm); const cols = {};
  Object.keys(CFG.COLUMNS).forEach(f => {

  const ZONE = '\\s*(Z|(?:UTC|GMT)?\\s*[+-]\\d{2}:?\\d{2})?$';
  const zoneMin = z => { if (!z) return null; if (/^z$/i.test(z)) return 0; const t = z.replace(/UTC|GMT|\s|:/gi, ''); return (t[0] === '-' ? -1 : 1) * (Number(t.slice(1, 3)) * 60 + Number(t.slice(3, 5))); };

const wall = ms => { const d = new Date(ms + CFG.OFFSET_H * 3600000); return { y: d.getUTCFullYear(), m: d.getUTCMonth(), d: d.getUTCDate(), h: d.getUTCHours(), mi: d.getUTCMinutes(), dow: d.getUTCDay() }; };

let TOPIC_IDX = null, DETAIL_IDX = null;
/** Known topics only; anything else counts as "Other" (this page is public). */
function topicName(raw) {

const topicOrder = name => { const i = CFG.TOPICS.findIndex(t => t.name === name); return i === -1 ? 999 : i; };

/** Rows (with header) to bot chats. Test rows, repeats and unreadable dates are counted, not used. */
function readChats(values) {
  const stats = { rows: 0, test: 0, unreadable: 0, duplicates: 0, sample: 0 };
  const chats = []; const firstSeenTopic = {}; const firstSeenConcern = {}; const firstSubMs = {}; let logStartMs = null, newestMs = null;
  if (!values.length) return { chats, stats, firstSeenTopic, firstSeenConcern, firstSubMs, logStartMs, newestMs };
  const cols = findColumns(values[0]);
  const cell = (row, f) => (cols[f] === undefined ? '' : (row[cols[f]] == null ? '' : row[cols[f]]));
  let prevKey = null;
  for (let i = 1; i < values.length; i++) {
    const row = values[i];

function countRange(chats, r) {
  const o = { chats: 0, BOT: 0, HUMAN: 0, QUIET: 0, UNKNOWN: 0, quietNoAnswer: 0, noTopic: 0, noTopicHuman: 0, sample: 0, topics: {}, topicHuman: {}, concerns: {}, concernHuman: {}, systemErrors: {}, channels: {} };

    if (c.ms < r.start || c.ms >= r.end) return;
    o.chats++; o[c.outcome]++; const human = c.outcome === 'HUMAN';

    if (!c.topics.length) { o.noTopic++; if (human) o.noTopicHuman++; if (c.outcome === 'QUIET') o.quietNoAnswer++; }
    c.topics.forEach(t => { o.topics[t] = (o.topics[t] || 0) + 1; });
    if (human && c.lastTopic) o.topicHuman[c.lastTopic] = (o.topicHuman[c.lastTopic] || 0) + 1;
    c.concerns.forEach(k => { o.concerns[k.label] = (o.concerns[k.label] || 0) + 1; if (k.systemError) o.systemErrors[k.label] = (o.systemErrors[k.label] || 0) + 1; });
    if (human && c.lastConcern) o.concernHuman[c.lastConcern] = (o.concernHuman[c.lastConcern] || 0) + 1;

/** Outcome per topic (rule B2): "resolved by bot" = the chat ended resolved by bot and included the topic;
    "handed" and "stopped" = only the chat's LAST topic; every other topic in those chats "moved on". */
function topicOutcomes(chats, r) {
  const res = {};

      const o = res[t] || (res[t] = { chats: 0, resolved: 0, handed: 0, stopped: 0, moved: 0, other: 0 });

  });

/** Sub-topics per topic (rules B3, B4). A topic's sub-topic base only counts chats from the day its sub-topics were first recorded. */

    c.topics.forEach(t => {

/** Period keys: this | last | d7 | d30 | m:YYYY-MM | r:YYYY-MM-DD:YYYY-MM-DD (both days included). */

    p.compareText = rangeText(p.compare.start, p.compare.end, false);

function diffText(diff) { return diff > 0 ? { t: '▲ ' + diff + ' more', c: 'up' } : diff < 0 ? { t: '▼ ' + (-diff) + ' fewer', c: 'down' } : { t: 'same', c: '' }; }

/** Names of the special days (CFG.EVENTS) that overlap [start, end). */
function eventsTouching(start, end) {

/** Everything the bot part shows, for one period. */
function summarize(read, nowMs, key) {
  const p = periodFor(key, nowMs, read.logStartMs);
  const main = countRange(read.chats, p.main), compare = countRange(read.chats, p.compare), today = countRange(read.chats, p.today);
  const canCompare = read.logStartMs !== null && read.logStartMs < p.compare.start && p.compare.end > p.compare.start;
  const events = uniq(eventsTouching(p.main.start, Math.min(p.main.end, p.today.end)).concat(canCompare ? eventsTouching(p.compare.start, p.compare.end) : []));
  const topicRows = Object.keys(main.topics).map(name => {
    const c = compare.topics[name] || 0; const isNew = canCompare && read.firstSeenTopic[name] >= p.compare.start;
    return { name, chats: main.topics[name], human: main.topicHuman[name] || 0, compare: c, isNew, vs: !canCompare ? { t: '–', c: '' } : isNew ? { t: 'new', c: 'new' } : diffText(main.topics[name] - c) };

  if (canCompare && longEnough && !events.length) {
    const rises = (n, b) => n >= A.MIN_CHATS && n - b >= A.MIN_RISE && n >= A.MIN_RATIO * b;
    topicRows.forEach(r => { if (!r.isNew && rises(r.chats, r.compare)) alerts.push({ level: 'mid', text: r.name + ' is up: ' + r.chats + ' bot chats, compared with ' + r.compare + ' in ' + p.compareText + '.' }); });

    const share = (n, t) => (t ? 100 * n / t : 0);
    const shareRise = (n, b) => compare.chats > 0 && main.chats > 0 && share(n, main.chats) - share(b, compare.chats) >= A.SHARE_POINTS && n - b >= A.MIN_RISE;
    if (shareRise(main.topics.Other || 0, compare.topics.Other || 0)) alerts.push({ level: 'mid', text: 'More bot chats are "Other" than before. The menu may be missing something.' });
    if (shareRise(main.noTopic, compare.noTopic)) alerts.push({ level: 'mid', text: 'More customers leave before picking a topic than before.' });

// ------------------------------------------------------------------ Daily Log (all channels)
/** Daily Log rows (title lines above the header are fine) to days. Blank = unknown, never zero. */
function readDaily(values) {
  const hi = values.findIndex(r => norm(r[0]) === 'date');
  if (hi === -1) throw new Error('the Daily Log has no "Date" heading row.');
  const n = values[hi].map(norm); const cols = {};
  Object.keys(CFG.DAILY_COLUMNS).forEach(f => { for (const name of CFG.DAILY_COLUMNS[f]) { const i = n.indexOf(norm(name)); if (i !== -1) { cols[f] = i; break; } } });
  const missing = ['date', 'whatsapp', 'instagram', 'tiktok'].filter(f => cols[f] === undefined);
  if (missing.length) throw new Error('the Daily Log is missing column(s): ' + missing.map(f => CFG.DAILY_COLUMNS[f][0]).join(', ') + '.');
  const num = v => { const s = String(v == null ? '' : v).trim(); if (s === '' || s === '-') return null; const x = Number(s.replace(/,/g, '')); return isFinite(x) && x >= 0 ? Math.round(x) : null; };
  const get = (row, f) => (cols[f] === undefined ? null : num(row[cols[f]]));

  values.slice(hi + 1).forEach(row => {
    const raw = String(row[cols.date] == null ? '' : row[cols.date]).trim(); if (!raw) return;
    const ms = isoDay(raw); if (ms === null) { unreadable++; return; }
    const wa = get(row, 'whatsapp') || 0, ig = get(row, 'instagram') || 0, tt = get(row, 'tiktok') || 0, em = get(row, 'email') || 0;
    const ch = wa + ig + tt + em; const total = get(row, 'total'); const bot = get(row, 'bot'), staff = get(row, 'staff'), none = get(row, 'noreply');
    const complete = bot !== null && staff !== null && none !== null && bot + staff + none === ch;
    byDate[raw] = { date: raw, ms, wa, ig, tt, em, ch, total: total === null ? ch : total, bot, staff, none, med: get(row, 'replytime'), complete };
  });
  const days = Object.keys(byDate).map(k => byDate[k]).sort((a, b) => a.ms - b.ms);

/** Value at position p (0 to 1) of sorted numbers, the "exclusive" way (median for p = 0.5). */

  const n = xs.length; if (!n) return null;
  const pos = p * (n + 1); const j = Math.floor(pos); const d = pos - j;
  if (j < 1) return xs[0]; if (j >= n) return xs[n - 1];
  return xs[j - 1] + d * (xs[j] - xs[j - 1]);
}

/** Totals for a list of days. Volume uses every day; who-answered and reply time use complete days only (rule A2, A3). */
function aggDaily(list) {
  const o = { days: list.length, enq: 0, wa: 0, ig: 0, tt: 0, em: 0, completeDays: 0, incomplete: [], bot: 0, staff: 0, none: 0, meds: [] };
  list.forEach(d => {
    o.enq += d.total; o.wa += d.wa; o.ig += d.ig; o.tt += d.tt; o.em += d.em;
    if (!d.complete) { o.incomplete.push(d); return; }
    o.completeDays++; o.bot += d.bot; o.staff += d.staff; o.none += d.none;
    if (d.med !== null && d.staff >= CFG.MIN_STAFF_FOR_TIME) o.meds.push(d.med);
  });
  o.who = o.bot + o.staff + o.none;
  o.perDay = o.days ? o.enq / o.days : null;
  const s = o.meds.slice().sort((a, b) => a - b);
  o.reply = s.length ? { n: s.length, mid: Math.round(percentile(s, 0.5)), lo: Math.round(percentile(s, 0.25)), hi: Math.round(percentile(s, 0.75)) } : null;
  return o;
}

/** Everything Part A shows, for one period. */
function summarizeA(rd, nowMs, key, logStartMs) {
  const p = periodFor(key, nowMs, logStartMs);
  const lastEnd = rd.days.length ? rd.lastMs + DAY : 0;
  const mainEnd = Math.min(p.main.end, lastEnd);
  const inR = (s, e) => rd.days.filter(d => d.ms >= s && d.ms < e);
  const mainList = inR(p.main.start, mainEnd), cmpList = inR(p.compare.start, p.compare.end);
  const cmpExpected = Math.ceil((p.compare.end - p.compare.start) / DAY - 1e-9);
  const main = aggDaily(mainList), cmp = aggDaily(cmpList);
  const covered = rd.days.length > 0 && cmpExpected > 0 && mainList.length > 0 && p.compare.start >= rd.firstMs && cmpList.length === cmpExpected;
  const shareOk = covered && main.completeDays >= CFG.MIN_COMPLETE_SHARE * main.days && cmp.completeDays >= CFG.MIN_COMPLETE_SHARE * cmp.days;
  const events = uniq(eventsTouching(p.main.start, mainEnd).concat(covered ? eventsTouching(p.compare.start, p.compare.end) : []));

  // busiest / quietest weekday: the middle value per weekday, only with enough of each weekday (rule A5)
  let weekday = null;
  const per = [[], [], [], [], [], [], []]; mainList.forEach(d => per[wall(d.ms).dow].push(d.total));
  if (per.every(a => a.length >= CFG.WEEKDAY_MIN_EACH)) {
    const mid = per.map(a => percentile(a.slice().sort((x, y) => x - y), 0.5));
    const order = [1, 2, 3, 4, 5, 6, 0].sort((a, b) => mid[b] - mid[a]);
    const top = order[0], second = order[1], low = order[6];
    const lowGroup = order.filter(d => mid[d] <= mid[low] * 1.05);            // the quietest day(s), ties included
    const outside = order.filter(d => lowGroup.indexOf(d) === -1);            // everything else, busiest first
    const nextUp = outside.length ? outside[outside.length - 1] : null;       // the quietest day that is NOT in the group
    weekday = {
      busiest: mid[top] >= CFG.WEEKDAY_LEAD * mid[second] ? { day: DAYS[top], n: Math.round(mid[top]) } : null,
      quietest: nextUp !== null && mid[nextUp] >= CFG.WEEKDAY_LEAD * mid[low] && lowGroup.length <= 2 ? { days: lowGroup.slice().sort((a, b) => ((a + 6) % 7) - ((b + 6) % 7)).map(d => DAYS[d]), n: Math.round(mid[low]) } : null,
      mid,
    };
  }

  // chart: enquiries per day (per week for long periods); days inside a special event are marked
  const span = Math.max(0, mainEnd - p.main.start); const unit = span <= 62 * DAY ? 'day' : 'week';
  const buckets = [];
  if (unit === 'day') for (let t = p.main.start; t < mainEnd; t += DAY) { const d = mainList.find(x => x.ms === t); buckets.push({ start: t, end: t + DAY, label: dayText(t), total: d ? d.total : 0, missing: !d }); }
  else for (let t = p.main.start; t < mainEnd; t += 7 * DAY) { const e = Math.min(t + 7 * DAY, mainEnd); buckets.push({ start: t, end: e, label: dayText(t), partial: e - t < 7 * DAY, total: mainList.filter(d => d.ms >= t && d.ms < e).reduce((a, d) => a + d.total, 0) }); }
  buckets.forEach(b => { b.event = eventsTouching(b.start, b.end).length > 0; });

  // months (whole log)
  const months = []; const nw = wall(nowMs);
  for (let i = 5; i >= 0; i--) {
    const start = fromWall(nw.y, nw.m - i, 1); const sw = wall(start); const end = fromWall(sw.y, sw.m + 1, 1);
    const list = inR(start, end); if (!list.length) continue;
    months.push(Object.assign({ label: MONTHS[sw.m] + ' ' + sw.y + (lastEnd < end ? ' (so far)' : '') }, aggDaily(list)));
  }

  // things to check
  const alerts = [];
  if (rd.days.length && nowMs - lastEnd > CFG.DAILY_STALE_HOURS * 3600000) alerts.push({ level: 'high', text: 'The Daily Log has not been filled since ' + dayText(rd.lastMs) + '. Please tell ' + CFG.ADMIN_NAME + '.' });
  if (shareOk && mainList.length >= CFG.NOREPLY_ALERT_DAYS && !events.length && main.who && cmp.who) {
    const a = 100 * main.none / main.who, b = 100 * cmp.none / cmp.who;
    if (a - b >= CFG.NOREPLY_ALERT_POINTS) alerts.push({ level: 'mid', text: 'No reply from us is up: ' + Math.round(a) + '% of enquiries, compared with ' + Math.round(b) + '% in ' + p.compareText + '.' });
  }

  // the morning line
  let morning = null;
  if (rd.days.length) {
    const last = rd.days[rd.days.length - 1]; const yes = toIso(nowMs - DAY) === last.date;
    morning = (yes ? 'Yesterday (' : 'Latest day in the Daily Log (') + dayText(last.ms) + '): ' + last.total + ' enquiries' + (last.none === null ? '.' : ', ' + last.none + ' with no reply from us.');
  }
  return { p, main, cmp, covered, shareOk, events, weekday, buckets, unit, months, alerts, morning, mainList, lastMs: rd.lastMs, mainEnd };
}

/** Days with 10+ WhatsApp enquiries in the Daily Log but no bot chats in the Tracker (rule B7). */
function botLogGaps(rd, read, p) {
  if (!rd || !read || read.logStartMs === null) return [];
  const per = {}; read.chats.forEach(c => { const k = dayStart(c.ms); per[k] = (per[k] || 0) + 1; });
  const start = dayStart(read.logStartMs);
  return rd.days.filter(d => d.ms >= p.main.start && d.ms < p.main.end && d.ms >= start && d.wa >= CFG.MISSING_LOG_MIN_WA && !per[d.ms]).map(d => d.ms);
}
/* ==================================================================== LOGIC-END */

/* ==================================================================== EMAIL-LOGIC-START
   R1/R2 email numbers from the private sheet "Machino CS — Private Data" (tabs Email Daily Total, Enquiry Types,
   Email Count Log), which reach the page only through the Dashboard API after login. Counts only: never names,
   addresses or subjects. Tested by google-apps-script/tracker/test-dashboard-email.js (reads this block). */
const EMAIL_CFG = {
  TOTAL: { date: 'Date', total: 'Email enquiries (all mailboxes, de-duplicated)', postco: 'Return portal (PostCo)', contact: 'Of which: contact form (Shopify)', updated: 'Updated at' },
  TYPES: { date: 'Date', channel: 'Channel', total: 'Total', unclear: 'Unclear' },
  TYPES_CHANNEL: 'Email',
  CATEGORIES: [['DEFECT', 'Defect / Complaint'], ['ORDER', 'Order Status / Delivery'], ['RETURN', 'Return / Exchange'], ['SIZING', 'Sizing'], ['STORE', 'Store / Stock'], ['OTHER', 'Other / Unknown']],
  RUNS: { at: 'Run at', date: 'Date', note: 'Note' },
  // Email Log: customer detail. Only arrives when the Dashboard API owner switched SHOW_EMAIL_LOG on.
  LOG: { date: 'Date', time: 'Time', from: 'From', address: 'Email', subject: 'Subject', category: 'Category', keywords: 'Keywords', order: 'Order No', link: 'Link', why: 'Why', counted: 'In the daily email number? (Yes / No / Separate = PostCo)' },
  STALE_HOURS: 16,             // runs at about 9am, 12pm, 4pm and 8pm; the longest normal gap is 8pm → 9am (13 h)
  LOG_SHOW_MAX: 100,           // Email Log rows shown at once (search to narrow down)
  // Amani 21 Oct: promotions, newsletters and automatic mail are not shown in the Email Log (they were never counted).
  LOG_HIDE: /gmail promotions|company \/ platform, not a customer|automatic email/i,
};
const emNum = v => { const s = String(v === null || v === undefined ? '' : v).replace(/,/g, '').trim(); if (s === '') return null; const n = Number(s); return isFinite(n) ? n : null; };
const emNorm = s => String(s === null || s === undefined ? '' : s).trim().toLowerCase().replace(/\s+/g, ' ');

/** values: rows of text. want: { key: header name }. The header row is found by name (first key required). Returns row objects or null. */
function emTable(values, want) {
  if (!Array.isArray(values)) return null;
  const keys = Object.keys(want);
  for (let h = 0; h < Math.min(values.length, 10); h++) {
    const head = (values[h] || []).map(emNorm); const idx = {};
    keys.forEach(k => { idx[k] = head.indexOf(emNorm(want[k])); });
    if (idx[keys[0]] === -1 || idx[keys[1]] === -1) continue;
    return values.slice(h + 1).map(r => { const o = {}; keys.forEach(k => { o[k] = idx[k] >= 0 ? (r || [])[idx[k]] : ''; }); return o; });
  }
  return null;
}

/** "2026-10-21 14:25" (Malaysia time) → ms, or null. Older rows written before 21 Oct may hold another format: null. */
function emStampMs(s) {
  const m = /^\s*'?(\d{4})-(\d{2})-(\d{2})[ T](\d{1,2}):(\d{2})/.exec(String(s || ''));
  return m ? fromWall(+m[1], +m[2] - 1, +m[3], +m[4], +m[5]) : null;
}

/** The API's email part → { days: [{ iso, ms, total, postco, contact, updatedMs }], types: { iso: { DEFECT…, total, unclear } }, lastOkMs, lastRunMs, lastFailed, problems } */
function readEmail(email) {
  const out = { days: [], types: {}, lastOkMs: null, lastRunMs: null, lastFailed: false, problems: [] };
  const total = emTable(email && email.total, EMAIL_CFG.TOTAL);
  if (!total) out.problems.push('the Email Daily Total tab could not be read');
  else total.forEach(r => {
    const ms = isoDay(String(r.date).trim()); const n = emNum(r.total);
    if (ms === null || n === null) return;
    out.days.push({ iso: toIso(ms), ms, total: n, postco: emNum(r.postco) || 0, contact: emNum(r.contact) || 0, updatedMs: emStampMs(r.updated) });
  });
  out.days.sort((a, b) => a.ms - b.ms);
  const want = Object.assign({}, EMAIL_CFG.TYPES); EMAIL_CFG.CATEGORIES.forEach(c => { want[c[0]] = c[1]; });
  const types = emTable(email && email.types, want);
  if (!types) out.problems.push('the Enquiry Types tab could not be read');
  else types.forEach(r => {
    const ms = isoDay(String(r.date).trim());
    if (ms === null || emNorm(r.channel) !== emNorm(EMAIL_CFG.TYPES_CHANNEL)) return;
    const o = { total: emNum(r.total) || 0, unclear: emNum(r.unclear) || 0 }; EMAIL_CFG.CATEGORIES.forEach(c => { o[c[0]] = emNum(r[c[0]]) || 0; });
    out.types[toIso(ms)] = o;
  });
  const runs = emTable(email && email.runs, EMAIL_CFG.RUNS) || [];
  runs.forEach(r => {
    const ms = emStampMs(r.at); if (ms === null) return;
    const ok = /^\s*OK\b/i.test(String(r.note || ''));
    if (out.lastRunMs === null || ms >= out.lastRunMs) { out.lastRunMs = ms; out.lastFailed = !ok; }
    if (ok && (out.lastOkMs === null || ms > out.lastOkMs)) out.lastOkMs = ms;
  });
  if (out.lastOkMs === null) out.days.forEach(d => { if (d.updatedMs !== null && (out.lastOkMs === null || d.updatedMs > out.lastOkMs)) out.lastOkMs = d.updatedMs; });
  out.log = null;
  if (email && email.log) {
    const rows = emTable(email.log, EMAIL_CFG.LOG);
    const shown = rows ? rows.filter(r => isoDay(String(r.date).trim()) !== null && !(emNorm(r.counted) !== 'yes' && EMAIL_CFG.LOG_HIDE.test(String(r.why || '')))) : null;
    out.logHidden = rows && shown ? rows.length - shown.length : 0;
    out.log = shown ? shown.map(r => Object.assign({}, r, { iso: toIso(isoDay(String(r.date).trim())) })) : null;
  }
  return out;
}

/**
 * The Email tab's filters on the chosen period's days. f: { q, cat, days: 'all'|'weekday'|'weekend', min, postco, contact, sort }.
 * cat = a category key: each day's number becomes that category's count and days without it drop out.
 * q matches the date ("2026-10-21", "21 Oct"), the weekday ("Monday") and the busiest category name.
 */
function filterEmailDays(SE, re, f) {
  f = f || {};
  const q = emNorm(f.q), min = f.min === '' || f.min === null || f.min === undefined ? null : Number(f.min);
  const topCat = t => { if (!t) return ''; let best = null; EMAIL_CFG.CATEGORIES.forEach(([k, name]) => { if ((t[k] || 0) > 0 && (!best || t[k] > t[best[0]])) best = [k, name]; }); return best ? best[1] : ''; };
  let rows = SE.main.list.map(d => {
    const t = re.types[d.iso] || null, dow = wall(d.ms).dow;
    return Object.assign({}, d, { cats: t, dow, top: topCat(t), n: f.cat ? (t ? t[f.cat] || 0 : 0) : d.total });
  }).filter(d => {
    const weekend = d.dow === 0 || d.dow === 6;
    if (f.days === 'weekday' && weekend) return false;
    if (f.days === 'weekend' && !weekend) return false;
    if (f.cat && !(d.n > 0)) return false;
    if (min !== null && isFinite(min) && d.n < min) return false;
    if (f.postco && !(d.postco > 0)) return false;
    if (f.contact && !(d.contact > 0)) return false;
    if (q && emNorm([d.iso, dayText(d.ms), dayText(d.ms) + ' ' + wall(d.ms).y, DAYS[d.dow], d.top].join(' | ')).indexOf(q) === -1) return false;
    return true;
  });
  const by = { newest: (a, b) => b.ms - a.ms, oldest: (a, b) => a.ms - b.ms, most: (a, b) => b.n - a.n || b.ms - a.ms, fewest: (a, b) => a.n - b.n || b.ms - a.ms };
  rows.sort(by[f.sort] || by.newest);
  return { rows, of: SE.main.list.length, n: rows.reduce((a, d) => a + d.n, 0), postco: rows.reduce((a, d) => a + d.postco, 0), contact: rows.reduce((a, d) => a + d.contact, 0),
    label: f.cat ? (EMAIL_CFG.CATEGORIES.find(c => c[0] === f.cat) || [, 'Email enquiries'])[1] : 'Email enquiries' };
}

/**
 * The Daily Log with Email filled in from the HELLO email counter (Amani 21 Oct: show email in the Daily Log too).
 * Only days whose own Email cell is 0/blank are filled, so nothing is ever counted twice (e.g. once PRODUCTION mode
 * writes the sheet's Email column). The email number is added to that day's channel bars and Total enquiries.
 * "Who replied" stays on the SleekFlow channels it measures: ch and complete are left as they were.
 * Returns a NEW object (the read data is never changed) with emailDays = how many days got an email number.
 */
function withEmail(rd, re) {
  if (!rd || !re || !re.days.length) return rd;
  const by = {}; re.days.forEach(d => { by[d.iso] = d.total; });
  let emailDays = 0;
  const days = rd.days.map(d => {
    const iso = toIso(d.ms);
    if (d.em || !(iso in by)) return d;
    emailDays++;
    return Object.assign({}, d, { em: by[iso], total: d.total + by[iso], emFromCounter: true });
  });
  return Object.assign({}, rd, { days, emailDays });
}

/** Email Log rows (only when the owner switched them on) after search + filters. f: { q, cat, counted, day }. Newest first. */
function filterEmailLog(log, f) {
  f = f || {}; const q = emNorm(f.q);
  return (log || []).filter(r => {
    if (f.day && r.iso !== f.day) return false;
    if (f.counted && emNorm(r.counted) !== emNorm(f.counted)) return false;
    if (!f.counted && f.customersOnly && emNorm(r.counted) !== 'yes') return false;   // 'Customers only' (a Counted? choice wins)
    if (f.cat && emNorm(r.category).indexOf(emNorm(f.cat)) !== 0) return false;
    if (q && emNorm([r.from, r.address, r.subject, r.category, r.keywords, r.order, r.why].join(' | ')).indexOf(q) === -1) return false;
    return true;
  }).sort((a, b) => (b.iso + ' ' + b.time).localeCompare(a.iso + ' ' + a.time));
}

/** Email numbers for the chosen period P (from periodFor), the day before, today so far, categories and data health. */
function summarizeEmail(re, P, nowMs) {
  const todayIso = toIso(nowMs), ydayIso = toIso(nowMs - DAY);
  const pick = r => re.days.filter(d => d.ms >= r.start && d.ms < r.end);
  const sum = (list, k) => list.reduce((a, d) => a + d[k], 0);
  const catSum = list => { const o = { total: 0, unclear: 0 }; EMAIL_CFG.CATEGORIES.forEach(c => { o[c[0]] = 0; }); list.forEach(d => { const t = re.types[d.iso]; if (!t) return; Object.keys(o).forEach(k => { o[k] += t[k] || 0; }); }); return o; };
  const main = pick(P.main), cmp = P.compare ? pick(P.compare) : [];
  const finished = main.filter(d => d.iso !== todayIso);
  const m = { days: main.length, finishedDays: finished.length, total: sum(main, 'total'), postco: sum(main, 'postco'), contact: sum(main, 'contact'),
    perDay: finished.length ? sum(finished, 'total') / finished.length : null, includesToday: main.some(d => d.iso === todayIso), list: main, cats: catSum(main) };
  const c = { days: cmp.length, total: sum(cmp, 'total'), postco: sum(cmp, 'postco'), cats: catSum(cmp) };
  const find = iso => re.days.find(d => d.iso === iso) || null;
  const stale = re.lastOkMs === null || nowMs - re.lastOkMs > EMAIL_CFG.STALE_HOURS * 3600000;
  const catRows = EMAIL_CFG.CATEGORIES.map(([k, name]) => ({ key: k, name, n: m.cats[k], was: c.cats[k] })).filter(r => r.n || r.was).sort((a, b) => b.n - a.n);
  return { p: P, main: m, cmp: c, canCompare: c.days > 0, today: find(todayIso), yesterday: find(ydayIso), catRows,
    firstMs: re.days.length ? re.days[0].ms : null, lastOkMs: re.lastOkMs, stale, failed: re.lastFailed };
}
/* ==================================================================== EMAIL-LOGIC-END */

/** POST to the Dashboard API as text/plain JSON (a "simple" request: no browser pre-check needed). */
async function api(body) {
  const ctrl = new AbortController(); const timer = setTimeout(() => ctrl.abort(), APP.API_TIMEOUT_S * 1000);
  try {
    const res = await fetch(APP.API_URL, { method: 'POST', body: JSON.stringify(body), signal: ctrl.signal, cache: 'no-store', redirect: 'follow' });

// ============================================================ page (look and layout only; every number comes from the logic block above)
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const num = n => Number(n).toLocaleString('en-US');
const share = (n, t) => (!t ? '–' : t < CFG.SMALL_TOTAL ? String(n) : Math.round(100 * n / t) + '%');
const pct = (n, t) => (!t ? '–' : Math.round(100 * n / t) + '%');
/** One number style everywhere: "154 (28%)". Under SMALL_TOTAL the percentage is left out. */

const npText = (n, t) => (!t || t < CFG.SMALL_TOTAL ? num(n) : num(n) + ' (' + Math.round(100 * n / t) + '%)');
const hourText = h => { const f = x => { x %= 24; return x === 0 ? '12 am' : x < 12 ? x + ' am' : x === 12 ? '12 pm' : (x - 12) + ' pm'; }; return f(h) + ' to ' + f(h + 1); };
const hourShort = h => { const p = x => { x = ((x % 24) + 24) % 24; return { n: x % 12 || 12, ap: x < 12 ? 'am' : 'pm' }; }; const a = p(h), b = p(h + 1); return a.ap === b.ap ? a.n + '–' + b.n + ' ' + a.ap : a.n + ' ' + a.ap + '–' + b.n + ' ' + b.ap; };
const clock = ms => { const w = wall(ms); return (w.h % 12 || 12) + ':' + String(w.mi).padStart(2, '0') + (w.h < 12 ? ' am' : ' pm'); };
const joinAnd = a => a.length < 2 ? a.join('') : a.slice(0, -1).join(', ') + ' and ' + a[a.length - 1];
const store = (k, v) => { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } };
const monthLabel = l => String(l).replace(/ \(so far\)$/, '');

/* The two sources, named the same way everywhere on the page. */
const SRC_A = 'Daily Log (SleekFlow data)', SRC_B = 'WhatsApp FAQ customer data';
const TAG_A = 'Daily Log', TAG_B = 'WhatsApp FAQ';
/* Everyday words for how a WhatsApp FAQ chat ended. Display only: the counting above still uses its own labels. */
const WORD = { BOT: 'Completed by bot', HUMAN: 'Human assistance', QUIET: 'Customer stopped replying', UNKNOWN: 'Ending unknown' };

async function fetchCsv(url) {
  const ctrl = new AbortController(); const timer = setTimeout(() => ctrl.abort(), CFG.FETCH_TIMEOUT_S * 1000);
  try {
    const res = await fetch(url + (url.includes('?') ? '&' : '?') + 't=' + Date.now(), { cache: 'no-store', signal: ctrl.signal });
    if (!res.ok) throw new Error('the data link answered ' + res.status + '.');
    const text = await res.text();
    if (/^\s*</.test(text)) throw new Error('the data link returned a web page, not data. Is the sheet still published to the web?');
    return text;
  } catch (e) { throw new Error(e.name === 'AbortError' ? 'the data link took too long to answer.' : e.message); }
  finally { clearTimeout(timer); }
}

async function load(manual) {
  if (LOADING) return;
  if (apiMode() && !session.token()) { showLogin(); return; }
  LOADING = true; $('#refresh').disabled = true;
  try {
    let changed = false;
    if (apiMode()) {
      changed = await loadFromApi();
      if (LOCKED) return;
    } else {
      const [a, b] = await Promise.allSettled([fetchCsv(CFG.DAILY_CSV_URL), fetchCsv(CFG.CSV_URL)]);
      if (a.status === 'fulfilled') { if (a.value !== TEXT_A) { try { READ_A = readDaily(parseCSV(a.value)); TEXT_A = a.value; ERR_A = null; changed = true; } catch (e) { ERR_A = e.message; } } else ERR_A = null; }
      else ERR_A = a.reason.message;
      if (b.status === 'fulfilled') { if (b.value !== TEXT_B) { try { READ_B = readChats(parseCSV(b.value)); TEXT_B = b.value; ERR_B = null; changed = true; } catch (e) { ERR_B = e.message; } } else ERR_B = null; }
      else ERR_B = b.reason.message;
    }
    FETCHED_AT = Date.now();
    const newDay = RENDER_DAY !== toIso(Date.now());
    if (changed || newDay || !RENDERED) { fillPeriods(); render(!manual && CHARTS.length > 0); RENDERED = true; }
    else { renderMeta(); renderNotices(); }
  } finally { LOADING = false; $('#refresh').disabled = false; }
}
let RENDERED = false;

/** One call to the Dashboard API: the same tables the CSVs used to give, plus the email part. Returns true if anything changed. */
async function loadFromApi() {
  let r;
  try { r = await api({ action: 'data', token: session.token() }); }
  catch (e) { ERR_A = ERR_B = ERR_E = e.message; return false; }
  if (!r || !r.ok) {
    if (r && r.code === 'LOGIN_NEEDED') { session.clear(); showLogin('Your login has ended. Please log in again.'); return false; }
    ERR_A = ERR_B = ERR_E = 'the data link answered ' + ((r && r.code) || 'with an error') + '.'; return false;
  }
  const er = r.errors || {}; let changed = false;
  const take = (vals, prev, reader, missing) => {
    if (!vals) return { err: missing };
    const t = JSON.stringify(vals); if (t === prev.text) return { same: true };
    try { return { read: reader(vals), text: t }; } catch (e) { return { err: e.message }; }
  };
  const a = take(r.daily, { text: TEXT_A }, readDaily, 'the Daily Log ' + (er.daily || 'did not arrive') + '.');
  if (a.read) { READ_A = a.read; TEXT_A = a.text; ERR_A = null; changed = true; } else if (a.same) ERR_A = null; else ERR_A = a.err;
  const b = take(r.chats, { text: TEXT_B }, readChats, 'the WhatsApp FAQ data ' + (er.chats || 'did not arrive') + '.');
  if (b.read) { READ_B = b.read; TEXT_B = b.text; ERR_B = null; changed = true; } else if (b.same) ERR_B = null; else ERR_B = b.err;
  const em = r.email && (r.email.total || r.email.types) ? r.email : null;
  const e = take(em, { text: TEXT_E }, readEmail, 'the email numbers ' + (er.emailTotal || 'did not arrive') + '.');
  if (e.read) { READ_E = e.read; TEXT_E = e.text; ERR_E = READ_E.problems.length ? READ_E.problems.join('; ') + '.' : null; changed = true; }
  else if (!e.same) ERR_E = e.err;
  if (typeof r.emailLogEnabled === 'boolean') EMAIL_LOG_ON = r.emailLogEnabled;
  const al = Array.isArray(r.alerts) ? r.alerts : [];
  if (JSON.stringify(al) !== JSON.stringify(ALERTS_TODAY)) { ALERTS_TODAY = al; changed = true; }
  return changed;
}

async function submitLogin(form) {
  const pw = $('#pw').value; const btn = form.querySelector('button[type="submit"]');
  btn.disabled = true; $('#login-err').textContent = 'Checking…';
  try {
    const r = await api({ action: 'login', password: pw });
    if (r && r.ok) { session.set(r.token, r.expiresAt); unlock(); await load(true); return; }
    $('#login-err').textContent = r && r.code === 'LOCKED' && r.retryMinutes ? 'Too many wrong tries. Please wait ' + r.retryMinutes + ' minutes, then try again.' : LOGIN_MSG[r && r.code] || 'Login failed. Please tell IT.';
  } catch (err) { $('#login-err').textContent = 'Could not reach the data link: ' + err.message; }

const firstMs = () => { const v = [READ_A && READ_A.firstMs, READ_B && READ_B.logStartMs].filter(x => x !== null && x !== undefined); return v.length ? Math.min.apply(null, v) : null; };

function fillPeriods() {
  const sel = $('#period'); const start = firstMs();
  const nw = wall(Date.now()); const opts = [['this', 'This month'], ['last', 'Last month'], ['d7', 'Last 7 days'], ['d30', 'Last 30 days']];
  const months = [];
  if (start !== null) {
    const s = wall(start); let y = s.y, m = s.m;
    while (y < nw.y || (y === nw.y && m < nw.m)) { months.push(['m:' + y + '-' + String(m + 1).padStart(2, '0'), MONTHS[m] + ' ' + y]); m++; if (m > 11) { m = 0; y++; } }
  }
  months.reverse();
  sel.innerHTML = opts.map(([v, t]) => '<option value="' + v + '">' + esc(t) + '</option>').join('') +
    (months.length ? '<optgroup label="Past months">' + months.map(([v, t]) => '<option value="' + v + '">' + esc(t) + '</option>').join('') + '</optgroup>' : '') +
    '<option value="custom">Custom dates</option>';
  const today = toIso(Date.now());
  $('#from').max = today; $('#to').max = today;
  if (start !== null) { $('#from').min = toIso(start); $('#to').min = toIso(start); }
  if (!KEY) KEY = startKey();
  sel.value = KEY.startsWith('r:') ? 'custom' : (opts.concat(months).some(o => o[0] === KEY) ? KEY : 'this');
  if (sel.value === 'this' && KEY !== 'this' && !KEY.startsWith('r:')) KEY = 'this';
}

/** ?from=YYYY-MM-DD&to=YYYY-MM-DD wins, then the last choice, then "This month". */
function startKey() {
  const q = new URLSearchParams(location.search); const f = q.get('from'), t = q.get('to');
  if (isoDay(f) !== null && isoDay(t) !== null) return 'r:' + f + ':' + t;
  const saved = store('period');
  if (saved && saved !== 'this' && /^(last|d7|d30|m:\d{4}-\d{2}|r:\d{4}-\d{2}-\d{2}:\d{4}-\d{2}-\d{2})$/.test(saved)) return saved;
  // Nothing picked yet. On the first days of a month there is no data for "This month", so open on last month until some arrives.
  const w = wall(Date.now()); const monthStart = fromWall(w.y, w.m, 1);
  const hasThisMonth = (READ_A && READ_A.lastMs !== null && READ_A.lastMs >= monthStart) || (READ_B && READ_B.newestMs !== null && READ_B.newestMs >= monthStart);
  return hasThisMonth || (!READ_A && !READ_B) ? 'this' : 'last';
}

function setKey(k) {
  KEY = k; store('period', k);
  const url = new URL(location.href);
  if (k.startsWith('r:')) { const [f, t] = k.slice(2).split(':'); url.searchParams.set('from', f); url.searchParams.set('to', t); }
  else { url.searchParams.delete('from'); url.searchParams.delete('to'); }
  try { history.replaceState(null, '', url); } catch (e) { /* file:// */ }
  render();
}

/** Completed-by-bot count per sub-topic, on the same base as the sub-topic table (chats since that topic's sub-topics were first recorded). Display only. */
function subBotCounts(read, r) {
  const out = {}; let noTopicBot = 0;
  read.chats.forEach(c => {
    if (c.ms < r.start || c.ms >= r.end || c.outcome !== 'BOT') return;
    if (!c.topics.length) { noTopicBot++; return; }
    c.topics.forEach(t => {
      if (!(t in read.firstSubMs) || c.ms < dayStart(read.firstSubMs[t])) return;
      const o = out[t] || (out[t] = { subs: {}, noSub: 0 });
      const mine = uniq(c.subs.filter(s => s.topic === t).map(s => s.label));
      if (!mine.length) o.noSub++; else mine.forEach(l => { o.subs[l] = (o.subs[l] || 0) + 1; });
    });
  });
  return { tables: out, noTopicBot };
}

  if (t === 'alerts' && alertsOn() && !LOCKED && RENDERED && !ALERT_STATE && !ALERT_BUSY) loadAlerts();

// ------------------------------------------------------------ Spike warnings (Alerts tab + Overview notice; the checks run in the Dashboard API)
const AL_CH = { email: 'Email', sleekflow: 'SleekFlow (WhatsApp, Instagram, TikTok)' };
const AL_RESULT = {
  WARNING: ['High', 'bad'], SUPPRESSED: ['High (already warned)', 'bad'], NORMAL: ['Normal', 'ok'], LEARNING: ['Still learning', 'muted'],
  'NO DATA': ['No fresh numbers', 'muted'], FAILED: ['Could not check', 'bad'], 'NOT CONNECTED': ['Not connected yet', 'muted'],
};
const AL_SENT = { SENT: 'Email sent', OFF: 'Warnings off', 'NO RECIPIENTS': 'Nobody to email', 'EMAIL FAILED': 'Email failed' };
const amPm = h => (h % 12 || 12) + (h < 12 ? 'am' : 'pm');
/** "16:30" → "4:30 pm" ; a check hour 16 → "4:30 pm" (checks count up to h:30). */
const cpLabel = x => { const m = /^(\d{1,2}):(\d{2})$/.exec(String(x)); const h = m ? +m[1] : +x, mi = m ? m[2] : '30'; return (h % 12 || 12) + ':' + mi + (h < 12 ? ' am' : ' pm'); };
/* ---- Alerts page (redesign 22 Oct): status line → two channel cards → warning box → recent activity + health → settings (folded) → full history (folded) */
const AL_STATE = { WARNING: ['High', 'bad'], SUPPRESSED: ['High', 'bad'], NORMAL: ['Normal', 'ok'], LEARNING: ['Learning', 'idle'],
  'NO DATA': ['Waiting for data', 'warn'], FAILED: ['Problem', 'bad'], 'NOT CONNECTED': ['Not connected', 'idle'] };
const AL_SHORT = { email: ['Email', 'HELLO mailbox'], sleekflow: ['SleekFlow', 'WhatsApp · Instagram · TikTok'] };
let AL_OPEN = { settings: false, history: false };          // which folded sections are open (kept when the page redraws)
/** "2026-09-30 16:44" → "4:44 pm" today, else "30 Sep, 4:44 pm". */
function alWhen(s) {
  const m = /^(\d{4}-\d{2}-\d{2}) (\d{1,2}):(\d{2})/.exec(String(s || '')); if (!m) return esc(s || '');
  const t = (+m[2] % 12 || 12) + ':' + m[3] + (+m[2] < 12 ? ' am' : ' pm');
  if (m[1] === toIso(Date.now())) return t;
  const p = m[1].split('-').map(Number); return p[2] + ' ' + ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'][p[1] - 1] + ', ' + t;
}
const alPill = (txt, cls) => '<span class="al-pill ' + cls + '">' + esc(txt) + '</span>';
const alResClass = r => (/^HIGH|DATA ERROR/.test(r) ? 'bad' : /^NORMAL/.test(r) ? 'ok' : /NO FRESH/.test(r) ? 'warn' : 'idle');
const alResWord = r => (/^HIGH/.test(r) ? 'High' : /^NORMAL/.test(r) ? 'Normal' : /LEARNING/.test(r) ? 'Learning' : /NO FRESH/.test(r) ? 'Waiting for data' : /DATA ERROR/.test(r) ? 'Problem' : /NOT CONNECTED/.test(r) ? 'Not connected' : r);

/** One channel card: status pill, today's number, "usually … · warns at …", a thin bar. */
function alChannelCard(ch, c) {
  const L = c.latest, R = c.readiness, nm = AL_SHORT[ch];
  const st = L ? AL_STATE[L.result] || [L.result, 'idle'] : R && R.ready ? ['Ready', 'ok'] : ['Learning', 'idle'];
  const has = L && L.n !== null && L.n !== undefined;
  let line;
  if (L && L.avg !== null && L.avg !== undefined) line = 'Usually <b>' + esc(L.avg) + '</b> by now' + (L.line ? ' · warns at <b>' + esc(L.line) + '</b>' : '');
  else if ((L && L.result === 'LEARNING') || (!L && R && !R.ready)) { const cp = R ? R.checkpoints.find(x => !x.ready) || R.checkpoints[0] : null; line = cp ? 'Learning what is normal: ' + esc(cp.days) + ' of ' + esc(cp.need) + ' days' : 'Learning what is normal'; }
  else if (L && L.result === 'NO DATA') line = 'Waiting for the next email count';
  else if (L && L.result === 'FAILED') line = 'Could not count. IT has been told.';
  else if (L && L.result === 'NOT CONNECTED') line = 'Not connected yet';
  else line = 'First check after ' + cpLabel(12);
  const pct = has && L.line ? Math.min(100, Math.round(100 * L.n / Math.max(L.line, L.n))) : 0;
  return '<section class="card al-ch ' + st[1] + '"><div class="al-ch-h"><div><h3>' + nm[0] + '</h3><p class="muted">' + nm[1] + '</p></div>' + alPill(st[0], st[1]) + '</div>' +
    '<p class="al-big">' + (has ? num(L.n) : '–') + '<span>' + (has ? ' so far today' + (L.upTo ? ' <small>(up to ' + esc(cpLabel(L.upTo)) + ')</small>' : '') : '') + '</span></p>' +
    '<p class="al-line">' + line + '</p>' +
    (pct ? '<div class="al-bar" role="img" aria-label="' + esc(num(L.n) + ' of ' + L.line + ' needed to warn') + '"><i style="width:' + pct + '%"></i></div>' : '') +
    (L && L.manual ? '<p class="muted al-tiny">Last check was a test run.</p>' : '') + '</section>';
}

/** The worked example under the rule (updates while typing). D: { ratio, minExtra }. */
function alExampleHtml(D) {
  const r = Number(D.ratio), e = Number(D.minExtra);
  if (!(r >= 1.1) || !(e >= 0)) return '<p><b>Example:</b> type a number of at least 1.1, and an extra of 0 or more.</p>';
  const need = n => Math.ceil(Math.max(r * n, n + e, 3) - 1e-9);
  const times = Math.round(4 * r * 10) / 10, plus = 4 + e, n4 = need(4);
  return '<p><b>Example:</b> usually <b>4</b> by this time → today needs <b>' + n4 + ' or more</b> <span class="muted">(4 × ' + esc(r) + ' = ' + esc(times) + ', 4 + ' + esc(e) + ' = ' + esc(plus) + ', the bigger one counts)</span></p>' +
    '<p>' + (n4 > 1 ? esc(n4 - 1) + ' → no warning · ' : '') + esc(n4) + ' → ⚠️ warning · a busy day: usually 30 → needs ' + need(30) + '</p>' +
    '<p class="muted">Why two rules? On a quiet day (usually 1, today 2) it is double, but only 1 more. The second rule stops that false alarm.</p>';
}

/** Validation the server repeats: only company addresses, sensible numbers. Returns a list of plain-English problems. */
function alertFormProblems(s, domains) {
  const out = [];
  ['email', 'sleekflow'].forEach(k => {
    const r = s[k], label = k === 'email' ? 'Email' : 'SleekFlow';
    if (!(r.ratio >= 1.1 && r.ratio <= 10)) out.push(label + ': "times the normal" must be between 1.1 and 10.');
    if (!(r.minExtra >= 0 && r.minExtra <= 1000)) out.push(label + ': "at least this many more" must be between 0 and 1000.');
  });
  s.recipients.forEach(a => {
    const m = /^[^\s@]+@([^\s@]+)$/.exec(a);
    if (!m) out.push('"' + a + '" is not an email address.');
    else if (domains.indexOf(m[1]) === -1) out.push(a + ': warnings can only go to @' + domains.join(', @') + ' addresses.');
  });
  return out;
}

function renderAlerts() { const box = $('#alerts-box'); if (box) box.innerHTML = alertsHtml(); }

async function alertCall(body, okText) {
  ALERT_BUSY = true; renderAlerts();
  try {
    const r = await api(Object.assign({ token: session.token() }, body));
    if (r && r.code === 'LOGIN_NEEDED') { session.clear(); showLogin('Your login has ended. Please log in again.'); return; }
    if (r && r.ok && r.settings) { ALERT_STATE = r; AL_DRAFT = null; }   // saved or loaded settings become the new starting point
    ALERT_MSG = r && r.ok ? (okText ? { ok: true, text: typeof okText === 'function' ? okText(r) : okText } : null)
      : { ok: false, text: r && r.code === 'INVALID' ? r.errors.join(' ') : r && r.code === 'TOO_SOON' ? 'A test was just sent. Please wait ' + r.retryMinutes + ' minutes.' : r && r.code === 'NO_RECIPIENTS' ? 'Save at least one address first.' : r && r.code === 'EMAIL_NOT_READY' ? 'Warning emails are not switched on yet. Please tell IT.' : 'The data link answered ' + ((r && r.code) || 'with an error') + '. Please try again or tell IT.' };
  } catch (e) { ALERT_MSG = { ok: false, text: 'Could not reach the data link: ' + e.message }; }
  finally { ALERT_BUSY = false; if (!LOCKED) renderAlerts(); }
}
const loadAlerts = () => alertCall({ action: 'alerts' });

/* The settings form keeps unsaved edits here, so adding/removing a person (which redraws the card) never loses typed numbers. */
let AL_DRAFT = null;
function alDraft(s) {
  if (!AL_DRAFT) AL_DRAFT = { enabled: s.enabled, ratio: s.email.ratio, minExtra: s.email.minExtra, recipients: s.recipients.slice(), dirty: false };
  return AL_DRAFT;
}
function alDomains() { return (ALERT_STATE && ALERT_STATE.status && ALERT_STATE.status.allowedDomains) || ['machino.com.my']; }
/** Copies what is typed in the form into the draft (numbers and the on/off box). */
function alSyncDraft() {
  if (!AL_DRAFT) return;
  const v = id => { const el = $('#' + id); return el ? el.value : null; };
  if (v('al-ratio') !== null) AL_DRAFT.ratio = Number(v('al-ratio'));
  if (v('al-extra') !== null) AL_DRAFT.minExtra = Number(v('al-extra'));
  if ($('#al-enabled')) AL_DRAFT.enabled = $('#al-enabled').checked;
}

function readAlertForm() {
  alSyncDraft();
  const D = AL_DRAFT || { enabled: true, ratio: NaN, minExtra: NaN, recipients: [] };
  const rule = { ratio: Number(D.ratio), minExtra: Number(D.minExtra) };
  return { enabled: !!D.enabled, email: Object.assign({}, rule), sleekflow: Object.assign({}, rule), recipients: D.recipients.slice() };
}

/** "Add" button / Enter in the address box: checks the address, adds a bubble (saved with "Save settings"). */
/** Moves what is typed in the address box into the bubbles. Returns a list of problems ([] = ok, or nothing typed). */
function alTakeTyped() {
  const box = $('#al-new'); if (!box || !box.value.trim()) return [];
  if (!AL_DRAFT && ALERT_STATE) alDraft(ALERT_STATE.settings);
  alSyncDraft();
  const list = box.value.split(/[\s,;]+/).map(x => x.trim().toLowerCase()).filter(Boolean);
  const bad = alertFormProblems({ email: { ratio: 2, minExtra: 0 }, sleekflow: { ratio: 2, minExtra: 0 }, recipients: list }, alDomains());
  if (bad.length) return bad;
  list.forEach(a => { if (AL_DRAFT.recipients.indexOf(a) === -1) AL_DRAFT.recipients.push(a); });
  if (AL_DRAFT.recipients.length > 10) { AL_DRAFT.recipients = AL_DRAFT.recipients.slice(0, 10); return ['At most 10 people.']; }
  AL_DRAFT.dirty = true; box.value = '';
  return [];
}

function alAddRecipient() {
  const box = $('#al-new'); if (!box) return;
  const typed = box.value.trim(); if (!typed) return;
  const bad = alTakeTyped();
  ALERT_MSG = bad.length ? { ok: false, text: bad.join(' ') } : { ok: true, text: 'Added ' + typed.toLowerCase() + '. Press Save settings to keep it.' };
  renderAlerts(); const nb = $('#al-new'); if (nb) { if (bad.length) nb.value = typed; nb.focus(); }
}
function alRemoveRecipient(a) {
  alSyncDraft();
  AL_DRAFT.recipients = AL_DRAFT.recipients.filter(x => x !== a); AL_DRAFT.dirty = true; ALERT_MSG = null; renderAlerts();
}

function saveAlerts() {
  const typedBad = alTakeTyped();        // an address typed but not yet added counts too (22 Oct: it was silently ignored)
  if (typedBad.length) { ALERT_MSG = { ok: false, text: typedBad.join(' ') + ' Nothing was saved.' }; renderAlerts(); return; }
  const s = readAlertForm();
  const bad = alertFormProblems(s, alDomains());
  if (bad.length) { ALERT_MSG = { ok: false, text: bad.join(' ').replace(/(Email|SleekFlow): /g, '') }; renderAlerts(); return; }
  return alertCall({ action: 'saveAlerts', settings: s }, 'Saved. ' + (s.recipients.length ? 'Warnings go to ' + s.recipients.length + (s.recipients.length === 1 ? ' person.' : ' people.') : 'Nobody will get warnings until you add someone.'));
}

/** Beside the chart: the newest 7 shown days with a mini bar, plus the average and the busiest day. */
function emailWeekHtml(F) {
  const today = toIso(Date.now());
  const rows = F.rows.slice().sort((a, b) => (a.iso < b.iso ? 1 : -1)).slice(0, 7);
  const done = F.rows.filter(d => d.iso !== today);
  const avg = done.length ? Math.round(10 * done.reduce((a, d) => a + d.n, 0) / done.length) / 10 : null;
  const busiest = done.reduce((b, d) => (!b || d.n > b.n ? d : b), null);
  const max = Math.max(1, ...rows.map(d => d.n));
  const day = d => DAYS[d.dow].slice(0, 3) + ' ' + emDay(d.ms).replace(/ \d{4}$/, '');
  return '<section class="card em-week"><h3>Latest days</h3>' + (rows.length ? '<ul>' + rows.map(d => '<li><span class="em-week-d">' + esc(day(d)) + (d.iso === today ? ' <small>so far</small>' : '') + '</span>' +
      '<span class="em-week-b" aria-hidden="true"><i style="width:' + (100 * d.n / max) + '%"></i></span><b>' + num(d.n) + '</b></li>').join('') + '</ul>' +
    '<p class="em-week-f">' + (avg !== null ? 'Average <b>' + esc(avg) + '</b> a day' : '') + (busiest && busiest.n ? ' · busiest <b>' + esc(day(busiest)) + '</b> (' + num(busiest.n) + ')' : '') + '</p>'
    : '<p class="muted">No days match these filters.</p>') + '</section>';
}

/** The Customer email details switch: saves SHOW_EMAIL_LOG in Google, then reloads the numbers (off = the Email Log is dropped at once). */
async function setCustomerDetails(on) {
  EM_LOG_BUSY = true; EM_LOG_MSG = null; renderEmailLog();
  try {
    const r = await api({ action: 'setEmailLog', on: on, token: session.token() });
    if (r && r.code === 'LOGIN_NEEDED') { EM_LOG_BUSY = false; session.clear(); showLogin('Your login has ended. Please log in again.'); return; }
    if (r && r.ok) {
      EMAIL_LOG_ON = r.emailLogEnabled;
      EM_LOG_MSG = { ok: true, text: on ? 'Customer email details turned ON. Saved for everyone.' : 'Customer email details turned OFF. The dashboard no longer receives them.' };
      if (!on && READ_E) READ_E.log = null;
      TEXT_E = null; EM_LOG_BUSY = false;
      await load(true); renderEmailLog(); return;
    }
    EM_LOG_MSG = { ok: false, text: r && r.code === 'BAD_REQUEST' ? 'The data link is an older version. Please ask IT to make a New version of the Dashboard API.' : 'Could not change it (' + ((r && r.code) || 'error') + '). Please try again.' };
  } catch (e) { EM_LOG_MSG = { ok: false, text: 'Could not reach the data link: ' + e.message }; }
  EM_LOG_BUSY = false; renderEmailLog();
}

// ------------------------------------------------------------ Daily Log (SleekFlow data)
function partA(SA) {
  const up = READ_A && READ_A.lastMs !== null ? ' · filled up to ' + dayText(READ_A.lastMs) + ' ' + wall(READ_A.lastMs).y : '';
  const head = pageHead(SRC_A, EMAIL_IN_DAILY
    ? 'All channels: every customer who messaged us on WhatsApp, Instagram, TikTok or email, counted once a day. WhatsApp, Instagram and TikTok come from SleekFlow; Email comes from the HELLO email counter (see the Email Data tab). "Who replied" covers the SleekFlow channels only.'
    : 'All channels: every customer who messaged us on WhatsApp, Instagram or TikTok, counted once a day, and who replied to them.', TAG_A + up);
  if (!SA) return head + msg('Summary', ERR_A ? 'The ' + SRC_A + ' could not be loaded. The ' + SRC_B + ' is still correct.' : READ_A ? 'No Daily Log days yet.' : 'Loading the Daily Log…');
  const m = SA.main, c = SA.cmp;
  if (!m.days) return head + msg('Summary', 'No Daily Log days in this period. It started on ' + esc(dayText(READ_A.firstMs)) + ' ' + wall(READ_A.firstMs).y + ' and is filled up to ' + esc(dayText(READ_A.lastMs)) + ' ' + wall(READ_A.lastMs).y + '.');
  const src = TAG_A + up;
  const wasShare = cn => (SA.shareOk && c.who ? esc(SA.p.compareText) + ': ' + npText(cn, c.who) : '');

  // Summary
  const three = [
    ['ok', m.bot, 'Bot or auto-reply only', 'No staff reply that day. Not proof it was solved.', c.bot],
    ['person', m.staff, 'Answered by staff', 'A staff member replied at least once.', c.staff],
    ['quiet', m.none, 'No reply from us (same day)', 'Nobody on our side replied that day.', c.none],
  ];
  let s1 = '<section class="card">' + cardHead('Summary', src);
  s1 += '<div class="kpis">' + kpi({ label: 'Total enquiries', value: num(m.enq), sub: num(Math.round(m.perDay)) + ' a day', cmp: SA.covered && c.perDay !== null ? esc(SA.p.compareText) + ': ' + num(c.enq) + ' (' + Math.round(c.perDay) + ' a day)' : '', def: 'Customers who messaged us. One customer, one channel, one day = 1.' }) +
    three.map(x => kpi({ label: x[2], dot: x[0], value: m.who ? pct(x[1], m.who) : '–', sub: num(x[1]) + ' of ' + num(m.who), cmp: wasShare(x[4]), def: x[3] })).join('') + '</div>';
  if (m.who) s1 += splitBar(three, m.who, 'Who replied');
  if (m.reply && m.reply.n >= 3) s1 += '<div class="reply"><p class="main">Staff reply time: <b>' + m.reply.mid + ' min</b> <span class="muted">(typical day; half of days between ' + m.reply.lo + ' and ' + m.reply.hi + ' min)</span></p><p class="def">Clock time, nights and weekends included, same-day replies only. It shows how long customers wait, not any one person\'s speed.</p></div>';
  else s1 += '<p class="foot">Staff reply time: not enough days with staff replies in this period yet.</p>';
  if (m.completeDays < m.days) s1 += '<p class="foot">Shares and reply time use ' + m.completeDays + ' of ' + m.days + ' days. ' + esc(joinAnd(m.incomplete.map(x => dayText(x.ms)))) + ' ' + (m.incomplete.length === 1 ? 'is' : 'are') + ' incomplete in the sheet.</p>';
  s1 += '</section>';

  // By channel
  const chRows = activeChannels(SA);
  const chTotal = m.wa + m.ig + m.tt + m.em;
  const vs = k => { if (!SA.covered || c.perDay === null) return '–'; const x = Math.round(m[k] / m.days), y = Math.round(c[k] / c.days); return y + ' a day' + (x === y ? '' : '<span class="chg">' + (x > y ? '▲ ' : '▼ ') + Math.abs(x - y) + '</span>'); };
  const maxCh = Math.max(1, ...chRows.map(r => m[r[1]]));
  const s2 = '<section class="card">' + cardHead('Enquiries by channel', src) + '<div class="tw"><table class="topics"><thead><tr><th>Channel</th><th class="num">Enquiries</th><th class="hide-sm"><span class="sr">Bar</span></th><th class="num">A day</th>' + (SA.covered ? '<th class="num hide-sm">' + esc(SA.p.compareText) + '</th>' : '') + '</tr></thead><tbody>' +
    chRows.map(r => '<tr><td><span class="lab-c">' + key(r[1]) + ' <b>' + r[0] + '</b></span></td><td class="num"><b>' + np(m[r[1]], chTotal) + '</b></td><td class="barcell hide-sm"><div class="bar" style="width:' + (100 * m[r[1]] / maxCh) + '%;background:var(--' + r[1] + ')"></div></td><td class="num">' + Math.round(m[r[1]] / m.days) + '</td>' + (SA.covered ? '<td class="num muted hide-sm">' + vs(r[1]) + '</td>' : '') + '</tr>').join('') + '</tbody></table></div>' +
    '<p class="foot">Bot or auto-reply only rises and falls with Instagram\'s share, so read the two together. Instagram and TikTok have no FAQ menu, only automatic replies.</p></section>';

  // Over time
  let s3 = '<section class="card">' + cardHead('Enquiries over time', src + ' · per ' + SA.unit) + timeChart(SA, 'cTime') + timeFacts(SA);
  if (SA.months.length) s3 += '<h4 class="subh">Month by month</h4><div class="tw"><table><thead><tr><th>Month</th><th class="num">Enquiries</th><th class="num">A day</th><th class="num">Bot or auto-reply only</th><th class="num">Answered by staff</th><th class="num">No reply from us</th><th class="num">Staff reply time</th></tr></thead><tbody>' +
    SA.months.map(r => '<tr><td><b>' + esc(monthLabel(r.label)) + '</b></td><td class="num"><b>' + num(r.enq) + '</b></td><td class="num">' + Math.round(r.perDay) + '</td><td class="num">' + np(r.bot, r.who) + '</td><td class="num">' + np(r.staff, r.who) + '</td><td class="num">' + np(r.none, r.who) + '</td><td class="num">' + (r.reply && r.reply.n >= 3 ? r.reply.mid + ' min' : '–') + '</td></tr>').join('') + '</tbody></table></div>' +
    '<p class="def">Shares are out of the enquiries on complete days. The current month counts the days filled so far.</p>';
  s3 += '</section>';
  return head + alertBox(SA.alerts) + s1 + s3 + s2;
}

// ------------------------------------------------------------ WhatsApp FAQ customer data
/** Chats per day (or week) by ending, per hour, per weekday and per month. Display only: re-groups the chats the logic block already read, and every total is checked against SB.main in the test script. */
function botViz(SB, rb) {
  const p = SB.p, m = SB.main;
  const start = rb.logStartMs !== null ? Math.max(p.main.start, dayStart(rb.logStartMs)) : p.main.start;
  const end = Math.min(p.main.end, p.today.end);
  const inR = rb.chats.filter(c => c.ms >= start && c.ms < end);
  const unit = end - start <= 62 * DAY ? 'day' : 'week'; const step = unit === 'day' ? DAY : 7 * DAY;
  const day = [];
  for (let t = start; t < end; t += step) day.push({ start: t, end: Math.min(t + step, end), label: dayText(t), partial: unit === 'week' && t + step > end, BOT: 0, HUMAN: 0, QUIET: 0, UNKNOWN: 0 });
  inR.forEach(c => { const b = day[Math.floor((c.ms - start) / step)]; if (b) b[c.outcome]++; });
  const hour = Array.from({ length: 24 }, () => ({ all: 0, human: 0 }));
  inR.forEach(c => { const h = hour[wall(c.ms).h]; h.all++; if (c.outcome === 'HUMAN') h.human++; });
  // weekday averages use whole days only (today is not finished), and only when every weekday occurs often enough
  const fullEnd = Math.min(end, p.today.start); const occ = [0, 0, 0, 0, 0, 0, 0];
  for (let t = start; t < fullEnd; t += DAY) occ[wall(t).dow]++;
  const wd = Array.from({ length: 7 }, () => ({ all: 0, human: 0 }));
  rb.chats.filter(c => c.ms >= start && c.ms < fullEnd).forEach(c => { const w = wd[wall(c.ms).dow]; w.all++; if (c.outcome === 'HUMAN') w.human++; });
  const wdOk = occ.every(n => n >= CFG.WEEKDAY_MIN_EACH);
  const order = [1, 2, 3, 4, 5, 6, 0];
  return {
    day, unit, hour, hourOk: m.chats >= CFG.BUSIEST_MIN_CHATS, hourHuman: m.HUMAN >= CFG.BUSIEST_HANDED_MIN,
    wd: { ok: wdOk, labels: order.map(d => DAYS[d].slice(0, 3)), all: order.map(d => (occ[d] ? wd[d].all / occ[d] : 0)), human: order.map(d => (occ[d] ? wd[d].human / occ[d] : 0)) },
    months: SB.months.map(r => ({ label: monthLabel(r.label), BOT: r.BOT, HUMAN: r.HUMAN, QUIET: r.QUIET, UNKNOWN: r.chats - r.BOT - r.HUMAN - r.QUIET })),
  };
}
let BOTVIZ = null;

/** The two cards: topics (with sub-topics) in chats completed by the bot, and in chats that needed a person.
    Bot counts every topic the chat picked. Human counts only the topic the customer was on at the end (the logic block's rule), so its shares add up to 100%. */
function sideData(SB, rb) {
  const m = SB.main; const bots = subBotCounts(rb, SB.p.main);
  const side = (n, noTopic) => ({ total: n, noTopic, rows: [] });
  const out = { bot: side(m.BOT, bots.noTopicBot), human: side(m.HUMAN, m.noTopicHuman) };
  SB.topicRows.forEach(r => {
    const o = SB.res[r.name] || { resolved: 0, handed: 0, chats: 0 }; const st = SB.sub.tables[r.name]; const bt = bots.tables[r.name] || { subs: {}, noSub: 0 };
    const complete = !!st && st.base >= o.chats;
    const subsOf = (counts, noSub) => { const a = Object.keys(counts).map(l => ({ name: l, n: counts[l] })).filter(s => s.n > 0).sort((x, y) => y.n - x.n || x.name.localeCompare(y.name)); if (a.length && noSub) a.push({ name: 'No sub-topic chosen', n: noSub }); return a; };
    if (o.resolved > 0) out.bot.rows.push({ name: r.name, n: o.resolved, subs: st ? subsOf(bt.subs, bt.noSub) : [], complete });
    if (o.handed > 0) out.human.rows.push({ name: r.name, n: o.handed, subs: st ? subsOf(st.handed, st.noSubHanded) : [], complete });
  });
  ['bot', 'human'].forEach(k => out[k].rows.sort((a, b) => b.n - a.n || topicOrder(a.name) - topicOrder(b.name)));
  return out;
}

  h += '<div class="tw"><table class="topics side-t"><thead><tr><th>Topic</th><th class="hide-sm"><span class="sr">Bar</span></th><th class="num">Chats (share of ' + num(total) + ')</th></tr></thead>' + body + '</table></div>';
  h += '<p class="def">Click a topic to see the sub-topics inside it. A sub-topic share is out of its topic' + (S.rows.some(r => !r.complete && r.subs.length) ? '; where sub-topics were only recorded from a later date, only the number is shown' : '') + '.</p></section>';
  return h;
}

      '<p class="def">Shows when people ask, not how many staff you need. The hour is the time recorded for the chat.</p>' : '<p class="muted">Shows once there are about ' + CFG.BUSIEST_MIN_CHATS + ' chats in the period.</p>') + '</section>';
  const wdCard = '<section class="card">' + cardHead('Average chats per day, by weekday', src) +
    (BOTVIZ.wd.ok ? bchart('wd', 'cBotWd') + '<p class="def">Whole days only. Special days such as a sale or a launch can lift a weekday.</p>' : '<p class="muted">Shows for periods of about 4 weeks or more.</p>') + '</section>';
