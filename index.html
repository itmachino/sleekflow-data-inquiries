<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>SleekFlow Tracker</title>
<meta name="description" content="Machino customer enquiries — what customers ask, their concerns, when, and which needed a person.">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" integrity="sha384-9nhczxUqK87bcKHh20fSQcTGD4qq5GhayNYSYWqwBkINBhOfQLg/P5HG5lF1urn4" crossorigin="anonymous"></script>
<style>
/* Colours: categorical topics + outcome set validated for colour-blind separation and
   contrast in both modes (dataviz validator, 28 Sep 2026). Heat map = one-hue blue ramp. */
:root {
  color-scheme: light;
  --bg: #f3f5f9; --card: #ffffff; --ink: #1f2937; --muted: #5f6673; --faint: #8b93a1; --line: #e4e7ee;
  --brand: #2a78d6; --brand-soft: #e7f0fc; --bar: #5b6b73;
  --hero-a: #1c5cab; --hero-b: #1baf7a;
  --ok: #1baf7a; --person: #eb6834; --quiet: #a3a29c; --unknown: #4a3aa7; --alert: #c23b3b; --alert-soft: #fdeaea;
  --t1: #2a78d6; --t2: #eb6834; --t3: #1baf7a; --t4: #eda100; --t5: #e87ba4; --t6: #008300; --t7: #4a3aa7; --t8: #e34948;
  --seq-lo: #cde2fb; --seq-hi: #104281; --concern: #4a3aa7;
  --shadow: 0 1px 2px rgba(16,24,40,.05), 0 2px 6px rgba(16,24,40,.06);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #111312; --card: #1a1a19; --ink: #f2f2f0; --muted: #c3c2b7; --faint: #8f8e87; --line: #2e2e2b;
    --brand: #3987e5; --brand-soft: #1b2a3d; --bar: #9fb0b8;
    --hero-a: #184f95; --hero-b: #199e70;
    --ok: #199e70; --person: #d95926; --quiet: #6f6e69; --unknown: #9085e9; --alert: #e66767; --alert-soft: #3a1f1f;
    --t1: #3987e5; --t2: #d95926; --t3: #199e70; --t4: #c98500; --t5: #d55181; --t6: #008300; --t7: #9085e9; --t8: #e66767;
    --seq-lo: #184f95; --seq-hi: #9ec5f4; --concern: #9085e9; --shadow: none;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #111312; --card: #1a1a19; --ink: #f2f2f0; --muted: #c3c2b7; --faint: #8f8e87; --line: #2e2e2b;
  --brand: #3987e5; --brand-soft: #1b2a3d; --bar: #9fb0b8;
  --hero-a: #184f95; --hero-b: #199e70;
  --ok: #199e70; --person: #d95926; --quiet: #6f6e69; --unknown: #9085e9; --alert: #e66767; --alert-soft: #3a1f1f;
  --t1: #3987e5; --t2: #d95926; --t3: #199e70; --t4: #c98500; --t5: #d55181; --t6: #008300; --t7: #9085e9; --t8: #e66767;
  --seq-lo: #184f95; --seq-hi: #9ec5f4; --concern: #9085e9; --shadow: none;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
.wrap { max-width: 1200px; margin: 0 auto; padding: 24px 16px 48px; }
header.top { display: flex; flex-wrap: wrap; gap: 14px 24px; align-items: flex-end; justify-content: space-between; margin-bottom: 18px;
  padding: 22px 24px; border-radius: 16px; color: #fff; background: linear-gradient(120deg, var(--hero-a), var(--hero-b)); box-shadow: var(--shadow); }
.eyebrow { color: rgba(255,255,255,.85); font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
h1 { font-size: 28px; margin: 2px 0 0; letter-spacing: -.01em; }
.sub { color: var(--muted); font-size: 14px; margin-top: 4px; }
header.top .sub { color: rgba(255,255,255,.9); }
header.top .sub b { color: #fff; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
select, button { font: inherit; font-size: 14px; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; cursor: pointer; }
header.top select, header.top button { background: rgba(255,255,255,.16); color: #fff; border-color: rgba(255,255,255,.35); }
header.top select option { color: #1f2937; }
header.top button:hover, header.top select:hover { background: rgba(255,255,255,.26); }
button[aria-pressed="true"] { background: var(--brand); color: var(--card); border-color: var(--brand); }
.banner { border-radius: 10px; padding: 12px 16px; margin-bottom: 16px; font-weight: 500; }
.banner.warn { background: var(--alert-soft); color: var(--alert); }
.grid { display: grid; gap: 16px; }
.kpis { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); margin-bottom: 16px; }
.half { grid-template-columns: 1fr 1fr; }
@media (max-width: 860px) { .half { grid-template-columns: 1fr; } }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; box-shadow: var(--shadow); min-width: 0; }
.card h2 { font-size: 17px; margin: 0 0 2px; }
.card .hint { color: var(--muted); font-size: 13px; margin: 0 0 14px; }
.todo { color: var(--muted); font-size: 13px; margin: 12px 0 0; padding-top: 10px; border-top: 1px dashed var(--line); }
.todo b { color: var(--ink); font-weight: 600; }
.kpi { border-top: 4px solid var(--accent, var(--brand)); background: linear-gradient(180deg, color-mix(in srgb, var(--accent, var(--brand)) 9%, var(--card)), var(--card) 70%); }
.kpi .label { color: var(--muted); font-size: 13.5px; font-weight: 600; }
.card h2 .icon { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 8px; margin-right: 8px; font-size: 15px; background: var(--brand-soft); vertical-align: middle; }
.tdot { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 8px; vertical-align: 0; }
.kpi .value { font-size: 32px; font-weight: 700; margin: 4px 0 2px; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.kpi .delta { font-size: 13px; color: var(--muted); }
.kpi .delta.up { color: var(--brand); } .kpi .delta.down { color: var(--alert); }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
.chart { position: relative; height: 300px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; padding: 8px 6px; border-bottom: 1px solid var(--line); }
td { padding: 9px 6px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th.num, td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.bar { height: 10px; border-radius: 5px; background: var(--bar); min-width: 3px; }
.vs { font-size: 13px; color: var(--muted); white-space: nowrap; }
.vs.up { color: var(--brand); } .vs.down { color: var(--alert); } .vs.new { color: var(--person); font-weight: 600; }
.alerts { margin: 0; padding-left: 18px; } .alerts li { margin: 6px 0; }
.alerts .none { list-style: none; margin-left: -18px; color: var(--ok); }
.heat { overflow-x: auto; }
.heat table { border-collapse: separate; border-spacing: 3px; min-width: 640px; }
.heat td, .heat th { border: 0; padding: 0; text-align: center; font-size: 11px; text-transform: none; letter-spacing: 0; }
.heat td.cell { height: 26px; border-radius: 4px; }
.heat th.day { text-align: right; padding-right: 6px; width: 40px; }
.legend { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); margin-top: 10px; }
.swatch { width: 22px; height: 12px; border-radius: 3px; display: inline-block; }
.toggle { display: inline-flex; gap: 6px; margin-bottom: 12px; }
.note { color: var(--muted); font-size: 13px; margin-top: 10px; }
.scroll { overflow-x: auto; }
footer { color: var(--faint); font-size: 12.5px; margin-top: 24px; line-height: 1.7; }
.loading { text-align: center; padding: 80px 0; color: var(--muted); }
.section-gap { margin-top: 16px; }
@media print {
  :root, :root[data-theme="dark"], :root:not([data-theme="light"]) {
    --bg: #fff; --card: #fff; --ink: #1f2937; --muted: #4b5563; --faint: #6b7280; --line: #d1d5db;
    --brand: #2a78d6; --bar: #5b6b73; --ok: #1baf7a; --person: #eb6834; --quiet: #a3a29c; --unknown: #4a3aa7; --alert: #c23b3b; --shadow: none;
    --t1: #2a78d6; --t2: #eb6834; --t3: #1baf7a; --t4: #eda100; --t5: #e87ba4; --t6: #008300; --t7: #4a3aa7; --t8: #e34948; --seq-lo: #cde2fb; --seq-hi: #104281; --concern: #4a3aa7; --hero-a: #1c5cab; --hero-b: #1baf7a;
  }
  .controls, .noprint { display: none !important; }
  .card { break-inside: avoid; } .wrap { max-width: none; padding: 0; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow">Machino · Customer enquiries</div>
      <h1 id="periodTitle">Customer Enquiries</h1>
      <div class="sub" id="updated">Loading…</div>
    </div>
    <div class="controls">
      <label for="period" class="sub" style="margin:0">Show</label>
      <select id="period" aria-label="Choose the time period"></select>
      <button id="refresh" title="Load the latest data">↻ Refresh</button>
      <button id="print" class="noprint" title="Print or save as PDF">Print / PDF</button>
      <button id="theme" class="noprint" title="Switch light / dark">🌙 Dark</button>
    </div>
  </header>

  <div id="banner"></div>
  <div id="app"><div class="loading">Loading the latest enquiries…</div></div>
  <footer id="footer"></footer>
</div>

<script>
/* ==================================================================== LOGIC-START
   Same counting rules as docs/bot-issue-log/bot-issue-report.gs (the Sheet REPORT).
   The config below must match BIL_CONFIG there — docs/bot-issue-log/test-dashboard.js checks it.
   To change: edit BOTH files, then run: node docs/bot-issue-log/test-dashboard.js */
const CFG = {
  CSV_URL: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSDB8b_yapTLgeVDqHt77yBvh3SpkYObGBpYUH-9rCluDZnnYFzKPgTVXNHqRxac2ze5D_um6Mn4f6W/pub?gid=1264505486&single=true&output=csv',
  REFRESH_MINUTES: 5,          // Google refreshes a published CSV about every 5 minutes
  STALE_HOURS: 24,             // newest chat older than this → warning
  FETCH_TIMEOUT_S: 20,
  OFFSET_H: 8,                 // Malaysia time
  DATE_FORMAT: 'MDY',          // SleekFlow sends 09/28/2026 07:28:03 +00:00
  ADMIN_NAME: 'Amani',
  BUSIEST_MIN_CHATS: 20,
  SMALL_TOTAL: 20,             // below this, show "3 of 12" instead of a percentage
  COLUMNS: {
    when: ['Date & Time', 'Date/Time', 'DateTime', 'Date', 'LastContactFromCustomers'],
    topics: ['Topics', 'Topic', 'Issue', 'Issues', 'Issue / Topics', 'ChatTopics', 'Bot Topics'],
    details: ['Details', 'Detail', 'Concern', 'Concerns', 'Issue Details', 'ChatDetails', 'Bot Details'],
    outcome: ['Outcome', 'Final Outcome', 'Ending', 'Result'],
    test: ['Test', 'Test Row', 'BotTester'],
    channel: ['Channel'],
    version: ['Flow Version', 'Version', 'Bot Version'],
  },
  REQUIRED: ['when', 'topics', 'details', 'outcome'],
  TOPICS: [
    { name: 'Order Status', also: ['order', 'orders', "where's my order", 'order tracking'] },
    { name: 'Sizing', also: ['size', 'shoe size', "what's my shoe size"] },
    { name: 'Return / Exchange', also: ['return', 'exchange', 'return or exchange', 'returns'] },
    { name: 'Complaint / Feedback', also: ['complaint', 'feedback', 'complaints & feedback'] },
    { name: 'Store Information', also: ['store', 'stores', 'store & hours', 'store and hours', 'store info'] },
    { name: 'Restock', also: ['restocks'] },
    { name: 'Pick-up Order', also: ['pick-up', 'pickup', 'pick up'] },
    { name: 'Other', also: ['other (not selected)', 'asked for a person', 'talk to a human'] },
  ],
  DETAILS: [
    { label: 'Wide feet', also: ['wide'] },
    { label: 'Flat feet', also: ['flat'] },
    { label: 'Slim / narrow feet', also: ['slim feet', 'slim', 'narrow feet'] },
    { label: 'Bunions', also: ['bunion'] },
    { label: 'General size guide', also: ['general guide', 'size guide'] },
    { label: 'Sent online return link', also: ['online self-service', 'online self service', 'online return'] },
    { label: 'Return shipping cost', also: ['shipping cost'] },
    { label: 'Refund question', also: ['refund type', 'refund'] },
    { label: 'Bought in store', also: ['in-store purchase', 'in store purchase', 'in-store'] },
    { label: 'Damaged / wrong item', also: ['defect', 'defect / issue', 'defect or issue', 'damaged'] },
    { label: 'Order found', also: ['found'] },
    { label: "Couldn't find their order", also: ['order not found', 'not found'] },
    { label: 'Order needs staff', also: ['needs staff'] },
    { label: 'Order check not working', also: ['order check error', 'lookup error', 'order lookup error'], systemError: true },
    { label: 'Pick-up open', also: ['open', 'pickup open'] },
    { label: 'Pick-up closed right now', also: ['pick-up closed', 'pickup closed', 'closed'] },
    { label: 'Pick-up check not working', also: ['pick-up error', 'pickup error', 'pick-up check error'], systemError: true },
  ],
  OUTCOME_WORDS: {
    HUMAN: ['human', 'handed', 'handover', 'person', 'staff'],
    QUIET: ['stopped', 'quiet', 'safeclose', 'noreply', 'silent', 'didnt', 'didnot', 'notreply'],
    BOT: ['ended', 'completed', 'resolved', 'finished', 'selfservice'],
  },
  ALERT: { MIN_CHATS: 10, MIN_RISE: 5, MIN_RATIO: 1.5, MIN_DAY_OF_MONTH: 7, SHARE_POINTS: 5, MAX_LINES: 3 },
};
const DAY = 86400000;
const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const OUTCOME_LABEL = { BOT: 'Finished without staff', HUMAN: 'Needed a person', QUIET: 'Customer stopped replying', UNKNOWN: 'Ending unknown' };
const OTHER_CONCERN = 'Other concern';

const norm = s => String(s == null ? '' : s).toLowerCase().replace(/[^a-z0-9]/g, '');
const splitItems = s => String(s == null ? '' : s).split(/→|->|=>|>|\||;|,|\n/).map(x => x.trim()).filter(Boolean);

/** RFC-4180-style CSV → array of rows (quoted commas, "" escapes, CRLF). */
function parseCSV(text) {
  const rows = []; let row = []; let field = ''; let q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else q = false; }
      else field += c;
    } else if (c === '"') q = true;
    else if (c === ',') { row.push(field); field = ''; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && text[i + 1] === '\n') i++;
      row.push(field); rows.push(row); row = []; field = '';
    } else field += c;
  }
  if (field !== '' || row.length) { row.push(field); rows.push(row); }
  return rows.filter(r => r.some(v => v.trim() !== ''));
}

function findColumns(header) {
  const n = header.map(norm); const cols = {};
  Object.keys(CFG.COLUMNS).forEach(f => {
    for (const name of CFG.COLUMNS[f]) { const i = n.indexOf(norm(name)); if (i !== -1) { cols[f] = i; break; } }
  });
  const missing = CFG.REQUIRED.filter(f => cols[f] === undefined);
  if (missing.length) throw new Error('the data is missing column(s): ' + missing.map(f => CFG.COLUMNS[f][0]).join(', '));
  return cols;
}

function parseWhen(value, format) {
  const offsetMs = CFG.OFFSET_H * 3600000;
  if (value instanceof Date) return isNaN(value.getTime()) ? null : { ms: value.getTime(), hasSeconds: true };
  if (typeof value !== 'string') return null;
  const s = value.trim(); if (!s) return null;
  const TIME = '(?:[T\\s,]+(\\d{1,2}):(\\d{2})(?::(\\d{2}))?(?:\\.\\d+)?\\s*([ap]\\.?m\\.?)?)?';
  const ZONE = '\\s*(Z|(?:UTC|GMT)?\\s*[+-]\\d{2}:?\\d{2})?$';
  const zoneMin = z => { if (!z) return null; if (/^z$/i.test(z)) return 0; const t = z.replace(/UTC|GMT|\s|:/gi, ''); return (t[0] === '-' ? -1 : 1) * (Number(t.slice(1, 3)) * 60 + Number(t.slice(3, 5))); };
  function build(y, mo, d, hh, mi, se, ampm, zone) {
    y = +y; mo = +mo; d = +d; let h = hh === undefined ? 0 : +hh; const min = mi === undefined ? 0 : +mi; const sec = se === undefined ? 0 : +se;
    if (ampm) { if (h < 1 || h > 12) return null; h = (h % 12) + (/^p/i.test(ampm) ? 12 : 0); }
    if (mo < 1 || mo > 12 || d < 1 || d > 31 || h > 23 || min > 59 || sec > 59) return null;
    const w = Date.UTC(y, mo - 1, d, h, min, sec); const c = new Date(w);
    if (c.getUTCMonth() !== mo - 1 || c.getUTCDate() !== d) return null;
    return { ms: zone === null ? w - offsetMs : w - zone * 60000, hasSeconds: se !== undefined };
  }
  let m = new RegExp('^(\\d{4})-(\\d{1,2})-(\\d{1,2})' + TIME + ZONE, 'i').exec(s);
  if (m) return build(m[1], m[2], m[3], m[4], m[5], m[6], m[7], zoneMin(m[8]));
  m = new RegExp('^(\\d{1,2})[/.-](\\d{1,2})[/.-](\\d{4})' + TIME + ZONE, 'i').exec(s);
  if (m) {
    const zone = zoneMin(m[8]); const a = +m[1], b = +m[2]; let order;
    if (a > 12 && b <= 12) order = 'DMY'; else if (b > 12 && a <= 12) order = 'MDY';
    else if (format === 'DMY' || format === 'MDY') order = format; else if (a === b) order = 'DMY'; else return null;
    return order === 'DMY' ? build(m[3], b, a, m[4], m[5], m[6], m[7], zone) : build(m[3], a, b, m[4], m[5], m[6], m[7], zone);
  }
  const mon = w => { const i = ['jan', 'feb', 'mar', 'apr', 'may', 'jun', 'jul', 'aug', 'sep', 'oct', 'nov', 'dec'].indexOf(w.slice(0, 3).toLowerCase()); return i === -1 ? null : i + 1; };
  m = new RegExp('^(\\d{1,2})\\s+([A-Za-z]{3,9})\\.?,?\\s+(\\d{4})' + TIME + '$', 'i').exec(s);
  if (m && mon(m[2])) return build(m[3], mon(m[2]), m[1], m[4], m[5], m[6], m[7], null);
  m = new RegExp('^([A-Za-z]{3,9})\\.?\\s+(\\d{1,2}),?\\s+(\\d{4})' + TIME + '$', 'i').exec(s);
  if (m && mon(m[1])) return build(m[3], mon(m[1]), m[2], m[4], m[5], m[6], m[7], null);
  return null;
}

const wall = ms => { const d = new Date(ms + CFG.OFFSET_H * 3600000); return { y: d.getUTCFullYear(), m: d.getUTCMonth(), d: d.getUTCDate(), h: d.getUTCHours(), mi: d.getUTCMinutes(), dow: d.getUTCDay() }; };
const fromWall = (y, m, d, h, mi) => Date.UTC(y, m, d, h || 0, mi || 0) - CFG.OFFSET_H * 3600000;

let TOPIC_IDX = null, DETAIL_IDX = null;
function topicName(raw) {
  if (!TOPIC_IDX) { TOPIC_IDX = {}; CFG.TOPICS.forEach(t => [t.name].concat(t.also).forEach(a => { TOPIC_IDX[norm(a)] = t.name; })); }
  const n = norm(raw); if (!n) return null;
  return TOPIC_IDX[n] || String(raw).trim().slice(0, 40);
}
/** Only known concern words are shown on this public page; anything else becomes "Other concern". */
function concernOf(raw) {
  if (!DETAIL_IDX) { DETAIL_IDX = {}; CFG.DETAILS.forEach(d => [d.label].concat(d.also).forEach(a => { DETAIL_IDX[norm(a)] = d; })); }
  const n = norm(raw); if (!n) return null;
  const d = DETAIL_IDX[n];
  return d ? { label: d.label, systemError: !!d.systemError } : { label: OTHER_CONCERN, systemError: false };
}
function outcomeOf(raw) {
  const n = norm(raw); if (!n) return 'UNKNOWN';
  for (const k of ['HUMAN', 'QUIET', 'BOT']) if (CFG.OUTCOME_WORDS[k].some(w => n.includes(w))) return k;
  return 'UNKNOWN';
}
const topicOrder = name => { const i = CFG.TOPICS.findIndex(t => t.name === name); return i === -1 ? 999 : i; };

/** Rows (with header) → chats. Test rows, repeats and unreadable dates are counted, not used. */
function readChats(values) {
  const stats = { rows: 0, test: 0, unreadable: 0, duplicates: 0 };
  const chats = []; const firstSeenTopic = {}; const firstSeenConcern = {}; let logStartMs = null, newestMs = null;
  if (!values.length) return { chats, stats, firstSeenTopic, firstSeenConcern, logStartMs, newestMs };
  const cols = findColumns(values[0]);
  const cell = (row, f) => (cols[f] === undefined ? '' : (row[cols[f]] == null ? '' : row[cols[f]]));
  let prevKey = null;
  for (let i = 1; i < values.length; i++) {
    const row = values[i];
    if (['when', 'topics', 'details', 'outcome'].every(f => String(cell(row, f)).trim() === '')) continue;
    stats.rows++;
    if (String(cell(row, 'test')).trim() !== '') { stats.test++; prevKey = null; continue; }
    const when = parseWhen(String(cell(row, 'when')), CFG.DATE_FORMAT);
    const key = JSON.stringify(row.map(v => String(v).trim()));
    if (key === prevKey && when && when.hasSeconds) { stats.duplicates++; continue; }
    prevKey = key;
    if (!when) { stats.unreadable++; continue; }
    const ordered = splitItems(cell(row, 'topics')).map(topicName).filter(Boolean);
    const topics = ordered.filter((t, j) => ordered.indexOf(t) === j);
    const cOrdered = splitItems(cell(row, 'details')).map(concernOf).filter(Boolean);
    const concerns = cOrdered.filter((c, j) => cOrdered.findIndex(x => x.label === c.label) === j);
    const ch = String(cell(row, 'channel')).trim();
    const chat = {
      ms: when.ms, topics, lastTopic: ordered.length ? ordered[ordered.length - 1] : null,
      concerns, lastConcern: cOrdered.length ? cOrdered[cOrdered.length - 1].label : null,
      outcome: outcomeOf(cell(row, 'outcome')),
      channel: !ch || /^wh?at?s?app$/i.test(ch.replace(/\s/g, '')) ? 'WhatsApp' : ch,
      version: String(cell(row, 'version')).trim(),
    };
    chats.push(chat);
    if (logStartMs === null || chat.ms < logStartMs) logStartMs = chat.ms;
    if (newestMs === null || chat.ms > newestMs) newestMs = chat.ms;
    topics.forEach(t => { if (!(t in firstSeenTopic) || chat.ms < firstSeenTopic[t]) firstSeenTopic[t] = chat.ms; });
    concerns.forEach(c => { if (!(c.label in firstSeenConcern) || chat.ms < firstSeenConcern[c.label]) firstSeenConcern[c.label] = chat.ms; });
  }
  chats.sort((a, b) => a.ms - b.ms);
  return { chats, stats, firstSeenTopic, firstSeenConcern, logStartMs, newestMs };
}

function countRange(chats, r) {
  const o = { chats: 0, BOT: 0, HUMAN: 0, QUIET: 0, UNKNOWN: 0, quietNoAnswer: 0, noTopic: 0, noTopicHuman: 0, topics: {}, topicHuman: {}, concerns: {}, concernHuman: {}, systemErrors: {}, channels: {} };
  chats.forEach(c => {
    if (c.ms < r.start || c.ms >= r.end) return;
    o.chats++; o[c.outcome]++; const human = c.outcome === 'HUMAN';
    if (!c.topics.length) { o.noTopic++; if (human) o.noTopicHuman++; if (c.outcome === 'QUIET') o.quietNoAnswer++; }
    c.topics.forEach(t => { o.topics[t] = (o.topics[t] || 0) + 1; });
    if (human && c.lastTopic) o.topicHuman[c.lastTopic] = (o.topicHuman[c.lastTopic] || 0) + 1;
    c.concerns.forEach(k => { o.concerns[k.label] = (o.concerns[k.label] || 0) + 1; if (k.systemError) o.systemErrors[k.label] = (o.systemErrors[k.label] || 0) + 1; });
    if (human && c.lastConcern) o.concernHuman[c.lastConcern] = (o.concernHuman[c.lastConcern] || 0) + 1;
    o.channels[c.channel] = (o.channels[c.channel] || 0) + 1;
  });
  return o;
}

const mon3 = w => MONTHS[w.m].slice(0, 3);
/** Period keys: this | last | d7 | d30 | m:YYYY-MM (a finished month). */
function periodFor(key, nowMs) {
  const w = wall(nowMs);
  const monthStart = fromWall(w.y, w.m, 1), prevStart = fromWall(w.y, w.m - 1, 1), todayStart = fromWall(w.y, w.m, w.d);
  const p = { key, todayStart, today: { start: todayStart, end: todayStart + DAY }, last7: { start: todayStart - 6 * DAY, end: todayStart + DAY } };
  const monthName = ms => { const x = wall(ms); return MONTHS[x.m] + ' ' + x.y; };
  if (key === 'last' || key.startsWith('m:')) {
    let start;
    if (key === 'last') start = prevStart;
    else { const [y, mo] = key.slice(2).split('-').map(Number); start = fromWall(y, mo - 1, 1); }
    const sw = wall(start); const cs = fromWall(sw.y, sw.m - 1, 1);
    p.main = { start, end: fromWall(sw.y, sw.m + 1, 1), label: monthName(start), title: monthName(start) };
    p.compare = { start: cs, end: start, label: monthName(cs), short: 'in ' + monthName(cs), than: 'than ' + monthName(cs), col: 'vs ' + monthName(cs) };
    p.isThisMonth = false;
  } else if (key === 'd7' || key === 'd30') {
    const n = key === 'd7' ? 7 : 30; const start = todayStart - (n - 1) * DAY; const sw = wall(start);
    p.main = { start, end: todayStart + DAY, label: 'Last ' + n + ' days', title: 'Last ' + n + ' days (' + sw.d + ' ' + mon3(sw) + ' – ' + w.d + ' ' + mon3(w) + ' ' + w.y + ')' };
    p.compare = { start: start - n * DAY, end: start, label: 'Previous ' + n + ' days', short: 'in the ' + n + ' days before', than: 'than the ' + n + ' days before', col: 'vs ' + n + ' days before' };
    p.isThisMonth = false;
  } else {
    const end = Math.min(prevStart + (nowMs - monthStart), monthStart);
    const pw = wall(prevStart);
    p.main = { start: monthStart, end: fromWall(w.y, w.m + 1, 1), label: 'This month (1–' + w.d + ' ' + mon3(w) + ')', title: 'This month · 1–' + w.d + ' ' + MONTHS[w.m] + ' ' + w.y };
    p.compare = { start: prevStart, end, label: 'Same days last month (1–' + (end > prevStart ? wall(end - 1).d : 0) + ' ' + mon3(pw) + ')', short: 'the same days last month', than: 'than the same days last month', col: 'vs same days last month' };
    p.isThisMonth = true;
  }
  return p;
}

function diffText(diff) { return diff > 0 ? { t: '▲ ' + diff + ' more', c: 'up' } : diff < 0 ? { t: '▼ ' + (-diff) + ' fewer', c: 'down' } : { t: 'same', c: '' }; }

function mostAsked(count) {
  const names = Object.keys(count.topics); if (!names.length) return '—';
  const max = Math.max(...names.map(n => count.topics[n]));
  const top = names.filter(n => count.topics[n] === max).sort((a, b) => topicOrder(a) - topicOrder(b) || a.localeCompare(b));
  return top.length === 1 ? top[0] : top.length === 2 ? top[0] + ' & ' + top[1] : 'Several';
}

/** Everything the page shows, for one period. */
function summarize(read, nowMs, key) {
  const p = periodFor(key, nowMs);
  const main = countRange(read.chats, p.main), compare = countRange(read.chats, p.compare), today = countRange(read.chats, p.today);
  const canCompare = read.logStartMs !== null && read.logStartMs < p.compare.start && p.compare.end > p.compare.start;
  const topicRows = Object.keys(main.topics).map(name => {
    const c = compare.topics[name] || 0; const isNew = canCompare && read.firstSeenTopic[name] >= p.compare.start;
    return { name, chats: main.topics[name], human: main.topicHuman[name] || 0, compare: c, isNew, vs: !canCompare ? { t: '–', c: '' } : isNew ? { t: 'new', c: 'new' } : diffText(main.topics[name] - c) };
  }).sort((a, b) => b.chats - a.chats || topicOrder(a.name) - topicOrder(b.name) || a.name.localeCompare(b.name));
  const concernRows = Object.keys(main.concerns).map(label => ({ label, chats: main.concerns[label], human: main.concernHuman[label] || 0 }))
    .sort((a, b) => (a.label === OTHER_CONCERN) - (b.label === OTHER_CONCERN) || b.chats - a.chats || a.label.localeCompare(b.label)).slice(0, 10);

  const days = []; const lastDay = Math.min(p.main.end, p.today.end);
  for (let t = p.main.start; t < lastDay; t += DAY) {
    const r = countRange(read.chats, { start: t, end: t + DAY }); const w = wall(t);
    days.push({ label: w.d + ' ' + mon3(w), BOT: r.BOT, HUMAN: r.HUMAN, QUIET: r.QUIET, UNKNOWN: r.UNKNOWN, total: r.chats });
  }
  const heat = Array.from({ length: 7 }, () => new Array(24).fill(0));
  const heatHuman = Array.from({ length: 7 }, () => new Array(24).fill(0)); let inHeat = 0;
  read.chats.forEach(c => {
    if (c.ms < p.main.start || c.ms >= p.main.end) return;
    const w = wall(c.ms); heat[w.dow][w.h]++; inHeat++; if (c.outcome === 'HUMAN') heatHuman[w.dow][w.h]++;
  });
  let busiest = null;
  if (inHeat >= CFG.BUSIEST_MIN_CHATS) {
    const byDay = heat.map(r => r.reduce((a, b) => a + b, 0)); const byHour = new Array(24).fill(0);
    heat.forEach(r => r.forEach((n, h) => { byHour[h] += n; }));
    const day = [1, 2, 3, 4, 5, 6, 0].reduce((b, d) => (byDay[d] > byDay[b] ? d : b), 1);
    const hour = byHour.reduce((b, n, h) => (n > byHour[b] ? h : b), 0);
    busiest = { day: DAYS[day], hour };
  }
  const months = [];
  if (read.logStartMs !== null) {
    const s = wall(read.logStartMs); let start = fromWall(s.y, s.m, 1); const nw = wall(nowMs); const current = fromWall(nw.y, nw.m, 1); const stop = fromWall(nw.y, nw.m + 1, 1);
    while (start < stop) { const sw = wall(start); const end = fromWall(sw.y, sw.m + 1, 1); const r = countRange(read.chats, { start, end }); months.push({ label: mon3(sw) + ' ' + sw.y + (start === current ? ' (so far)' : ''), partial: start === current, BOT: r.BOT, HUMAN: r.HUMAN, QUIET: r.QUIET, UNKNOWN: r.UNKNOWN, total: r.chats }); start = end; }
  }
  const A = CFG.ALERT; const alerts = [];
  const sys = countRange(read.chats, p.last7).systemErrors;
  Object.keys(sys).sort().forEach(l => alerts.push({ level: 'high', text: l + ': seen ' + sys[l] + ' time' + (sys[l] === 1 ? '' : 's') + ' in the last 7 days — tell ' + CFG.ADMIN_NAME + '.' }));
  const dayOk = !p.isThisMonth || wall(nowMs).d >= A.MIN_DAY_OF_MONTH;
  if (canCompare && dayOk) {
    const rises = (n, b) => n >= A.MIN_CHATS && n - b >= A.MIN_RISE && n >= A.MIN_RATIO * b;
    topicRows.forEach(r => { if (!r.isNew && rises(r.chats, r.compare)) alerts.push({ level: 'mid', text: r.name + ' is up: ' + r.chats + ' chats, compared with ' + r.compare + ' ' + p.compare.short + '.' }); });
    Object.keys(main.concerns).forEach(l => { if (l === OTHER_CONCERN) return; const n = main.concerns[l], b = compare.concerns[l] || 0; if (read.firstSeenConcern[l] >= p.compare.start) return; if (rises(n, b)) alerts.push({ level: 'mid', text: 'More customers with "' + l + '": ' + n + ', compared with ' + b + ' ' + p.compare.short + '.' }); });
    const share = (n, t) => (t ? 100 * n / t : 0);
    const shareRise = (n, b) => compare.chats > 0 && main.chats > 0 && share(n, main.chats) - share(b, compare.chats) >= A.SHARE_POINTS && n - b >= A.MIN_RISE;
    if (shareRise(main.topics.Other || 0, compare.topics.Other || 0)) alerts.push({ level: 'mid', text: 'More chats are "Other" than before — the menu may be missing something.' });
    if (shareRise(main.noTopic, compare.noTopic)) alerts.push({ level: 'mid', text: 'More customers leave before picking a topic than before.' });
  }
  return { p, main, compare, today, canCompare, topicRows, concernRows, days, heat, heatHuman, busiest, months, alerts: alerts.slice(0, A.MAX_LINES) };
}
/* ==================================================================== LOGIC-END */

// ============================================================ page
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const share = (n, t) => (!t ? '–' : t < CFG.SMALL_TOTAL ? n + ' of ' + t : Math.round(100 * n / t) + '%');
const hourText = h => { const f = x => { x %= 24; return x === 0 ? '12 am' : x < 12 ? x + ' am' : x === 12 ? '12 pm' : (x - 12) + ' pm'; }; return f(h) + ' – ' + f(h + 1); };
const clock = ms => { const w = wall(ms); return (w.h % 12 || 12) + ':' + String(w.mi).padStart(2, '0') + (w.h < 12 ? ' am' : ' pm'); };
const stamp = ms => { const w = wall(ms); return w.d + ' ' + mon3(w) + ' ' + w.y + ', ' + clock(ms); };
const store = (k, v) => { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } };

let READ = null, LAST_TEXT = null, FETCHED_AT = null, LOADING = false, CHARTS = [], HEAT_MODE = store('heat') || 'all';

async function load(manual) {
  if (LOADING) return; LOADING = true; $('#refresh').disabled = true;
  const ctrl = new AbortController(); const timer = setTimeout(() => ctrl.abort(), CFG.FETCH_TIMEOUT_S * 1000);
  try {
    const res = await fetch(CFG.CSV_URL + (CFG.CSV_URL.includes('?') ? '&' : '?') + 't=' + Date.now(), { cache: 'no-store', signal: ctrl.signal });
    if (!res.ok) throw new Error('the data link answered ' + res.status + '.');
    const text = await res.text();
    if (/^\s*</.test(text)) throw new Error('the data link returned a web page, not data — is the sheet still "Published to the web"?');
    FETCHED_AT = Date.now();
    if (text !== LAST_TEXT) { READ = readChats(parseCSV(text)); LAST_TEXT = text; fillPeriods(); render(!manual && CHARTS.length > 0); }
    else updateHeader();
    showStale();
  } catch (e) {
    const why = e.name === 'AbortError' ? 'the data link took too long to answer.' : e.message;
    $('#banner').innerHTML = '<div class="banner warn">Couldn\'t load the latest data: ' + esc(why) + (READ ? ' Showing the last data that loaded.' : ' Please tell ' + esc(CFG.ADMIN_NAME) + '.') + '</div>';
    if (!READ) $('#app').innerHTML = '';
  } finally { clearTimeout(timer); LOADING = false; $('#refresh').disabled = false; }
}

function showStale() {
  const old = READ && READ.newestMs !== null && Date.now() - READ.newestMs > CFG.STALE_HOURS * 3600000;
  $('#banner').innerHTML = old ? '<div class="banner warn">No new chats since ' + esc(stamp(READ.newestMs)) + '. If customers have been messaging, the bot may have stopped sending data — please tell ' + esc(CFG.ADMIN_NAME) + '.</div>' : '';
}

function fillPeriods() {
  const sel = $('#period'); const keep = sel.value || store('period') || 'this';
  const nw = wall(Date.now()); const opts = [['this', 'This month'], ['last', 'Last month'], ['d7', 'Last 7 days'], ['d30', 'Last 30 days']];
  const months = [];
  if (READ.logStartMs !== null) {
    const s = wall(READ.logStartMs); let y = s.y, m = s.m;
    while (y < nw.y || (y === nw.y && m < nw.m)) { months.push(['m:' + y + '-' + String(m + 1).padStart(2, '0'), MONTHS[m] + ' ' + y]); m++; if (m > 11) { m = 0; y++; } }
  }
  months.reverse();
  sel.innerHTML = opts.concat(months).map(([v, t], i) => (i === 4 ? '<option disabled>── past months ──</option>' : '') + '<option value="' + v + '">' + esc(t) + '</option>').join('');
  sel.value = opts.concat(months).some(o => o[0] === keep) ? keep : 'this';
}

function updateHeader(S) {
  const parts = [];
  if (READ) {
    const today = S ? S.today.chats : countRange(READ.chats, periodFor('this', Date.now()).today).chats;
    parts.push('Today so far: <b>' + today + '</b> chat' + (today === 1 ? '' : 's'));
    if (READ.newestMs !== null) parts.push('latest chat ' + esc(stamp(READ.newestMs)));
  }
  if (FETCHED_AT) parts.push('checked ' + esc(clock(FETCHED_AT)) + ' · updates every ' + CFG.REFRESH_MINUTES + ' min');
  $('#updated').innerHTML = parts.join(' · ');
}

function kpi(label, value, delta, cls, accent) {
  return '<div class="card kpi" style="--accent:' + (accent || 'var(--brand)') + '"><div class="label">' + label + '</div><div class="value">' + value + '</div><div class="delta ' + (cls || '') + '">' + (delta || '&nbsp;') + '</div></div>';
}
const topicColor = name => { const i = topicOrder(name); return i < 8 ? 'var(--t' + (i + 1) + ')' : 'var(--faint)'; };
const themeLabel = () => { const cur = document.documentElement.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); $('#theme').textContent = cur === 'dark' ? '☀️ Light' : '🌙 Dark'; };
const todo = t => '<p class="todo"><b>What to do:</b> ' + t + '</p>';

function render(quiet) {
  CHARTS.forEach(c => c.destroy()); CHARTS = [];
  const key = $('#period').value; store('period', key);
  const S = summarize(READ, Date.now(), key); const m = S.main, c = S.compare;
  $('#periodTitle').textContent = S.p.main.title;
  updateHeader(S);
  const d = S.canCompare ? diffText(m.chats - c.chats) : null;

  let h = '<div class="grid kpis">';
  h += kpi('Customer chats', m.chats, d ? (d.t === 'same' ? 'No change ' + esc(S.p.compare.col) : esc(d.t) + ' ' + esc(S.p.compare.than)) : 'Nothing earlier to compare with yet', d ? d.c : '', 'var(--brand)');
  h += kpi('<span class="dot" style="background:var(--ok)"></span>Finished without staff', share(m.BOT, m.chats), m.BOT + ' chats — the bot answered and the customer was done', '', 'var(--ok)');
  h += kpi('<span class="dot" style="background:var(--person)"></span>Needed a person', share(m.HUMAN, m.chats), m.HUMAN + ' chats — often on purpose (refunds, damaged items)', '', 'var(--person)');
  h += kpi('<span class="dot" style="background:var(--quiet)"></span>Customer stopped replying', share(m.QUIET, m.chats), m.QUIET + ' chats — the bot was waiting for them' + (m.quietNoAnswer ? ' (' + m.quietNoAnswer + ' before any answer)' : ''), '', 'var(--quiet)');
  if (m.UNKNOWN) h += kpi('<span class="dot" style="background:var(--unknown)"></span>Ending unknown', share(m.UNKNOWN, m.chats), m.UNKNOWN + ' chats — tell ' + esc(CFG.ADMIN_NAME), '', 'var(--unknown)');
  h += '</div>';

  h += '<div class="card"><h2><span class="icon">⚠️</span>Worth a look</h2><ul class="alerts">' +
    (S.alerts.length ? S.alerts.map(a => '<li style="color:' + (a.level === 'high' ? 'var(--alert)' : 'inherit') + '">' + esc(a.text) + '</li>').join('') : '<li class="none">✓ Nothing unusual right now.</li>') + '</ul></div>';

  S.topicRows.forEach(r => { const col = topicColor(r.name); h += '<tr><td><span class="tdot" style="background:' + col + '"></span>' + esc(r.name) + '</td><td class="num"><b>' + r.chats + '</b></td><td><div class="bar" style="background:' + col + ';width:' + (100 * r.chats / maxT) + '%"></div></td><td class="num">' + r.human + '</td><td class="num"><span class="vs ' + r.vs.c + '">' + r.vs.t + '</span></td></tr>'; });
  if (m.noTopic) { const dv = S.canCompare ? diffText(m.noTopic - c.noTopic) : { t: '–', c: '' }; h += '<tr><td style="color:var(--muted)">Didn\'t pick a topic</td><td class="num">' + m.noTopic + '</td><td><div class="bar" style="opacity:.4;width:' + (100 * m.noTopic / maxT) + '%"></div></td><td class="num">' + m.noTopicHuman + '</td><td class="num"><span class="vs ' + dv.c + '">' + dv.t + '</span></td></tr>'; }
  if (!S.topicRows.length && !m.noTopic) h += '<tr><td colspan="5" style="color:var(--muted)">No chats in this period yet.</td></tr>';
  h += '</tbody></table></div>' + todo('the top topics are where the bot saves staff the most time — keep those answers correct. A topic with many "handed to staff" may need a clearer bot answer or a new FAQ.') + '</div>';

      todo('common concerns are ideas for FAQ answers or clearer bot messages. "Not working" lines are IT problems — tell ' + esc(CFG.ADMIN_NAME) + '.');
  } else h += '<p class="note">No concerns recorded yet — the bot only sends topics for now.</p>';

  // When

       '<div class="toggle noprint" role="group" aria-label="Which chats"><button data-heat="all" aria-pressed="' + (HEAT_MODE !== 'human') + '">All chats</button><button data-heat="human" aria-pressed="' + (HEAT_MODE === 'human') + '">Needed a person</button></div>' +

  const st = READ.stats; const f = [];
  f.push('Counts customer enquiries that reached an ending in the chat bot. It doesn\'t measure staff, and it isn\'t the complaint case list.');
  f.push('No customer names, phone numbers or messages are stored — only topics, outcomes and times.');
  const chans = Object.keys(m.channels); if (chans.length > 1) f.push('By channel: ' + chans.map(k => k + ' ' + m.channels[k]).join(' · ') + '.');
  if (!S.canCompare) f.push(READ.logStartMs === null ? 'No chats logged yet.' : 'No comparison for this period — the log starts on ' + stamp(READ.logStartMs).split(',')[0] + '.');
  if (st.test) f.push('Test chats not counted: ' + st.test + '.');
  if (st.unreadable) f.push(st.unreadable + ' chat(s) had a date that couldn\'t be read, so they aren\'t counted — tell ' + CFG.ADMIN_NAME + '.');
  if (st.duplicates) f.push(st.duplicates + ' repeated row(s) ignored.');
  f.push(READ.chats.length + ' chats in the log · source: SleekFlow Tracker (Google Sheet) · Malaysia time');
  $('#footer').innerHTML = f.map(esc).join('<br>');
}

function heatTable(heat) {
  const max = Math.max(1, ...heat.flat()); const order = [1, 2, 3, 4, 5, 6, 0];
  const shade = n => (n ? 'color-mix(in oklab, var(--seq-hi) ' + Math.round(100 * Math.sqrt(n / max)) + '%, var(--seq-lo))' : 'var(--line)');
  let t = '<div class="heat"><table><thead><tr><th></th>' + Array.from({ length: 24 }, (_, hh) => '<th>' + (hh % 3 === 0 ? (hh === 0 ? '12a' : hh < 12 ? hh + 'a' : hh === 12 ? '12p' : (hh - 12) + 'p') : '') + '</th>').join('') + '</tr></thead><tbody>';
  order.forEach(dw => {
    t += '<tr><th class="day">' + DAYS[dw].slice(0, 3) + '</th>' + heat[dw].map((n, hh) => '<td class="cell" title="' + DAYS[dw] + ', ' + hourText(hh) + ': ' + n + ' chat' + (n === 1 ? '' : 's') + '" style="background:' + shade(n) + ';opacity:' + (n ? 1 : .5) + '"></td>').join('') + '</tr>';
  });
  return t + '</tbody></table></div><div class="legend"><span>0</span><span class="swatch" style="background:' + shade(Math.max(1, Math.round(max / 4))) + '"></span><span class="swatch" style="background:' + shade(Math.round(max / 2) || 1) + '"></span><span class="swatch" style="background:' + shade(max) + '"></span><span>' + max + ' chats in one hour</span></div>';
}

function drawCharts(S, quiet) {
  if (!window.Chart) { ['#nochart1', '#nochart2'].forEach(s => { const e = $(s); if (e) e.innerHTML = '<p class="note">Charts couldn\'t load (no internet to the chart library). The tables above are still correct.</p>'; }); document.querySelectorAll('canvas').forEach(c => { c.parentElement.style.display = 'none'; }); return; }
  const grid = css('--line');
  Chart.defaults.font.family = getComputedStyle(document.body).fontFamily; Chart.defaults.color = css('--muted');
  if (quiet) Chart.defaults.animation = false; else Chart.defaults.animation = { duration: 500 };
  const colors = { BOT: css('--ok'), HUMAN: css('--person'), QUIET: css('--quiet'), UNKNOWN: css('--unknown') };
  const keys = ['BOT', 'HUMAN', 'QUIET', 'UNKNOWN'].filter(k => k !== 'UNKNOWN' || S.main.UNKNOWN || S.months.some(mo => mo.UNKNOWN));
  const el = id => document.getElementById(id);
  const stacked = (id, rows, fade) => { if (el(id)) CHARTS.push(new Chart(el(id), {
    type: 'bar',
    data: { labels: rows.map(r => r.label), datasets: keys.map(k => ({ label: OUTCOME_LABEL[k], data: rows.map(r => r[k]), backgroundColor: rows.map(r => colors[k] + (fade && r.partial ? '80' : '')), borderRadius: 3, stack: 's' })) },
    options: { maintainAspectRatio: false, scales: { x: { stacked: true, grid: { display: false } }, y: { stacked: true, beginAtZero: true, grid: { color: grid }, ticks: { precision: 0 } } }, plugins: { legend: { position: 'bottom' } } },
  })); };
  stacked('cDaily', S.days, false);
  stacked('cMonths', S.months, true);
  if (el('cOutcome')) {
    if (!S.main.chats) { el('cOutcome').parentElement.innerHTML = '<p class="note">No chats in this period yet.</p>'; return; }
    CHARTS.push(new Chart(el('cOutcome'), {
      type: 'doughnut',
      data: { labels: keys.map(k => OUTCOME_LABEL[k]), datasets: [{ data: keys.map(k => S.main[k]), backgroundColor: keys.map(k => colors[k]), borderColor: css('--card'), borderWidth: 2 }] },
      options: { maintainAspectRatio: false, cutout: '62%', plugins: { legend: { position: 'bottom' }, tooltip: { callbacks: { label: x => ' ' + x.label + ': ' + x.raw + ' (' + share(x.raw, S.main.chats) + ')' } } } },
    }));
  }
}

$('#period').addEventListener('change', () => READ && render());
$('#refresh').addEventListener('click', () => load(true));
$('#print').addEventListener('click', () => window.print());
$('#theme').addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', next); store('theme', next); themeLabel(); if (READ) render(true);
});
window.addEventListener('beforeprint', () => { if (READ) { const t = document.documentElement.getAttribute('data-theme'); document.documentElement.setAttribute('data-theme', 'light'); render(true); window.addEventListener('afterprint', () => { if (t) document.documentElement.setAttribute('data-theme', t); else document.documentElement.removeAttribute('data-theme'); render(true); }, { once: true }); } });
(function init() {
  const t = store('theme'); if (t) document.documentElement.setAttribute('data-theme', t); themeLabel();
  load(true);
  setInterval(() => { if (!document.hidden) load(false); }, CFG.REFRESH_MINUTES * 60000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden && FETCHED_AT && Date.now() - FETCHED_AT > CFG.REFRESH_MINUTES * 60000) load(false); });
})();
</script>
