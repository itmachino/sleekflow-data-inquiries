<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Customer Service Report · Machino</title>
<meta name="description" content="Machino customer service report: how many customers contacted us, what they ask about on WhatsApp, and who answered them.">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" integrity="sha384-9nhczxUqK87bcKHh20fSQcTGD4qq5GhayNYSYWqwBkINBhOfQLg/P5HG5lF1urn4" crossorigin="anonymous"></script>
<style>
/* Warm report style. One system font, one brown accent for bars.
   Colour only means something: sage = completed by bot, terracotta = human assistance, warm grey = customer stopped replying / no reply,
   red-brown = something to check. Channels have their own colours (WhatsApp green, Instagram red, TikTok blue) and only appear in channel charts. */
:root {
  color-scheme: light;
  --bg: #f7f1e7; --panel: #fffdf9; --soft: #f1e9dc; --hover: #faf5ec; --ink: #201e1d; --muted: #5c544a; --faint: #6c6357; --line: #e2d7c5; --line2: #cfc4b2;
  --accent: #4b4038; --accent-soft: #a89885; --track: #efe6d8;
  --wa: #2e9e5b; --ig: #d4473f; --tt: #2f6db5; --em: #8a8178; --moved: #e3d8c6; --event: rgba(75, 64, 56, .08);
  --ok: #5f7448; --person: #cf7640; --quiet: #bdb5a9; --unknown: #6a5aa0; --alert: #a8431b; --alert-bg: #f9e4d4; --focus: #b8622c;
  --shadow: 0 1px 2px rgba(60, 40, 20, .05), 0 6px 18px rgba(60, 40, 20, .04);
  --r-lg: 16px; --r-md: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #141210; --panel: #1e1b18; --soft: #2a2622; --hover: #25211d; --ink: #f3ede4; --muted: #cbc1b3; --faint: #aca294; --line: #3a342d; --line2: #4f4840;
    --accent: #d8cbb8; --accent-soft: #7d7063; --track: #2b2723;
    --wa: #5cc98a; --ig: #f07a72; --tt: #74a9ea; --em: #a89f94; --moved: #45403a; --event: rgba(216, 203, 184, .09);
    --ok: #93aa73; --person: #e3905d; --quiet: #857d73; --unknown: #a295e6; --alert: #f2a47c; --alert-bg: #3b2519; --focus: #e3905d;
    --shadow: none;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #141210; --panel: #1e1b18; --soft: #2a2622; --hover: #25211d; --ink: #f3ede4; --muted: #cbc1b3; --faint: #aca294; --line: #3a342d; --line2: #4f4840;
  --accent: #d8cbb8; --accent-soft: #7d7063; --track: #2b2723;
  --wa: #5cc98a; --ig: #f07a72; --tt: #74a9ea; --em: #a89f94; --moved: #45403a; --event: rgba(216, 203, 184, .09);
  --ok: #93aa73; --person: #e3905d; --quiet: #857d73; --unknown: #a295e6; --alert: #f2a47c; --alert-bg: #3b2519; --focus: #e3905d;
  --shadow: none;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-variant-numeric: tabular-nums; }
.wrap { max-width: 1440px; margin: 0 auto; padding: 28px 32px 96px; }
a { color: var(--ink); text-decoration-color: var(--line2); text-underline-offset: 3px; }
a:hover { text-decoration-color: currentColor; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
p { text-wrap: pretty; margin: 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---- Header panel (title, tabs) */
.topbar { background: var(--panel); border: 1px solid var(--line2); border-radius: 18px; box-shadow: var(--shadow); padding: 26px 30px 0; }
.hdr { display: flex; flex-wrap: wrap; gap: 16px 24px; align-items: flex-start; justify-content: space-between; }
.brand { font-size: 12.5px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
h1 { margin: 0; font-size: clamp(28px, 4vw, 40px); line-height: 1.1; font-weight: 750; letter-spacing: -.028em; text-wrap: balance; }
.period { margin-top: 8px; font-size: clamp(17px, 2.2vw, 21px); font-weight: 600; color: var(--accent); }
.morning { margin-top: 12px; font-size: 15px; color: var(--ink); }
.morning:empty { display: none; }
.meta { margin-top: 6px; font-size: 13px; color: var(--faint); }
.tools { display: flex; gap: 8px; }
.btn { font: inherit; font-size: 14px; font-weight: 500; color: var(--ink); background: var(--panel); border: 1px solid var(--line2); border-radius: 10px; padding: 0 14px; height: 36px; cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--muted); background: var(--hover); }
.btn:active { background: var(--soft); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.ghost { background: none; color: var(--muted); }
.btn.ghost:hover { color: var(--ink); background: var(--panel); }

/* ---- Tabs */
.tabs { display: flex; gap: 30px; margin-top: 24px; border-top: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { font: inherit; font-size: 15.5px; font-weight: 600; color: var(--muted); background: none; border: 0; border-bottom: 3px solid transparent; padding: 14px 2px 12px; cursor: pointer; white-space: nowrap; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }

/* ---- Filters (quiet) */
.filters { display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: center; padding: 16px 4px 0; }
.f { display: flex; align-items: center; gap: 8px; }
.f label { font-size: 13px; color: var(--muted); }
select, input[type="date"] { font: inherit; font-size: 14px; color: var(--ink); background: var(--panel); border: 1px solid var(--line2); border-radius: 10px; padding: 0 10px; height: 36px; }
select:hover, input[type="date"]:hover { border-color: var(--muted); }
.spacer { flex: 1; }

/* ---- Notices */
#notices { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }
#notices:empty { display: none; }
.notice { background: var(--alert-bg); border-radius: var(--r-md); padding: 12px 18px; font-size: 14px; }
.notice.info { background: var(--soft); }
.notice p + p { margin-top: 2px; }
.notice .tech { font-size: 12.5px; color: var(--muted); }

/* ---- Layout */
.tabpanel { margin-top: 24px; display: flex; flex-direction: column; gap: 20px; }
.tabpanel:focus { outline: none; }
.cols { display: grid; gap: 20px; align-items: stretch; }
.c32 { grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); }
.c11 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.c21 { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); }
.pagehead { display: flex; flex-direction: column; gap: 4px; padding: 4px 2px 0; }
.pagehead h2 { margin: 0; font-size: 26px; line-height: 1.2; font-weight: 750; letter-spacing: -.02em; }
.pagehead p { color: var(--muted); }
.pagehead .src { font-size: 13px; color: var(--faint); }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow); padding: 26px 28px 26px; display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.card-h { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 4px 16px; }
.card-h h3 { margin: 0; font-size: 20px; line-height: 1.25; font-weight: 700; letter-spacing: -.012em; }
.src { font-size: 13px; color: var(--faint); }
.card-h .src { margin-top: 2px; }
.note { font-size: 13px; color: var(--muted); margin-top: 3px; max-width: 62ch; }
.pc { color: var(--muted); font-weight: 400; }
.chg { margin-left: 6px; font-size: 12.5px; color: var(--faint); font-weight: 400; }
.more { font-size: 14px; font-weight: 600; white-space: nowrap; }
.lede { font-size: 16px; }
.def { font-size: 12.5px; color: var(--faint); }
.foot { font-size: 13.5px; color: var(--muted); }
.muted { color: var(--muted); }
h4.subh { margin: 8px 0 0; font-size: 16px; font-weight: 700; }
.lab-c { display: inline-flex; align-items: center; gap: 8px; }
.key { display: inline-block; width: 10px; height: 10px; border-radius: 999px; flex: none; }

/* ---- Number cards */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow); padding: 22px 24px 20px; display: flex; flex-direction: column; min-width: 0; }
.k-label { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.k-src { margin-top: auto; padding-top: 14px; font-size: 12px; color: var(--faint); }
.k-val { margin-top: 12px; font-size: clamp(36px, 4.4vw, 50px); font-weight: 750; letter-spacing: -.035em; line-height: 1.05; overflow-wrap: anywhere; }
.k-val.txt { font-size: clamp(26px, 2.9vw, 34px); letter-spacing: -.025em; line-height: 1.12; padding: 4px 0 3px; overflow-wrap: normal; text-wrap: balance; }
.k-sub { margin-top: 8px; font-size: 14px; color: var(--ink); }
.k-cmp { margin-top: 2px; font-size: 13px; color: var(--muted); }
.kpi .def { margin-top: 10px; }
.card .kpi { box-shadow: none; background: var(--hover); }
.card .k-label { min-height: 3.1em; align-items: flex-start; }
.card .k-label .key { margin-top: .3em; }
.kpi > :last-child { margin-bottom: 0; }

/* ---- Status strip (things to check) */
.status { display: flex; gap: 14px; align-items: flex-start; padding: 16px 22px; border-radius: var(--r-lg); background: var(--panel); border: 1px solid var(--line); }
.status.warn { background: var(--alert-bg); border-color: transparent; }
.status .ico { flex: none; width: 24px; height: 24px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800; line-height: 1; color: var(--panel); background: var(--ok); margin-top: 1px; }
.status.warn .ico { background: var(--alert); }
.st-h { font-weight: 700; font-size: 15px; }
.status.ok .st-h { font-weight: 600; color: var(--muted); }
.status ul { list-style: none; margin: 6px 0 0; padding: 0; display: flex; flex-direction: column; gap: 4px; font-size: 14.5px; }
.status li { padding-left: 16px; position: relative; }
.status li::before { content: ""; position: absolute; left: 2px; top: .62em; width: 6px; height: 6px; border-radius: 999px; background: var(--alert); }
.status .src { margin-top: 6px; }

/* ---- Ranked bars (what customers ask about, common concerns) */
.rank { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 16px; }
.rk { display: grid; grid-template-columns: minmax(110px, 170px) minmax(0, 1fr) 46px 44px; grid-template-areas: "name bar n p"; align-items: center; gap: 4px 14px; }
.rk.cmp { grid-template-columns: minmax(110px, 170px) minmax(0, 1fr) 46px 44px 88px; grid-template-areas: "name bar n p vs"; }
.rk.narrow { grid-template-columns: minmax(0, 1fr) 46px; grid-template-areas: "name n" "bar bar"; }
.rk-name { grid-area: name; font-size: 15px; font-weight: 600; line-height: 1.3; }
.rk-name small { display: block; font-size: 12.5px; font-weight: 400; color: var(--faint); }
.rk-track { grid-area: bar; height: 12px; border-radius: 999px; background: var(--track); overflow: hidden; }
.rk-track i { display: block; height: 100%; min-width: 4px; border-radius: 999px; background: var(--accent-soft); }
.rk.first .rk-track i { background: var(--accent); }
.rk-n { grid-area: n; text-align: right; font-size: 17px; font-weight: 700; }
.rk-p { grid-area: p; text-align: right; font-size: 13.5px; color: var(--muted); }
.rk-vs { grid-area: vs; text-align: right; font-size: 12.5px; color: var(--faint); white-space: nowrap; }

/* ---- Outcome rows (small, quiet) */
.oc-bar { display: flex; gap: 3px; height: 12px; }
.oc-bar span { display: block; border-radius: 999px; min-width: 6px; }
.oc { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.oc li { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; align-items: baseline; gap: 2px 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.oc li:last-child { border-bottom: 0; padding-bottom: 0; }
.oc .key { align-self: center; }
.oc-name { font-size: 15px; font-weight: 600; }
.oc-v { font-size: 22px; font-weight: 700; letter-spacing: -.02em; text-align: right; }
.oc-c { grid-column: 2 / 4; font-size: 13px; color: var(--muted); }
.reply { background: var(--soft); border-radius: var(--r-md); padding: 14px 18px; display: flex; flex-direction: column; gap: 2px; }
.reply .main { font-size: 15px; }

/* ---- Two "chosen most" lists */

/* ---- Tables */
.tw { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14.5px; }
th { text-align: left; font-weight: 650; font-size: 12px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); padding: 0 12px 10px; border-bottom: 1px solid var(--line2); vertical-align: bottom; }
td { padding: 13px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th:first-child, td:first-child { padding-left: 4px; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr:hover td { background: var(--hover); }
th.num, td.num { text-align: right; white-space: nowrap; }
.defs td:first-child { font-weight: 650; white-space: nowrap; }
.defs td { vertical-align: top; }
.defs tbody tr:hover td { background: none; }

.tblctl { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 14px; }
.tblctl .lnk { white-space: nowrap; }
.lnk { font: inherit; background: none; border: 0; padding: 4px 0; color: var(--ink); cursor: pointer; text-decoration: underline; text-decoration-color: var(--line2); text-underline-offset: 3px; }
.lnk:hover { text-decoration-color: currentColor; }
.topics td.barcell { width: 18%; }
.topics th.vs, .topics td.vs { white-space: normal; min-width: 96px; max-width: 130px; }
.bar { height: 10px; border-radius: 999px; background: var(--accent); min-width: 4px; }
.topics tbody.grp { border-bottom: 1px solid var(--line); }
.topics tbody.grp:last-child { border-bottom: 0; }
.topics tbody.grp:hover td { background: var(--hover); }
.topics tbody.grp td { border-bottom: 0; }
.topics tr.top td { font-weight: 700; padding-top: 10px; padding-bottom: 10px; }
.topics tr.top td.muted { font-weight: 400; }
.tgl { font: inherit; font-weight: 700; color: var(--ink); background: none; border: 0; display: inline-flex; align-items: center; gap: 9px; cursor: pointer; min-height: 40px; border-radius: 999px; padding: 4px 14px 4px 4px; margin: -6px 0 -6px -4px; text-align: left; }
.tgl:hover { background: var(--soft); }
.chev { width: 28px; height: 28px; flex: none; border-radius: 999px; background: var(--soft); display: inline-flex; align-items: center; justify-content: center; transition: transform .2s ease; }
.tgl:hover .chev { background: var(--line); }
.grp.open .chev { transform: rotate(90deg); }
.hint { font-size: 12.5px; font-weight: 500; color: var(--faint); white-space: nowrap; }
.plain { display: inline-block; padding-left: 37px; }
.topics tr.sub td { padding: 0; border: 0; color: var(--muted); font-size: 14px; }
.cl { display: grid; grid-template-rows: 1fr; transition: grid-template-rows .2s ease; }
.cl > div { min-height: 0; overflow: hidden; }
.cl .p { padding: 6px 12px; }
.topics tr.sub td:first-child .p { padding-left: 4px; }
.grp:not(.open) tr.sub .cl { grid-template-rows: 0fr; }
.grp:not(.open) tr.sub .cl > div { visibility: hidden; transition: visibility 0s .2s; }
.tree { position: relative; display: block; padding-left: 50px; }
.tree::before { content: ""; position: absolute; left: 15px; top: -6px; bottom: -6px; border-left: 1.5px solid var(--line2); }
.tree::after { content: ""; position: absolute; left: 15px; top: 50%; width: 22px; border-top: 1.5px solid var(--line2); }
tr.sub.last .tree::before { bottom: 50%; }
tr.sub.last .p { padding-bottom: 12px !important; }
tr.sub .bar { height: 6px; background: var(--accent-soft); }
.tag { display: block; width: max-content; margin: 3px 0 0 auto; font-size: 11.5px; font-weight: 600; color: var(--ink); background: var(--soft); border-radius: 999px; padding: 1px 9px; }

/* ---- Colour key */
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13.5px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 7px; }
.legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; flex: none; }
.legend i.ev { background: var(--event); border: 1px dashed var(--line2); }
.legend b { color: var(--ink); font-weight: 650; }

/* ---- Completed-by-bot and human-assistance cards (matched pair) */
.side { border-top: 4px solid var(--line2); }
.side-bot { border-top-color: var(--ok); }
.side-human { border-top-color: var(--person); }
.side .card-h h3 { display: flex; align-items: center; gap: 10px; }
.side-total { font-size: 14px; color: var(--muted); white-space: nowrap; text-align: right; }
.side-total b { display: block; font-size: 32px; line-height: 1.05; letter-spacing: -.03em; color: var(--ink); font-weight: 750; }
.side-t td.barcell { width: 34%; }
.endbar { display: flex; gap: 2px; height: 10px; min-width: 110px; }
.endbar span { display: block; border-radius: 3px; min-width: 3px; }
.topics.wide td.barcell { width: 16%; }
.topics.wide th { white-space: normal; }
.example { font-size: 14.5px; background: var(--soft); border-radius: var(--r-md); padding: 12px 16px; }
.side-t td.num { white-space: nowrap; }
.tblctl .src { margin-left: auto; align-self: center; }

/* ---- Chart and small facts */
.chart { position: relative; height: 300px; }
.facts { display: flex; flex-wrap: wrap; gap: 8px; }
.fact { background: var(--soft); border-radius: 999px; padding: 7px 16px; font-size: 14px; }
.notes ul { margin: 0; padding-left: 18px; color: var(--muted); font-size: 14px; }
.notes li { margin: 5px 0; }
.loading { padding: 60px 6px; color: var(--muted); }
details.more-info { border-top: 1px solid var(--line); padding-top: 14px; }
details.more-info summary { cursor: pointer; font-size: 14px; font-weight: 600; color: var(--muted); }
details.more-info summary:hover { color: var(--ink); }
details.more-info .tw { margin-top: 12px; }

@media (max-width: 900px) {
  .cols { grid-template-columns: minmax(0, 1fr); }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 640px) {
  body { font-size: 14.5px; }
  .wrap { padding: 16px 12px 72px; }
  .topbar { padding: 18px 16px 0; border-radius: 14px; }
  .tools { width: 100%; }
  .tabs { gap: 22px; margin-top: 18px; }
  .tab { font-size: 15px; }
  .filters { gap: 10px 14px; }
  .f { flex: 1 1 40%; flex-direction: column; align-items: stretch; gap: 4px; }
  .f:first-child { flex-basis: 100%; }
  .f select, .f input { width: 100%; }
  .spacer { display: none; }
  #refresh { width: 100%; }
  .card { padding: 20px 18px; border-radius: 14px; }
  .card-h h3 { font-size: 18px; }
  .kpis { gap: 12px; }
  .kpi { padding: 16px 16px 15px; border-radius: 14px; }
  .k-val { font-size: 34px; }
  .k-val.txt { font-size: 24px; }
  .k-sub { font-size: 13.5px; }
  .k-cmp { font-size: 12.5px; }
  .status { padding: 14px 16px; }
  .rk, .rk.cmp { grid-template-columns: minmax(0, 1fr) auto auto; grid-template-areas: "name n p" "bar bar bar"; }
  .rk-vs { display: none; }
  .rk.narrow { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "name n" "bar bar"; }
  .side-total b { font-size: 26px; }
  .side-total { text-align: left; }
  .tblctl .src { margin-left: 0; flex-basis: 100%; }
  .hide-sm { display: none; }
  .hint { display: block; }
  .tgl { align-items: flex-start; }
  .tgl > span:nth-child(2) { display: flex; flex-direction: column; }
  .chart { height: 230px; }
  .pagehead h2 { font-size: 23px; }
  th, td { padding-left: 8px; padding-right: 8px; }
}
@media (prefers-reduced-motion: reduce) { .cl, .chev, .grp:not(.open) tr.sub .cl > div { transition: none; } }

@media print {
  :root, :root[data-theme="dark"], :root:not([data-theme="light"]) {
    color-scheme: light; --bg: #fff; --panel: #fff; --soft: #f3eee6; --hover: #fff; --ink: #1d1b1a; --muted: #4d463e; --faint: #5f574d; --line: #d9d1c3; --line2: #b9ae9c;
    --accent: #4b4038; --accent-soft: #a89885; --track: #eee7db; --wa: #2e9e5b; --ig: #d4473f; --tt: #2f6db5; --em: #8a8178; --moved: #e3d8c6; --event: rgba(75, 64, 56, .08); --ok: #5f7448; --person: #cf7640; --quiet: #bdb5a9; --unknown: #6a5aa0; --alert: #a8431b; --alert-bg: #f9e4d4; --shadow: none;
  }
  @page { margin: 14mm 12mm; }
  body { font-size: 10.5pt; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .wrap { max-width: none; padding: 0; }

<script>

const CFG = {
  CSV_URL: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSDB8b_yapTLgeVDqHt77yBvh3SpkYObGBpYUH-9rCluDZnnYFzKPgTVXNHqRxac2ze5D_um6Mn4f6W/pub?gid=1264505486&single=true&output=csv',

  REFRESH_MINUTES: 5,          // Google refreshes a published CSV about every 5 minutes

  SAMPLE_VERSION: 'FAKE-DATA', // rows with this Flow Version are made-up test data
  COLUMNS: {

    details: ['Details', 'Detail', 'Concern', 'Concerns', 'Issue Details', 'ChatDetails', 'Bot Details'],

    version: ['Flow Version', 'Version', 'Bot Version'],
  },

  TOPICS: [
    { name: 'Order Status', also: ['order', 'orders', "where's my order", 'order tracking'] },
    { name: 'Sizing', also: ['size', 'shoe size', "what's my shoe size"] },
    { name: 'Return / Exchange', also: ['return', 'exchange', 'return or exchange', 'returns'] },
    { name: 'Complaint / Feedback', also: ['complaint', 'feedback', 'complaints & feedback'] },
    { name: 'Store Information', also: ['store', 'stores', 'store & hours', 'store and hours', 'store info'] },
    { name: 'Restock', also: ['restocks'] },

  DETAILS: [

    { label: 'Slim / narrow feet', topic: 'Sizing', also: ['slim feet', 'slim', 'narrow feet'] },
    { label: 'Bunions', topic: 'Sizing', also: ['bunion'] },
    { label: 'General size guide', topic: 'Sizing', also: ['general guide', 'size guide'] },
    { label: 'Sent online return link', topic: 'Return / Exchange', also: ['online self-service', 'online self service', 'online return'] },

    { label: 'Refund question', topic: 'Return / Exchange', also: ['refund type', 'refund'] },
    { label: 'Bought in store', topic: 'Return / Exchange', also: ['in-store purchase', 'in store purchase', 'in-store'] },
    { label: 'Damaged / wrong item', topic: 'Complaint / Feedback', also: ['defect', 'defect / issue', 'defect or issue', 'damaged'] },
    { label: 'Order found', topic: 'Order Status', also: ['found'] },
    { label: "Couldn't find their order", topic: 'Order Status', also: ['order not found', 'not found'] },
    { label: 'Order needs staff', topic: 'Order Status', also: ['needs staff'] },
    { label: 'Order check not working', topic: 'Order Status', also: ['order check error', 'lookup error', 'order lookup error'], systemError: true },
    { label: 'Pick-up open', topic: 'Pick-up Order', also: ['open', 'pickup open'] },
    { label: 'Pick-up closed right now', topic: 'Pick-up Order', also: ['pick-up closed', 'pickup closed', 'closed'] },
    { label: 'Pick-up check not working', topic: 'Pick-up Order', also: ['pick-up error', 'pickup error', 'pick-up check error'], systemError: true },

  OUTCOME_WORDS: {
    HUMAN: ['human', 'handed', 'handover', 'person', 'staff'],
    QUIET: ['stopped', 'quiet', 'safeclose', 'noreply', 'silent', 'didnt', 'didnot', 'notreply'],
    BOT: ['ended', 'completed', 'resolved', 'finished', 'selfservice'],
  },
  ALERT: { MIN_CHATS: 10, MIN_RISE: 5, MIN_RATIO: 1.5, MIN_DAY_OF_MONTH: 7, SHARE_POINTS: 5, MAX_LINES: 3 },
  MIN_ALERT_DAYS: 7,           // no "is up" alerts for ranges shorter than this
  // Daily Log part (all channels)
  DAILY_COLUMNS: {
    date: ['Date'], whatsapp: ['WhatsApp'], instagram: ['Instagram'], tiktok: ['TikTok'], email: ['Email'],
    total: ['Total Enquiries', 'Total'],
    bot: ['AI / FAQ Resolved', 'Bot or auto-reply only'],
    staff: ['Human / Actionable Cases', 'Answered by staff'],
    noreply: ['No Reply (Same Day)', 'No reply from us'],
    replytime: ['Staff Reply Time (Median Mins)', 'Staff Reply Time'],
  },
  MIN_STAFF_FOR_TIME: 5,       // a day needs this many staff-answered chats to count in the reply time
  MIN_COMPLETE_SHARE: 0.8,     // comparisons need at least this share of complete days in both periods
  NOREPLY_ALERT_POINTS: 3, NOREPLY_ALERT_DAYS: 14, DAILY_STALE_HOURS: 36, MISSING_LOG_MIN_WA: 10, WEEKDAY_MIN_EACH: 4, WEEKDAY_LEAD: 1.10,
  // Special days. A comparison that touches one names it and never raises an alert.
  EVENTS: [
    { name: 'the new WhatsApp bot going live', from: '2026-09-22', to: '2026-09-22' },
    { name: 'the Warehouse Sale', from: '2026-09-24', to: '2026-09-30' },
  ],
};
const DAY = 86400000;
const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const OUTCOME_LABEL = { BOT: 'Resolved by bot', HUMAN: 'Handed to staff', QUIET: 'Customer stopped replying', UNKNOWN: 'Ending unknown' };
const OTHER_CONCERN = 'Other concern';

const norm = s => String(s == null ? '' : s).toLowerCase().replace(/[^a-z0-9]/g, '');
const splitItems = s => String(s == null ? '' : s).split(/→|->|=>|>|\||;|,|\n/).map(x => x.trim()).filter(Boolean);
const uniq = a => a.filter((x, i) => a.indexOf(x) === i);

/** RFC-4180-style CSV to rows (quoted commas, "" escapes, CRLF). */
function parseCSV(text) {
  const rows = []; let row = []; let field = ''; let q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else q = false; }
      else field += c;
    } else if (c === '"') q = true;
    else if (c === ',') { row.push(field); field = ''; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && text[i + 1] === '\n') i++;
      row.push(field); rows.push(row); row = []; field = '';
    } else field += c;
  }
  if (field !== '' || row.length) { row.push(field); rows.push(row); }
  return rows.filter(r => r.some(v => v.trim() !== ''));
}

function findColumns(header) {
  const n = header.map(norm); const cols = {};
  Object.keys(CFG.COLUMNS).forEach(f => {
    for (const name of CFG.COLUMNS[f]) { const i = n.indexOf(norm(name)); if (i !== -1) { cols[f] = i; break; } }
  });
  const missing = CFG.REQUIRED.filter(f => cols[f] === undefined);
  if (missing.length) throw new Error('the data is missing column(s): ' + missing.map(f => CFG.COLUMNS[f][0]).join(', '));
  return cols;
}

function parseWhen(value, format) {
  const offsetMs = CFG.OFFSET_H * 3600000;
  if (value instanceof Date) return isNaN(value.getTime()) ? null : { ms: value.getTime(), hasSeconds: true };
  if (typeof value !== 'string') return null;
  const s = value.trim(); if (!s) return null;
  const TIME = '(?:[T\\s,]+(\\d{1,2}):(\\d{2})(?::(\\d{2}))?(?:\\.\\d+)?\\s*([ap]\\.?m\\.?)?)?';
  const ZONE = '\\s*(Z|(?:UTC|GMT)?\\s*[+-]\\d{2}:?\\d{2})?$';
  const zoneMin = z => { if (!z) return null; if (/^z$/i.test(z)) return 0; const t = z.replace(/UTC|GMT|\s|:/gi, ''); return (t[0] === '-' ? -1 : 1) * (Number(t.slice(1, 3)) * 60 + Number(t.slice(3, 5))); };
  function build(y, mo, d, hh, mi, se, ampm, zone) {
    y = +y; mo = +mo; d = +d; let h = hh === undefined ? 0 : +hh; const min = mi === undefined ? 0 : +mi; const sec = se === undefined ? 0 : +se;
    if (ampm) { if (h < 1 || h > 12) return null; h = (h % 12) + (/^p/i.test(ampm) ? 12 : 0); }
    if (mo < 1 || mo > 12 || d < 1 || d > 31 || h > 23 || min > 59 || sec > 59) return null;
    const w = Date.UTC(y, mo - 1, d, h, min, sec); const c = new Date(w);
    if (c.getUTCMonth() !== mo - 1 || c.getUTCDate() !== d) return null;
    return { ms: zone === null ? w - offsetMs : w - zone * 60000, hasSeconds: se !== undefined };
  }
  let m = new RegExp('^(\\d{4})-(\\d{1,2})-(\\d{1,2})' + TIME + ZONE, 'i').exec(s);
  if (m) return build(m[1], m[2], m[3], m[4], m[5], m[6], m[7], zoneMin(m[8]));
  m = new RegExp('^(\\d{1,2})[/.-](\\d{1,2})[/.-](\\d{4})' + TIME + ZONE, 'i').exec(s);
  if (m) {
    const zone = zoneMin(m[8]); const a = +m[1], b = +m[2]; let order;
    if (a > 12 && b <= 12) order = 'DMY'; else if (b > 12 && a <= 12) order = 'MDY';
    else if (format === 'DMY' || format === 'MDY') order = format; else if (a === b) order = 'DMY'; else return null;
    return order === 'DMY' ? build(m[3], b, a, m[4], m[5], m[6], m[7], zone) : build(m[3], a, b, m[4], m[5], m[6], m[7], zone);
  }
  const mon = w => { const i = ['jan', 'feb', 'mar', 'apr', 'may', 'jun', 'jul', 'aug', 'sep', 'oct', 'nov', 'dec'].indexOf(w.slice(0, 3).toLowerCase()); return i === -1 ? null : i + 1; };
  m = new RegExp('^(\\d{1,2})\\s+([A-Za-z]{3,9})\\.?,?\\s+(\\d{4})' + TIME + '$', 'i').exec(s);
  if (m && mon(m[2])) return build(m[3], mon(m[2]), m[1], m[4], m[5], m[6], m[7], null);
  m = new RegExp('^([A-Za-z]{3,9})\\.?\\s+(\\d{1,2}),?\\s+(\\d{4})' + TIME + '$', 'i').exec(s);
  if (m && mon(m[1])) return build(m[3], mon(m[1]), m[2], m[4], m[5], m[6], m[7], null);
  return null;
}

const wall = ms => { const d = new Date(ms + CFG.OFFSET_H * 3600000); return { y: d.getUTCFullYear(), m: d.getUTCMonth(), d: d.getUTCDate(), h: d.getUTCHours(), mi: d.getUTCMinutes(), dow: d.getUTCDay() }; };
const fromWall = (y, m, d, h, mi) => Date.UTC(y, m, d, h || 0, mi || 0) - CFG.OFFSET_H * 3600000;
const dayStart = ms => { const w = wall(ms); return fromWall(w.y, w.m, w.d); };
/** "2026-09-15" (Malaysia day) to its start instant; strict, never new Date(string). */
function isoDay(s) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s || '').trim());
  if (!m) return null;
  const y = +m[1], mo = +m[2], d = +m[3]; const t = new Date(Date.UTC(y, mo - 1, d));
  if (t.getUTCMonth() !== mo - 1 || t.getUTCDate() !== d) return null;
  return fromWall(y, mo - 1, d);
}
const toIso = ms => { const w = wall(ms); return w.y + '-' + String(w.m + 1).padStart(2, '0') + '-' + String(w.d).padStart(2, '0'); };
/** "15–19 Sep 2026", "28 Aug – 3 Sep 2026", "28 Dec 2025 – 3 Jan 2026" for [start, end). */
function rangeText(start, end, withYear) {
  if (end <= start) return 'no days';
  const a = wall(start), b = wall(end - 1); const mn = w => MONTHS[w.m].slice(0, 3); const yr = withYear === false ? '' : ' ' + b.y;
  if (a.y === b.y && a.m === b.m) return (a.d === b.d ? a.d : a.d + '–' + b.d) + ' ' + mn(b) + yr;
  if (a.y === b.y) return a.d + ' ' + mn(a) + ' – ' + b.d + ' ' + mn(b) + yr;
  return a.d + ' ' + mn(a) + ' ' + a.y + ' – ' + b.d + ' ' + mn(b) + ' ' + b.y;
}
const dayText = ms => { const w = wall(ms); return w.d + ' ' + MONTHS[w.m].slice(0, 3); };

let TOPIC_IDX = null, DETAIL_IDX = null;
/** Known topics only; anything else counts as "Other" (this page is public). */
function topicName(raw) {
  if (!TOPIC_IDX) { TOPIC_IDX = {}; CFG.TOPICS.forEach(t => [t.name].concat(t.also).forEach(a => { TOPIC_IDX[norm(a)] = t.name; })); }
  const n = norm(raw); if (!n) return null;
  return TOPIC_IDX[n] || 'Other';
}
/** Known detail words only; anything else becomes "Other concern". Known words carry the topic they belong to. */
function concernOf(raw) {
  if (!DETAIL_IDX) { DETAIL_IDX = {}; CFG.DETAILS.forEach(d => [d.label].concat(d.also).forEach(a => { DETAIL_IDX[norm(a)] = d; })); }
  const n = norm(raw); if (!n) return null;
  const d = DETAIL_IDX[n];
  return d ? { label: d.label, topic: d.topic || null, systemError: !!d.systemError } : { label: OTHER_CONCERN, topic: null, systemError: false };
}
function outcomeOf(raw) {
  const n = norm(raw); if (!n) return 'UNKNOWN';
  for (const k of ['HUMAN', 'QUIET', 'BOT']) if (CFG.OUTCOME_WORDS[k].some(w => n.includes(w))) return k;
  return 'UNKNOWN';
}
const topicOrder = name => { const i = CFG.TOPICS.findIndex(t => t.name === name); return i === -1 ? 999 : i; };

/** Rows (with header) to bot chats. Test rows, repeats and unreadable dates are counted, not used. */
function readChats(values) {
  const stats = { rows: 0, test: 0, unreadable: 0, duplicates: 0, sample: 0 };
  const chats = []; const firstSeenTopic = {}; const firstSeenConcern = {}; const firstSubMs = {}; let logStartMs = null, newestMs = null;
  if (!values.length) return { chats, stats, firstSeenTopic, firstSeenConcern, firstSubMs, logStartMs, newestMs };
  const cols = findColumns(values[0]);
  const cell = (row, f) => (cols[f] === undefined ? '' : (row[cols[f]] == null ? '' : row[cols[f]]));
  let prevKey = null;
  for (let i = 1; i < values.length; i++) {
    const row = values[i];
    if (['when', 'topics', 'details', 'outcome'].every(f => String(cell(row, f)).trim() === '')) continue;
    stats.rows++;
    if (String(cell(row, 'test')).trim() !== '') { stats.test++; prevKey = null; continue; }
    const when = parseWhen(String(cell(row, 'when')), CFG.DATE_FORMAT);
    const key = JSON.stringify(row.map(v => String(v).trim()));
    if (key === prevKey && when && when.hasSeconds) { stats.duplicates++; continue; }
    prevKey = key;
    if (!when) { stats.unreadable++; continue; }
    const ordered = splitItems(cell(row, 'topics')).map(topicName).filter(Boolean);
    const topics = uniq(ordered);
    const cOrdered = splitItems(cell(row, 'details')).map(concernOf).filter(Boolean);
    const concerns = cOrdered.filter((c, j) => cOrdered.findIndex(x => x.label === c.label) === j);
    const subs = concerns.filter(c => c.topic);          // details that belong to a topic = sub-topics
    const ch = String(cell(row, 'channel')).trim();
    const chat = {
      ms: when.ms, topics, lastTopic: ordered.length ? ordered[ordered.length - 1] : null,
      concerns, subs, lastConcern: cOrdered.length ? cOrdered[cOrdered.length - 1].label : null,
      outcome: outcomeOf(cell(row, 'outcome')),
      channel: !ch || /^wh?at?s?app$/i.test(ch.replace(/\s/g, '')) ? 'WhatsApp' : ch,
      version: String(cell(row, 'version')).trim(),
    };
    // a sub-topic list in visit order, so the last one can be found (cOrdered keeps repeats out already via concerns)
    chat.subOrder = cOrdered.filter(c => c.topic);
    if (chat.version === CFG.SAMPLE_VERSION) stats.sample++;
    chats.push(chat);
    if (logStartMs === null || chat.ms < logStartMs) logStartMs = chat.ms;
    if (newestMs === null || chat.ms > newestMs) newestMs = chat.ms;
    topics.forEach(t => { if (!(t in firstSeenTopic) || chat.ms < firstSeenTopic[t]) firstSeenTopic[t] = chat.ms; });
    concerns.forEach(c => { if (!(c.label in firstSeenConcern) || chat.ms < firstSeenConcern[c.label]) firstSeenConcern[c.label] = chat.ms; });
    subs.forEach(c => { if (!(c.topic in firstSubMs) || chat.ms < firstSubMs[c.topic]) firstSubMs[c.topic] = chat.ms; });
  }
  chats.sort((a, b) => a.ms - b.ms);
  return { chats, stats, firstSeenTopic, firstSeenConcern, firstSubMs, logStartMs, newestMs };
}

function countRange(chats, r) {
  const o = { chats: 0, BOT: 0, HUMAN: 0, QUIET: 0, UNKNOWN: 0, quietNoAnswer: 0, noTopic: 0, noTopicHuman: 0, sample: 0, topics: {}, topicHuman: {}, concerns: {}, concernHuman: {}, systemErrors: {}, channels: {} };
  chats.forEach(c => {
    if (c.ms < r.start || c.ms >= r.end) return;
    o.chats++; o[c.outcome]++; const human = c.outcome === 'HUMAN';
    if (c.version === CFG.SAMPLE_VERSION) o.sample++;
    if (!c.topics.length) { o.noTopic++; if (human) o.noTopicHuman++; if (c.outcome === 'QUIET') o.quietNoAnswer++; }
    c.topics.forEach(t => { o.topics[t] = (o.topics[t] || 0) + 1; });
    if (human && c.lastTopic) o.topicHuman[c.lastTopic] = (o.topicHuman[c.lastTopic] || 0) + 1;
    c.concerns.forEach(k => { o.concerns[k.label] = (o.concerns[k.label] || 0) + 1; if (k.systemError) o.systemErrors[k.label] = (o.systemErrors[k.label] || 0) + 1; });
    if (human && c.lastConcern) o.concernHuman[c.lastConcern] = (o.concernHuman[c.lastConcern] || 0) + 1;
    o.channels[c.channel] = (o.channels[c.channel] || 0) + 1;
  });
  return o;
}

/** Outcome per topic (rule B2): "resolved by bot" = the chat ended resolved by bot and included the topic;
    "handed" and "stopped" = only the chat's LAST topic; every other topic in those chats "moved on". */
function topicOutcomes(chats, r) {
  const res = {};
  chats.forEach(c => {
    if (c.ms < r.start || c.ms >= r.end) return;
    c.topics.forEach(t => {
      const o = res[t] || (res[t] = { chats: 0, resolved: 0, handed: 0, stopped: 0, moved: 0, other: 0 });
      o.chats++;
      if (c.outcome === 'BOT') o.resolved++;
      else if (t !== c.lastTopic) o.moved++;
      else if (c.outcome === 'HUMAN') o.handed++;
      else if (c.outcome === 'QUIET') o.stopped++;
      else o.other++;
    });
  });
  return res;
}

/** Sub-topics per topic (rules B3, B4). A topic's sub-topic base only counts chats from the day its sub-topics were first recorded. */
function subTable(read, r) {
  const out = {}; let unrec = 0;
  read.chats.forEach(c => {
    if (c.ms < r.start || c.ms >= r.end) return;
    c.subs.forEach(s => { if (c.topics.indexOf(s.topic) === -1) unrec++; });
    c.topics.forEach(t => {
      if (!(t in read.firstSubMs) || c.ms < dayStart(read.firstSubMs[t])) return;
      const o = out[t] || (out[t] = { base: 0, since: dayStart(read.firstSubMs[t]), subs: {}, handed: {}, noSub: 0, noSubHanded: 0 });
      o.base++;
      const mine = uniq(c.subs.filter(s => s.topic === t).map(s => s.label));
      if (!mine.length) o.noSub++; else mine.forEach(l => { o.subs[l] = (o.subs[l] || 0) + 1; });
    });
    if (c.outcome === 'HUMAN' && c.lastTopic && c.lastTopic in read.firstSubMs && c.ms >= dayStart(read.firstSubMs[c.lastTopic])) {
      const o = out[c.lastTopic]; if (o) {
        const mine = c.subOrder.filter(s => s.topic === c.lastTopic);
        if (mine.length) { const l = mine[mine.length - 1].label; o.handed[l] = (o.handed[l] || 0) + 1; } else o.noSubHanded++;
      }
    }
  });
  return { tables: out, unrecognised: unrec };
}

/** Period keys: this | last | d7 | d30 | m:YYYY-MM | r:YYYY-MM-DD:YYYY-MM-DD (both days included). */
function periodFor(key, nowMs, logStartMs) {
  const w = wall(nowMs);
  const monthStart = fromWall(w.y, w.m, 1), prevStart = fromWall(w.y, w.m - 1, 1), todayStart = fromWall(w.y, w.m, w.d);
  const p = { key, todayStart, today: { start: todayStart, end: todayStart + DAY }, last7: { start: todayStart - 6 * DAY, end: todayStart + DAY }, notes: [] };
  const monthName = ms => { const x = wall(ms); return MONTHS[x.m] + ' ' + x.y; };
  /** Same number of days just before; if the range runs into today, stop at the same time of day. */
  const before = (start, end) => {
    const len = end - start; const cs = start - len;
    const ce = end > nowMs ? Math.min(cs + (nowMs - start), start) : start;
    return { start: cs, end: ce };
  };
  if (key === 'last' || key.startsWith('m:')) {
    let start;
    if (key === 'last') start = prevStart;
    else { const mm = /^m:(\d{4})-(\d{2})$/.exec(key); start = mm ? fromWall(+mm[1], +mm[2] - 1, 1) : prevStart; }
    const sw = wall(start); const cs = fromWall(sw.y, sw.m - 1, 1);
    p.main = { start, end: fromWall(sw.y, sw.m + 1, 1) };
    p.compare = { start: cs, end: start };
    p.title = monthName(start);
    p.compareText = monthName(cs);
  } else if (key === 'd7' || key === 'd30') {
    const n = key === 'd7' ? 7 : 30; const start = todayStart - (n - 1) * DAY;
    p.main = { start, end: todayStart + DAY };
    p.compare = before(start, todayStart + DAY);
    p.title = 'Last ' + n + ' days · ' + rangeText(start, todayStart + DAY);
    p.compareText = rangeText(p.compare.start, p.compare.end, false);
  } else if (key.startsWith('r:')) {
    const parts = key.slice(2).split(':');
    let a = isoDay(parts[0]), b = isoDay(parts[1]);
    if (a === null || b === null) return periodFor('this', nowMs, logStartMs);
    if (b < a) { const t = a; a = b; b = t; p.notes.push('The dates were the wrong way round, so they were swapped.'); }
    if (b > todayStart) { b = todayStart; p.notes.push('The range stops at today.'); }
    if (a > b) a = b;
    if ((b - a) / DAY + 1 > CFG.MAX_RANGE_DAYS) { a = b - (CFG.MAX_RANGE_DAYS - 1) * DAY; p.notes.push('Ranges are limited to ' + CFG.MAX_RANGE_DAYS + ' days.'); }
    if (logStartMs !== null && b + DAY <= dayStart(logStartMs)) p.notes.push('There are no numbers before ' + rangeText(dayStart(logStartMs), dayStart(logStartMs) + DAY) + '.');
    p.main = { start: a, end: b + DAY };
    p.compare = before(a, b + DAY);
    const days = Math.round((b + DAY - a) / DAY);
    p.title = rangeText(a, b + DAY) + ' (' + days + ' day' + (days === 1 ? '' : 's') + ')';
    p.compareText = rangeText(p.compare.start, p.compare.end, false);
  } else {
    const end = Math.min(prevStart + (nowMs - monthStart), monthStart);
    p.main = { start: monthStart, end: fromWall(w.y, w.m + 1, 1) };
    p.compare = { start: prevStart, end };
    p.title = 'This month · ' + rangeText(monthStart, todayStart + DAY);
    p.compareText = rangeText(prevStart, Math.max(end, prevStart + 1), false);
    p.isThisMonth = true;
  }
  p.days = Math.max(1, Math.round((Math.min(p.main.end, todayStart + DAY) - p.main.start) / DAY));
  return p;
}

function diffText(diff) { return diff > 0 ? { t: '▲ ' + diff + ' more', c: 'up' } : diff < 0 ? { t: '▼ ' + (-diff) + ' fewer', c: 'down' } : { t: 'same', c: '' }; }

/** Names of the special days (CFG.EVENTS) that overlap [start, end). */
function eventsTouching(start, end) {
  return CFG.EVENTS.filter(e => { const a = isoDay(e.from), b = isoDay(e.to); return a !== null && b !== null && a < end && b + DAY > start; }).map(e => e.name);
}

/** Everything the bot part shows, for one period. */
function summarize(read, nowMs, key) {
  const p = periodFor(key, nowMs, read.logStartMs);
  const main = countRange(read.chats, p.main), compare = countRange(read.chats, p.compare), today = countRange(read.chats, p.today);
  const canCompare = read.logStartMs !== null && read.logStartMs < p.compare.start && p.compare.end > p.compare.start;
  const events = uniq(eventsTouching(p.main.start, Math.min(p.main.end, p.today.end)).concat(canCompare ? eventsTouching(p.compare.start, p.compare.end) : []));
  const topicRows = Object.keys(main.topics).map(name => {
    const c = compare.topics[name] || 0; const isNew = canCompare && read.firstSeenTopic[name] >= p.compare.start;
    return { name, chats: main.topics[name], human: main.topicHuman[name] || 0, compare: c, isNew, vs: !canCompare ? { t: '–', c: '' } : isNew ? { t: 'new', c: 'new' } : diffText(main.topics[name] - c) };
  }).sort((a, b) => b.chats - a.chats || topicOrder(a.name) - topicOrder(b.name) || a.name.localeCompare(b.name));
  const concernRows = Object.keys(main.concerns).map(label => ({ label, chats: main.concerns[label], human: main.concernHuman[label] || 0 }))
    .sort((a, b) => (a.label === OTHER_CONCERN) - (b.label === OTHER_CONCERN) || b.chats - a.chats || a.label.localeCompare(b.label)).slice(0, 10);

  // outcome per topic, sub-topics, and the two "most chosen" lists
  const res = topicOutcomes(read.chats, p.main);
  const sub = subTable(read, p.main);
  const byCount = k => Object.keys(res).filter(t => res[t][k] > 0).sort((a, b) => res[b][k] - res[a][k] || topicOrder(a) - topicOrder(b)).slice(0, 5).map(t => ({ name: t, n: res[t][k], of: res[t].chats }));
  const lists = { resolved: byCount('resolved'), handed: byCount('handed') };

  // chats per month for the bot part (whole log)
  const months = []; const nw = wall(nowMs);
  for (let i = 5; i >= 0; i--) {
    const start = fromWall(nw.y, nw.m - i, 1); const sw = wall(start); const end = fromWall(sw.y, sw.m + 1, 1);
    if (read.logStartMs === null || end <= dayStart(read.logStartMs)) continue;
    const r = countRange(read.chats, { start, end });
    months.push({ label: MONTHS[sw.m] + ' ' + sw.y + (i === 0 ? ' (so far)' : ''), chats: r.chats, BOT: r.BOT, HUMAN: r.HUMAN, QUIET: r.QUIET });
  }

  // busiest time (bot chats; and chats handed to staff)
  const inRange = read.chats.filter(c => c.ms >= p.main.start && c.ms < p.main.end);
  const peak = (list, min) => { if (list.length < min) return null; const byHour = new Array(24).fill(0); list.forEach(c => { byHour[wall(c.ms).h]++; }); return byHour.reduce((best, n, h) => (n > byHour[best] ? h : best), 0); };
  const busiestHour = peak(inRange, CFG.BUSIEST_MIN_CHATS);
  const busiestHandedHour = peak(inRange.filter(c => c.outcome === 'HUMAN'), CFG.BUSIEST_HANDED_MIN);

  // things to check
  const A = CFG.ALERT; const alerts = [];
  const sys = countRange(read.chats, p.last7).systemErrors;
  Object.keys(sys).sort().forEach(l => alerts.push({ level: 'high', text: l + ': seen ' + sys[l] + ' time' + (sys[l] === 1 ? '' : 's') + ' in the last 7 days. Please tell ' + CFG.ADMIN_NAME + '.' }));
  const longEnough = p.days >= CFG.MIN_ALERT_DAYS && (!p.isThisMonth || wall(nowMs).d >= A.MIN_DAY_OF_MONTH);
  if (canCompare && longEnough && !events.length) {
    const rises = (n, b) => n >= A.MIN_CHATS && n - b >= A.MIN_RISE && n >= A.MIN_RATIO * b;
    topicRows.forEach(r => { if (!r.isNew && rises(r.chats, r.compare)) alerts.push({ level: 'mid', text: r.name + ' is up: ' + r.chats + ' bot chats, compared with ' + r.compare + ' in ' + p.compareText + '.' }); });
    Object.keys(main.concerns).forEach(l => { if (l === OTHER_CONCERN) return; const n = main.concerns[l], b = compare.concerns[l] || 0; if (read.firstSeenConcern[l] >= p.compare.start) return; if (rises(n, b)) alerts.push({ level: 'mid', text: 'More customers with "' + l + '": ' + n + ', compared with ' + b + ' in ' + p.compareText + '.' }); });
    const share = (n, t) => (t ? 100 * n / t : 0);
    const shareRise = (n, b) => compare.chats > 0 && main.chats > 0 && share(n, main.chats) - share(b, compare.chats) >= A.SHARE_POINTS && n - b >= A.MIN_RISE;
    if (shareRise(main.topics.Other || 0, compare.topics.Other || 0)) alerts.push({ level: 'mid', text: 'More bot chats are "Other" than before. The menu may be missing something.' });
    if (shareRise(main.noTopic, compare.noTopic)) alerts.push({ level: 'mid', text: 'More customers leave before picking a topic than before.' });
  }
  return { p, main, compare, today, canCompare, events, topicRows, concernRows, res, sub, lists, months, busiestHour, busiestHandedHour, alerts: alerts.slice(0, A.MAX_LINES) };
}

// ------------------------------------------------------------------ Daily Log (all channels)
/** Daily Log rows (title lines above the header are fine) to days. Blank = unknown, never zero. */
function readDaily(values) {
  const hi = values.findIndex(r => norm(r[0]) === 'date');
  if (hi === -1) throw new Error('the Daily Log has no "Date" heading row.');
  const n = values[hi].map(norm); const cols = {};
  Object.keys(CFG.DAILY_COLUMNS).forEach(f => { for (const name of CFG.DAILY_COLUMNS[f]) { const i = n.indexOf(norm(name)); if (i !== -1) { cols[f] = i; break; } } });
  const missing = ['date', 'whatsapp', 'instagram', 'tiktok'].filter(f => cols[f] === undefined);
  if (missing.length) throw new Error('the Daily Log is missing column(s): ' + missing.map(f => CFG.DAILY_COLUMNS[f][0]).join(', ') + '.');
  const num = v => { const s = String(v == null ? '' : v).trim(); if (s === '' || s === '-') return null; const x = Number(s.replace(/,/g, '')); return isFinite(x) && x >= 0 ? Math.round(x) : null; };
  const get = (row, f) => (cols[f] === undefined ? null : num(row[cols[f]]));
  const byDate = {}; let unreadable = 0;
  values.slice(hi + 1).forEach(row => {
    const raw = String(row[cols.date] == null ? '' : row[cols.date]).trim(); if (!raw) return;
    const ms = isoDay(raw); if (ms === null) { unreadable++; return; }
    const wa = get(row, 'whatsapp') || 0, ig = get(row, 'instagram') || 0, tt = get(row, 'tiktok') || 0, em = get(row, 'email') || 0;
    const ch = wa + ig + tt + em; const total = get(row, 'total'); const bot = get(row, 'bot'), staff = get(row, 'staff'), none = get(row, 'noreply');
    const complete = bot !== null && staff !== null && none !== null && bot + staff + none === ch;
    byDate[raw] = { date: raw, ms, wa, ig, tt, em, ch, total: total === null ? ch : total, bot, staff, none, med: get(row, 'replytime'), complete };
  });
  const days = Object.keys(byDate).map(k => byDate[k]).sort((a, b) => a.ms - b.ms);
  return { days, unreadable, firstMs: days.length ? days[0].ms : null, lastMs: days.length ? days[days.length - 1].ms : null };
}

/** Value at position p (0 to 1) of sorted numbers, the "exclusive" way (median for p = 0.5). */
function percentile(xs, p) {
  const n = xs.length; if (!n) return null;
  const pos = p * (n + 1); const j = Math.floor(pos); const d = pos - j;
  if (j < 1) return xs[0]; if (j >= n) return xs[n - 1];
  return xs[j - 1] + d * (xs[j] - xs[j - 1]);
}

/** Totals for a list of days. Volume uses every day; who-answered and reply time use complete days only (rule A2, A3). */
function aggDaily(list) {
  const o = { days: list.length, enq: 0, wa: 0, ig: 0, tt: 0, em: 0, completeDays: 0, incomplete: [], bot: 0, staff: 0, none: 0, meds: [] };
  list.forEach(d => {
    o.enq += d.total; o.wa += d.wa; o.ig += d.ig; o.tt += d.tt; o.em += d.em;
    if (!d.complete) { o.incomplete.push(d); return; }
    o.completeDays++; o.bot += d.bot; o.staff += d.staff; o.none += d.none;
    if (d.med !== null && d.staff >= CFG.MIN_STAFF_FOR_TIME) o.meds.push(d.med);
  });
  o.who = o.bot + o.staff + o.none;
  o.perDay = o.days ? o.enq / o.days : null;
  const s = o.meds.slice().sort((a, b) => a - b);
  o.reply = s.length ? { n: s.length, mid: Math.round(percentile(s, 0.5)), lo: Math.round(percentile(s, 0.25)), hi: Math.round(percentile(s, 0.75)) } : null;
  return o;
}

/** Everything Part A shows, for one period. */
function summarizeA(rd, nowMs, key, logStartMs) {
  const p = periodFor(key, nowMs, logStartMs);
  const lastEnd = rd.days.length ? rd.lastMs + DAY : 0;
  const mainEnd = Math.min(p.main.end, lastEnd);
  const inR = (s, e) => rd.days.filter(d => d.ms >= s && d.ms < e);
  const mainList = inR(p.main.start, mainEnd), cmpList = inR(p.compare.start, p.compare.end);
  const cmpExpected = Math.ceil((p.compare.end - p.compare.start) / DAY - 1e-9);
  const main = aggDaily(mainList), cmp = aggDaily(cmpList);
  const covered = rd.days.length > 0 && cmpExpected > 0 && mainList.length > 0 && p.compare.start >= rd.firstMs && cmpList.length === cmpExpected;
  const shareOk = covered && main.completeDays >= CFG.MIN_COMPLETE_SHARE * main.days && cmp.completeDays >= CFG.MIN_COMPLETE_SHARE * cmp.days;
  const events = uniq(eventsTouching(p.main.start, mainEnd).concat(covered ? eventsTouching(p.compare.start, p.compare.end) : []));

  // busiest / quietest weekday: the middle value per weekday, only with enough of each weekday (rule A5)
  let weekday = null;
  const per = [[], [], [], [], [], [], []]; mainList.forEach(d => per[wall(d.ms).dow].push(d.total));
  if (per.every(a => a.length >= CFG.WEEKDAY_MIN_EACH)) {
    const mid = per.map(a => percentile(a.slice().sort((x, y) => x - y), 0.5));
    const order = [1, 2, 3, 4, 5, 6, 0].sort((a, b) => mid[b] - mid[a]);
    const top = order[0], second = order[1], low = order[6];
    const lowGroup = order.filter(d => mid[d] <= mid[low] * 1.05);            // the quietest day(s), ties included
    const outside = order.filter(d => lowGroup.indexOf(d) === -1);            // everything else, busiest first
    const nextUp = outside.length ? outside[outside.length - 1] : null;       // the quietest day that is NOT in the group
    weekday = {
      busiest: mid[top] >= CFG.WEEKDAY_LEAD * mid[second] ? { day: DAYS[top], n: Math.round(mid[top]) } : null,
      quietest: nextUp !== null && mid[nextUp] >= CFG.WEEKDAY_LEAD * mid[low] && lowGroup.length <= 2 ? { days: lowGroup.slice().sort((a, b) => ((a + 6) % 7) - ((b + 6) % 7)).map(d => DAYS[d]), n: Math.round(mid[low]) } : null,
      mid,
    };
  }

  // chart: enquiries per day (per week for long periods); days inside a special event are marked
  const span = Math.max(0, mainEnd - p.main.start); const unit = span <= 62 * DAY ? 'day' : 'week';
  const buckets = [];
  if (unit === 'day') for (let t = p.main.start; t < mainEnd; t += DAY) { const d = mainList.find(x => x.ms === t); buckets.push({ start: t, end: t + DAY, label: dayText(t), total: d ? d.total : 0, missing: !d }); }
  else for (let t = p.main.start; t < mainEnd; t += 7 * DAY) { const e = Math.min(t + 7 * DAY, mainEnd); buckets.push({ start: t, end: e, label: dayText(t), partial: e - t < 7 * DAY, total: mainList.filter(d => d.ms >= t && d.ms < e).reduce((a, d) => a + d.total, 0) }); }
  buckets.forEach(b => { b.event = eventsTouching(b.start, b.end).length > 0; });

  // months (whole log)
  const months = []; const nw = wall(nowMs);
  for (let i = 5; i >= 0; i--) {
    const start = fromWall(nw.y, nw.m - i, 1); const sw = wall(start); const end = fromWall(sw.y, sw.m + 1, 1);
    const list = inR(start, end); if (!list.length) continue;
    months.push(Object.assign({ label: MONTHS[sw.m] + ' ' + sw.y + (lastEnd < end ? ' (so far)' : '') }, aggDaily(list)));
  }

  // things to check
  const alerts = [];
  if (rd.days.length && nowMs - lastEnd > CFG.DAILY_STALE_HOURS * 3600000) alerts.push({ level: 'high', text: 'The Daily Log has not been filled since ' + dayText(rd.lastMs) + '. Please tell ' + CFG.ADMIN_NAME + '.' });
  if (shareOk && mainList.length >= CFG.NOREPLY_ALERT_DAYS && !events.length && main.who && cmp.who) {
    const a = 100 * main.none / main.who, b = 100 * cmp.none / cmp.who;
    if (a - b >= CFG.NOREPLY_ALERT_POINTS) alerts.push({ level: 'mid', text: 'No reply from us is up: ' + Math.round(a) + '% of enquiries, compared with ' + Math.round(b) + '% in ' + p.compareText + '.' });
  }

  // the morning line
  let morning = null;
  if (rd.days.length) {
    const last = rd.days[rd.days.length - 1]; const yes = toIso(nowMs - DAY) === last.date;
    morning = (yes ? 'Yesterday (' : 'Latest day in the Daily Log (') + dayText(last.ms) + '): ' + last.total + ' enquiries' + (last.none === null ? '.' : ', ' + last.none + ' with no reply from us.');
  }
  return { p, main, cmp, covered, shareOk, events, weekday, buckets, unit, months, alerts, morning, mainList, lastMs: rd.lastMs, mainEnd };
}

/** Days with 10+ WhatsApp enquiries in the Daily Log but no bot chats in the Tracker (rule B7). */
function botLogGaps(rd, read, p) {
  if (!rd || !read || read.logStartMs === null) return [];
  const per = {}; read.chats.forEach(c => { const k = dayStart(c.ms); per[k] = (per[k] || 0) + 1; });
  const start = dayStart(read.logStartMs);
  return rd.days.filter(d => d.ms >= p.main.start && d.ms < p.main.end && d.ms >= start && d.wa >= CFG.MISSING_LOG_MIN_WA && !per[d.ms]).map(d => d.ms);
}
/* ==================================================================== LOGIC-END */

// ============================================================ page (look and layout only; every number comes from the logic block above)
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const num = n => Number(n).toLocaleString('en-US');
const share = (n, t) => (!t ? '–' : t < CFG.SMALL_TOTAL ? String(n) : Math.round(100 * n / t) + '%');
const pct = (n, t) => (!t ? '–' : Math.round(100 * n / t) + '%');
/** One number style everywhere: "154 (28%)". Under SMALL_TOTAL the percentage is left out. */
const np = (n, t) => (!t || t < CFG.SMALL_TOTAL ? num(n) : num(n) + ' <span class="pc">(' + Math.round(100 * n / t) + '%)</span>');
const npText = (n, t) => (!t || t < CFG.SMALL_TOTAL ? num(n) : num(n) + ' (' + Math.round(100 * n / t) + '%)');
const hourText = h => { const f = x => { x %= 24; return x === 0 ? '12 am' : x < 12 ? x + ' am' : x === 12 ? '12 pm' : (x - 12) + ' pm'; }; return f(h) + ' to ' + f(h + 1); };
const hourShort = h => { const p = x => { x = ((x % 24) + 24) % 24; return { n: x % 12 || 12, ap: x < 12 ? 'am' : 'pm' }; }; const a = p(h), b = p(h + 1); return a.ap === b.ap ? a.n + '–' + b.n + ' ' + a.ap : a.n + ' ' + a.ap + '–' + b.n + ' ' + b.ap; };
const clock = ms => { const w = wall(ms); return (w.h % 12 || 12) + ':' + String(w.mi).padStart(2, '0') + (w.h < 12 ? ' am' : ' pm'); };
const joinAnd = a => a.length < 2 ? a.join('') : a.slice(0, -1).join(', ') + ' and ' + a[a.length - 1];
const store = (k, v) => { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } };
const monthLabel = l => String(l).replace(/ \(so far\)$/, '');

/* The two sources, named the same way everywhere on the page. */

let READ_A = null, READ_B = null, TEXT_A = null, TEXT_B = null, ERR_A = null, ERR_B = null, FETCHED_AT = null, LOADING = false, CHARTS = [], RENDER_DAY = null, KEY = null;

async function fetchCsv(url) {
  const ctrl = new AbortController(); const timer = setTimeout(() => ctrl.abort(), CFG.FETCH_TIMEOUT_S * 1000);
  try {
    const res = await fetch(url + (url.includes('?') ? '&' : '?') + 't=' + Date.now(), { cache: 'no-store', signal: ctrl.signal });
    if (!res.ok) throw new Error('the data link answered ' + res.status + '.');
    const text = await res.text();
    if (/^\s*</.test(text)) throw new Error('the data link returned a web page, not data. Is the sheet still published to the web?');
    return text;
  } catch (e) { throw new Error(e.name === 'AbortError' ? 'the data link took too long to answer.' : e.message); }
  finally { clearTimeout(timer); }
}

async function load(manual) {
  if (LOADING) return; LOADING = true; $('#refresh').disabled = true;
  try {
    const [a, b] = await Promise.allSettled([fetchCsv(CFG.DAILY_CSV_URL), fetchCsv(CFG.CSV_URL)]);
    let changed = false;
    if (a.status === 'fulfilled') { if (a.value !== TEXT_A) { try { READ_A = readDaily(parseCSV(a.value)); TEXT_A = a.value; ERR_A = null; changed = true; } catch (e) { ERR_A = e.message; } } else ERR_A = null; }
    else ERR_A = a.reason.message;
    if (b.status === 'fulfilled') { if (b.value !== TEXT_B) { try { READ_B = readChats(parseCSV(b.value)); TEXT_B = b.value; ERR_B = null; changed = true; } catch (e) { ERR_B = e.message; } } else ERR_B = null; }
    else ERR_B = b.reason.message;
    FETCHED_AT = Date.now();
    const newDay = RENDER_DAY !== toIso(Date.now());
    if (changed || newDay || !RENDERED) { fillPeriods(); render(!manual && CHARTS.length > 0); RENDERED = true; }
    else { renderMeta(); renderNotices(); }
  } finally { LOADING = false; $('#refresh').disabled = false; }
}
let RENDERED = false;

const firstMs = () => { const v = [READ_A && READ_A.firstMs, READ_B && READ_B.logStartMs].filter(x => x !== null && x !== undefined); return v.length ? Math.min.apply(null, v) : null; };

function fillPeriods() {
  const sel = $('#period'); const start = firstMs();
  const nw = wall(Date.now()); const opts = [['this', 'This month'], ['last', 'Last month'], ['d7', 'Last 7 days'], ['d30', 'Last 30 days']];
  const months = [];
  if (start !== null) {
    const s = wall(start); let y = s.y, m = s.m;
    while (y < nw.y || (y === nw.y && m < nw.m)) { months.push(['m:' + y + '-' + String(m + 1).padStart(2, '0'), MONTHS[m] + ' ' + y]); m++; if (m > 11) { m = 0; y++; } }
  }
  months.reverse();
  sel.innerHTML = opts.map(([v, t]) => '<option value="' + v + '">' + esc(t) + '</option>').join('') +
    (months.length ? '<optgroup label="Past months">' + months.map(([v, t]) => '<option value="' + v + '">' + esc(t) + '</option>').join('') + '</optgroup>' : '') +
    '<option value="custom">Custom dates</option>';
  const today = toIso(Date.now());
  $('#from').max = today; $('#to').max = today;
  if (start !== null) { $('#from').min = toIso(start); $('#to').min = toIso(start); }
  if (!KEY) KEY = startKey();
  sel.value = KEY.startsWith('r:') ? 'custom' : (opts.concat(months).some(o => o[0] === KEY) ? KEY : 'this');
  if (sel.value === 'this' && KEY !== 'this' && !KEY.startsWith('r:')) KEY = 'this';
}

/** ?from=YYYY-MM-DD&to=YYYY-MM-DD wins, then the last choice, then "This month". */
function startKey() {
  const q = new URLSearchParams(location.search); const f = q.get('from'), t = q.get('to');
  if (isoDay(f) !== null && isoDay(t) !== null) return 'r:' + f + ':' + t;
  const saved = store('period');
  if (saved && saved !== 'this' && /^(last|d7|d30|m:\d{4}-\d{2}|r:\d{4}-\d{2}-\d{2}:\d{4}-\d{2}-\d{2})$/.test(saved)) return saved;
  // Nothing picked yet. On the first days of a month there is no data for "This month", so open on last month until some arrives.
  const w = wall(Date.now()); const monthStart = fromWall(w.y, w.m, 1);
  const hasThisMonth = (READ_A && READ_A.lastMs !== null && READ_A.lastMs >= monthStart) || (READ_B && READ_B.newestMs !== null && READ_B.newestMs >= monthStart);
  return hasThisMonth || (!READ_A && !READ_B) ? 'this' : 'last';
}

function setKey(k) {
  KEY = k; store('period', k);
  const url = new URL(location.href);
  if (k.startsWith('r:')) { const [f, t] = k.slice(2).split(':'); url.searchParams.set('from', f); url.searchParams.set('to', t); }
  else { url.searchParams.delete('from'); url.searchParams.delete('to'); }
  try { history.replaceState(null, '', url); } catch (e) { /* file:// */ }
  render();
}

}

/** Completed-by-bot count per sub-topic, on the same base as the sub-topic table (chats since that topic's sub-topics were first recorded). Display only. */
function subBotCounts(read, r) {
  const out = {}; let noTopicBot = 0;
  read.chats.forEach(c => {
    if (c.ms < r.start || c.ms >= r.end || c.outcome !== 'BOT') return;
    if (!c.topics.length) { noTopicBot++; return; }
    c.topics.forEach(t => {
      if (!(t in read.firstSubMs) || c.ms < dayStart(read.firstSubMs[t])) return;
      const o = out[t] || (out[t] = { subs: {}, noSub: 0 });
      const mine = uniq(c.subs.filter(s => s.topic === t).map(s => s.label));
      if (!mine.length) o.noSub++; else mine.forEach(l => { o.subs[l] = (o.subs[l] || 0) + 1; });
    });
  });
  return { tables: out, noTopicBot };
}

function overview(SA, SB) {
  const okA = !!(SA && SA.main.days), okB = !!(SB && SB.main.chats);
  const cmpA = SA ? esc(SA.p.compareText) : '', cmpB = SB ? esc(SB.p.compareText) : '';

    k1 = kpi({ label: 'Total enquiries', src: TAG_A, value: num(m.enq), sub: num(a) + ' a day', cmp });
  } else k1 = kpi({ label: 'Total enquiries', src: TAG_A, value: '–', sub: notA });
