<!doctype html>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" integrity="sha384-9nhczxUqK87bcKHh20fSQcTGD4qq5GhayNYSYWqwBkINBhOfQLg/P5HG5lF1urn4" crossorigin="anonymous"></script>
<style>
/* Plain report style: one font, grey rules, one accent, outcome colours only where outcomes are shown.
   Outcome colours validated for colour-blind separation and contrast in light and dark (28 Sep 2026). */
:root {
  color-scheme: light;
  --bg: #ffffff; --ink: #1d1d1b; --muted: #5c5b56; --faint: #7a7973; --line: #e2e1dc; --soft: #f6f6f3;
  --accent: #2a78d6; --bar: #8a8f98;
  --ok: #1baf7a; --person: #eb6834; --quiet: #a3a29c; --unknown: #4a3aa7; --alert: #b3261e; --alert-bg: #fbeeed;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #1a1a19; --ink: #f2f2f0; --muted: #c3c2b7; --faint: #a3a29c; --line: #34342f; --soft: #222220;
    --accent: #3987e5; --bar: #9a9fa8;
    --ok: #199e70; --person: #d95926; --quiet: #6f6e69; --unknown: #9085e9; --alert: #f28b82; --alert-bg: #3a2322;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #1a1a19; --ink: #f2f2f0; --muted: #c3c2b7; --faint: #a3a29c; --line: #34342f; --soft: #222220;
  --accent: #3987e5; --bar: #9a9fa8;
  --ok: #199e70; --person: #d95926; --quiet: #6f6e69; --unknown: #9085e9; --alert: #f28b82; --alert-bg: #3a2322;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
.wrap { max-width: 1040px; margin: 0 auto; padding: 28px 16px 56px; }
a { color: var(--accent); }

header { border-bottom: 2px solid var(--ink); padding-bottom: 14px; margin-bottom: 16px; }
.org { font-size: 13px; color: var(--muted); margin: 0; }
h1 { font-size: 24px; font-weight: 650; margin: 2px 0 4px; letter-spacing: -.01em; }
.meta { color: var(--muted); font-size: 13px; margin: 0; }

.filters { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: end; padding: 12px 0 16px; border-bottom: 1px solid var(--line); }
.field { display: flex; flex-direction: column; gap: 3px; }
.field label { font-size: 12px; color: var(--muted); }
select, input[type="date"], button { font: inherit; font-size: 14px; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 6px 10px; height: 34px; }
button { cursor: pointer; }
button:hover, select:hover, input[type="date"]:hover { border-color: var(--faint); }
.spacer { flex: 1; }
.linkbtn { border: 0; background: none; color: var(--accent); padding: 6px 4px; }

.notice { border-left: 3px solid var(--alert); background: var(--alert-bg); padding: 10px 14px; margin: 16px 0 0; }
.notice.info { border-left-color: var(--faint); background: var(--soft); }
.notice p { margin: 2px 0; }

section { padding: 22px 0 6px; border-bottom: 1px solid var(--line); }
section:last-of-type { border-bottom: 0; }
h2 { font-size: 16px; font-weight: 650; margin: 0 0 2px; }
h2 .n { color: var(--faint); font-weight: 500; margin-right: 8px; }
.lead { color: var(--muted); margin: 0 0 12px; font-size: 13px; }

.summary { display: grid; grid-template-columns: repeat(4, 1fr); border: 1px solid var(--line); margin: 12px 0 10px; }
.summary > div { padding: 12px 14px; border-left: 1px solid var(--line); }
.summary > div:first-child { border-left: 0; }
@media (max-width: 720px) { .summary { grid-template-columns: 1fr 1fr; } .summary > div:nth-child(3) { border-left: 0; } .summary > div:nth-child(n+3) { border-top: 1px solid var(--line); } }
.s-label { font-size: 12.5px; color: var(--muted); }
.s-value { font-size: 26px; font-weight: 650; font-variant-numeric: tabular-nums; margin: 2px 0; }
.s-note { font-size: 12.5px; color: var(--muted); }
.key { display: inline-block; width: 9px; height: 9px; margin-right: 6px; vertical-align: 0; }

.split { display: flex; height: 10px; margin: 4px 0 6px; background: var(--soft); }
.split span { display: block; height: 100%; }
.split span + span { border-left: 2px solid var(--bg); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12.5px; color: var(--muted); }

table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-weight: 600; font-size: 12.5px; color: var(--muted); padding: 6px 8px; border-bottom: 1px solid var(--ink); }
td { padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th.num, td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
td.barcell { width: 32%; }
.bar { height: 8px; background: var(--bar); min-width: 2px; }
.muted { color: var(--muted); }
.up { color: var(--ink); } .down { color: var(--ink); }
.tablewrap { overflow-x: auto; }

.chart { position: relative; height: 260px; margin-top: 4px; }
.facts { display: flex; flex-wrap: wrap; gap: 6px 28px; margin: 12px 0 4px; }
.facts b { font-weight: 600; }

.notes { color: var(--muted); font-size: 13px; }
.notes ul { margin: 6px 0 0; padding-left: 18px; }
.notes li { margin: 3px 0; }
.loading { padding: 60px 0; color: var(--muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

@media print {
  :root, :root[data-theme="dark"], :root:not([data-theme="light"]) {
    color-scheme: light; --bg: #fff; --ink: #1d1d1b; --muted: #4a4945; --faint: #6b6a65; --line: #d6d5cf; --soft: #f4f4f1;
    --accent: #2a78d6; --bar: #7a7f88; --ok: #1baf7a; --person: #eb6834; --quiet: #a3a29c; --unknown: #4a3aa7; --alert: #b3261e; --alert-bg: #fbeeed;
  }
  .filters, .noprint { display: none !important; }
  section { break-inside: avoid; }
  .wrap { max-width: none; padding: 0; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="org">Machino · Customer enquiries on WhatsApp</p>
    <h1 id="title">Customer chats</h1>
    <p class="meta" id="meta">Loading…</p>
  </header>

  <form class="filters" id="filters" onsubmit="return false">
    <div class="field">
      <label for="period">Period</label>
      <select id="period"></select>
    </div>
    <div class="field">
      <label for="from">From</label>
      <input type="date" id="from">
    </div>
    <div class="field">
      <label for="to">To</label>
      <input type="date" id="to">
    </div>
    <div class="spacer"></div>
    <button type="button" id="refresh" class="noprint">Refresh</button>
    <button type="button" id="print" class="noprint">Print</button>
    <button type="button" id="theme" class="noprint">Dark mode</button>
    <p class="sr" aria-live="polite" id="live"></p>
  </form>

  <div id="notices"></div>
  <main id="app"><p class="loading">Loading the latest enquiries…</p></main>
</div>

<script>
/* ==================================================================== LOGIC-START
   Same counting rules as docs/bot-issue-log/bot-issue-report.gs (the Sheet REPORT).
   The settings below must match BIL_CONFIG there; docs/bot-issue-log/test-dashboard.js checks it.
   To change: edit BOTH files, then run: node docs/bot-issue-log/test-dashboard.js */
const CFG = {
  CSV_URL: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSDB8b_yapTLgeVDqHt77yBvh3SpkYObGBpYUH-9rCluDZnnYFzKPgTVXNHqRxac2ze5D_um6Mn4f6W/pub?gid=1264505486&single=true&output=csv',
  REFRESH_MINUTES: 5,          // Google refreshes a published CSV about every 5 minutes
  STALE_HOURS: 24,             // newest chat older than this: warning
  FETCH_TIMEOUT_S: 20,
  OFFSET_H: 8,                 // Malaysia time
  DATE_FORMAT: 'MDY',          // SleekFlow sends 09/28/2026 07:28:03 +00:00
  ADMIN_NAME: 'IT',
  BUSIEST_MIN_CHATS: 20,
  SMALL_TOTAL: 20,             // below this, show "3 of 12" instead of a percentage
  MAX_RANGE_DAYS: 366,
  SAMPLE_VERSION: 'FAKE-DATA', // rows with this Flow Version are made-up test data
  COLUMNS: {
    when: ['Date & Time', 'Date/Time', 'DateTime', 'Date', 'LastContactFromCustomers'],
    topics: ['Topics', 'Topic', 'Issue', 'Issues', 'Issue / Topics', 'ChatTopics', 'Bot Topics'],
    details: ['Details', 'Detail', 'Concern', 'Concerns', 'Issue Details', 'ChatDetails', 'Bot Details'],
    outcome: ['Outcome', 'Final Outcome', 'Ending', 'Result'],
    test: ['Test', 'Test Row', 'BotTester'],
    channel: ['Channel'],
    version: ['Flow Version', 'Version', 'Bot Version'],
  },
  REQUIRED: ['when', 'topics', 'details', 'outcome'],
  TOPICS: [
    { name: 'Order Status', also: ['order', 'orders', "where's my order", 'order tracking'] },
    { name: 'Sizing', also: ['size', 'shoe size', "what's my shoe size"] },
    { name: 'Return / Exchange', also: ['return', 'exchange', 'return or exchange', 'returns'] },
    { name: 'Complaint / Feedback', also: ['complaint', 'feedback', 'complaints & feedback'] },
    { name: 'Store Information', also: ['store', 'stores', 'store & hours', 'store and hours', 'store info'] },
    { name: 'Restock', also: ['restocks'] },
    { name: 'Pick-up Order', also: ['pick-up', 'pickup', 'pick up'] },
    { name: 'Other', also: ['other (not selected)', 'asked for a person', 'talk to a human'] },
  ],
  DETAILS: [
    { label: 'Wide feet', also: ['wide'] },
    { label: 'Flat feet', also: ['flat'] },
    { label: 'Slim / narrow feet', also: ['slim feet', 'slim', 'narrow feet'] },
    { label: 'Bunions', also: ['bunion'] },
    { label: 'General size guide', also: ['general guide', 'size guide'] },
    { label: 'Sent online return link', also: ['online self-service', 'online self service', 'online return'] },
    { label: 'Return shipping cost', also: ['shipping cost'] },
    { label: 'Refund question', also: ['refund type', 'refund'] },
    { label: 'Bought in store', also: ['in-store purchase', 'in store purchase', 'in-store'] },
    { label: 'Damaged / wrong item', also: ['defect', 'defect / issue', 'defect or issue', 'damaged'] },
    { label: 'Order found', also: ['found'] },
    { label: "Couldn't find their order", also: ['order not found', 'not found'] },
    { label: 'Order needs staff', also: ['needs staff'] },
    { label: 'Order check not working', also: ['order check error', 'lookup error', 'order lookup error'], systemError: true },
    { label: 'Pick-up open', also: ['open', 'pickup open'] },
    { label: 'Pick-up closed right now', also: ['pick-up closed', 'pickup closed', 'closed'] },
    { label: 'Pick-up check not working', also: ['pick-up error', 'pickup error', 'pick-up check error'], systemError: true },
  ],
  OUTCOME_WORDS: {
    HUMAN: ['human', 'handed', 'handover', 'person', 'staff'],
    QUIET: ['stopped', 'quiet', 'safeclose', 'noreply', 'silent', 'didnt', 'didnot', 'notreply'],
    BOT: ['ended', 'completed', 'resolved', 'finished', 'selfservice'],
  },
  ALERT: { MIN_CHATS: 10, MIN_RISE: 5, MIN_RATIO: 1.5, MIN_DAY_OF_MONTH: 7, SHARE_POINTS: 5, MAX_LINES: 3 },
  MIN_ALERT_DAYS: 7,           // no "is up" alerts for ranges shorter than this
};
const DAY = 86400000;
const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const OUTCOME_LABEL = { BOT: 'Finished without staff', HUMAN: 'Needed a person', QUIET: 'Customer stopped replying', UNKNOWN: 'Ending unknown' };
const OTHER_CONCERN = 'Other concern';

const norm = s => String(s == null ? '' : s).toLowerCase().replace(/[^a-z0-9]/g, '');
const splitItems = s => String(s == null ? '' : s).split(/→|->|=>|>|\||;|,|\n/).map(x => x.trim()).filter(Boolean);

/** RFC-4180-style CSV to rows (quoted commas, "" escapes, CRLF). */
function parseCSV(text) {
  const rows = []; let row = []; let field = ''; let q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else q = false; }
      else field += c;
    } else if (c === '"') q = true;
    else if (c === ',') { row.push(field); field = ''; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && text[i + 1] === '\n') i++;
      row.push(field); rows.push(row); row = []; field = '';
    } else field += c;
  }
  if (field !== '' || row.length) { row.push(field); rows.push(row); }
  return rows.filter(r => r.some(v => v.trim() !== ''));
}

function findColumns(header) {
  const n = header.map(norm); const cols = {};
  Object.keys(CFG.COLUMNS).forEach(f => {
    for (const name of CFG.COLUMNS[f]) { const i = n.indexOf(norm(name)); if (i !== -1) { cols[f] = i; break; } }
  });
  const missing = CFG.REQUIRED.filter(f => cols[f] === undefined);
  if (missing.length) throw new Error('the data is missing column(s): ' + missing.map(f => CFG.COLUMNS[f][0]).join(', '));
  return cols;
}

function parseWhen(value, format) {
  const offsetMs = CFG.OFFSET_H * 3600000;
  if (value instanceof Date) return isNaN(value.getTime()) ? null : { ms: value.getTime(), hasSeconds: true };
  if (typeof value !== 'string') return null;
  const s = value.trim(); if (!s) return null;
  const TIME = '(?:[T\\s,]+(\\d{1,2}):(\\d{2})(?::(\\d{2}))?(?:\\.\\d+)?\\s*([ap]\\.?m\\.?)?)?';
  const ZONE = '\\s*(Z|(?:UTC|GMT)?\\s*[+-]\\d{2}:?\\d{2})?$';
  const zoneMin = z => { if (!z) return null; if (/^z$/i.test(z)) return 0; const t = z.replace(/UTC|GMT|\s|:/gi, ''); return (t[0] === '-' ? -1 : 1) * (Number(t.slice(1, 3)) * 60 + Number(t.slice(3, 5))); };
  function build(y, mo, d, hh, mi, se, ampm, zone) {
    y = +y; mo = +mo; d = +d; let h = hh === undefined ? 0 : +hh; const min = mi === undefined ? 0 : +mi; const sec = se === undefined ? 0 : +se;
    if (ampm) { if (h < 1 || h > 12) return null; h = (h % 12) + (/^p/i.test(ampm) ? 12 : 0); }
    if (mo < 1 || mo > 12 || d < 1 || d > 31 || h > 23 || min > 59 || sec > 59) return null;
    const w = Date.UTC(y, mo - 1, d, h, min, sec); const c = new Date(w);
    if (c.getUTCMonth() !== mo - 1 || c.getUTCDate() !== d) return null;
    return { ms: zone === null ? w - offsetMs : w - zone * 60000, hasSeconds: se !== undefined };
  }
  let m = new RegExp('^(\\d{4})-(\\d{1,2})-(\\d{1,2})' + TIME + ZONE, 'i').exec(s);
  if (m) return build(m[1], m[2], m[3], m[4], m[5], m[6], m[7], zoneMin(m[8]));
  m = new RegExp('^(\\d{1,2})[/.-](\\d{1,2})[/.-](\\d{4})' + TIME + ZONE, 'i').exec(s);
  if (m) {
    const zone = zoneMin(m[8]); const a = +m[1], b = +m[2]; let order;
    if (a > 12 && b <= 12) order = 'DMY'; else if (b > 12 && a <= 12) order = 'MDY';
    else if (format === 'DMY' || format === 'MDY') order = format; else if (a === b) order = 'DMY'; else return null;
    return order === 'DMY' ? build(m[3], b, a, m[4], m[5], m[6], m[7], zone) : build(m[3], a, b, m[4], m[5], m[6], m[7], zone);
  }
  const mon = w => { const i = ['jan', 'feb', 'mar', 'apr', 'may', 'jun', 'jul', 'aug', 'sep', 'oct', 'nov', 'dec'].indexOf(w.slice(0, 3).toLowerCase()); return i === -1 ? null : i + 1; };
  m = new RegExp('^(\\d{1,2})\\s+([A-Za-z]{3,9})\\.?,?\\s+(\\d{4})' + TIME + '$', 'i').exec(s);
  if (m && mon(m[2])) return build(m[3], mon(m[2]), m[1], m[4], m[5], m[6], m[7], null);
  m = new RegExp('^([A-Za-z]{3,9})\\.?\\s+(\\d{1,2}),?\\s+(\\d{4})' + TIME + '$', 'i').exec(s);
  if (m && mon(m[1])) return build(m[3], mon(m[1]), m[2], m[4], m[5], m[6], m[7], null);
  return null;
}

const wall = ms => { const d = new Date(ms + CFG.OFFSET_H * 3600000); return { y: d.getUTCFullYear(), m: d.getUTCMonth(), d: d.getUTCDate(), h: d.getUTCHours(), mi: d.getUTCMinutes(), dow: d.getUTCDay() }; };
const fromWall = (y, m, d, h, mi) => Date.UTC(y, m, d, h || 0, mi || 0) - CFG.OFFSET_H * 3600000;
const dayStart = ms => { const w = wall(ms); return fromWall(w.y, w.m, w.d); };
/** "2026-09-15" (Malaysia day) to its start instant; strict, never new Date(string). */
function isoDay(s) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s || ''));
  if (!m) return null;
  const y = +m[1], mo = +m[2], d = +m[3]; const t = new Date(Date.UTC(y, mo - 1, d));
  if (t.getUTCMonth() !== mo - 1 || t.getUTCDate() !== d) return null;
  return fromWall(y, mo - 1, d);
}
const toIso = ms => { const w = wall(ms); return w.y + '-' + String(w.m + 1).padStart(2, '0') + '-' + String(w.d).padStart(2, '0'); };
/** "15–19 Sep 2026", "28 Aug – 3 Sep 2026", "28 Dec 2025 – 3 Jan 2026" for [start, end). */
function rangeText(start, end, withYear) {
  if (end <= start) return 'no days';
  const a = wall(start), b = wall(end - 1); const mn = w => MONTHS[w.m].slice(0, 3); const yr = withYear === false ? '' : ' ' + b.y;
  if (a.y === b.y && a.m === b.m) return (a.d === b.d ? a.d : a.d + '–' + b.d) + ' ' + mn(b) + yr;
  if (a.y === b.y) return a.d + ' ' + mn(a) + ' – ' + b.d + ' ' + mn(b) + yr;
  return a.d + ' ' + mn(a) + ' ' + a.y + ' – ' + b.d + ' ' + mn(b) + ' ' + b.y;
}

let TOPIC_IDX = null, DETAIL_IDX = null;
/** Known topics only; anything else counts as "Other" (this page is public). */
function topicName(raw) {
  if (!TOPIC_IDX) { TOPIC_IDX = {}; CFG.TOPICS.forEach(t => [t.name].concat(t.also).forEach(a => { TOPIC_IDX[norm(a)] = t.name; })); }
  const n = norm(raw); if (!n) return null;
  return TOPIC_IDX[n] || 'Other';
}
/** Known concern words only; anything else becomes "Other concern". */
function concernOf(raw) {
  if (!DETAIL_IDX) { DETAIL_IDX = {}; CFG.DETAILS.forEach(d => [d.label].concat(d.also).forEach(a => { DETAIL_IDX[norm(a)] = d; })); }
  const n = norm(raw); if (!n) return null;
  const d = DETAIL_IDX[n];
  return d ? { label: d.label, systemError: !!d.systemError } : { label: OTHER_CONCERN, systemError: false };
}
function outcomeOf(raw) {
  const n = norm(raw); if (!n) return 'UNKNOWN';
  for (const k of ['HUMAN', 'QUIET', 'BOT']) if (CFG.OUTCOME_WORDS[k].some(w => n.includes(w))) return k;
  return 'UNKNOWN';
}
const topicOrder = name => { const i = CFG.TOPICS.findIndex(t => t.name === name); return i === -1 ? 999 : i; };

/** Rows (with header) to chats. Test rows, repeats and unreadable dates are counted, not used. */
function readChats(values) {
  const stats = { rows: 0, test: 0, unreadable: 0, duplicates: 0, sample: 0 };
  const chats = []; const firstSeenTopic = {}; const firstSeenConcern = {}; let logStartMs = null, newestMs = null;
  if (!values.length) return { chats, stats, firstSeenTopic, firstSeenConcern, logStartMs, newestMs };
  const cols = findColumns(values[0]);
  const cell = (row, f) => (cols[f] === undefined ? '' : (row[cols[f]] == null ? '' : row[cols[f]]));
  let prevKey = null;
  for (let i = 1; i < values.length; i++) {
    const row = values[i];
    if (['when', 'topics', 'details', 'outcome'].every(f => String(cell(row, f)).trim() === '')) continue;
    stats.rows++;
    if (String(cell(row, 'test')).trim() !== '') { stats.test++; prevKey = null; continue; }
    const when = parseWhen(String(cell(row, 'when')), CFG.DATE_FORMAT);
    const key = JSON.stringify(row.map(v => String(v).trim()));
    if (key === prevKey && when && when.hasSeconds) { stats.duplicates++; continue; }
    prevKey = key;
    if (!when) { stats.unreadable++; continue; }
    const ordered = splitItems(cell(row, 'topics')).map(topicName).filter(Boolean);
    const topics = ordered.filter((t, j) => ordered.indexOf(t) === j);
    const cOrdered = splitItems(cell(row, 'details')).map(concernOf).filter(Boolean);
    const concerns = cOrdered.filter((c, j) => cOrdered.findIndex(x => x.label === c.label) === j);
    const ch = String(cell(row, 'channel')).trim();
    const chat = {
      ms: when.ms, topics, lastTopic: ordered.length ? ordered[ordered.length - 1] : null,
      concerns, lastConcern: cOrdered.length ? cOrdered[cOrdered.length - 1].label : null,
      outcome: outcomeOf(cell(row, 'outcome')),
      channel: !ch || /^wh?at?s?app$/i.test(ch.replace(/\s/g, '')) ? 'WhatsApp' : ch,
      version: String(cell(row, 'version')).trim(),
    };
    if (chat.version === CFG.SAMPLE_VERSION) stats.sample++;
    chats.push(chat);
    if (logStartMs === null || chat.ms < logStartMs) logStartMs = chat.ms;
    if (newestMs === null || chat.ms > newestMs) newestMs = chat.ms;
    topics.forEach(t => { if (!(t in firstSeenTopic) || chat.ms < firstSeenTopic[t]) firstSeenTopic[t] = chat.ms; });
    concerns.forEach(c => { if (!(c.label in firstSeenConcern) || chat.ms < firstSeenConcern[c.label]) firstSeenConcern[c.label] = chat.ms; });
  }
  chats.sort((a, b) => a.ms - b.ms);
  return { chats, stats, firstSeenTopic, firstSeenConcern, logStartMs, newestMs };
}

function countRange(chats, r) {
  const o = { chats: 0, BOT: 0, HUMAN: 0, QUIET: 0, UNKNOWN: 0, quietNoAnswer: 0, noTopic: 0, noTopicHuman: 0, sample: 0, topics: {}, topicHuman: {}, concerns: {}, concernHuman: {}, systemErrors: {}, channels: {} };
  chats.forEach(c => {
    if (c.ms < r.start || c.ms >= r.end) return;
    o.chats++; o[c.outcome]++; const human = c.outcome === 'HUMAN';
    if (c.version === CFG.SAMPLE_VERSION) o.sample++;
    if (!c.topics.length) { o.noTopic++; if (human) o.noTopicHuman++; if (c.outcome === 'QUIET') o.quietNoAnswer++; }
    c.topics.forEach(t => { o.topics[t] = (o.topics[t] || 0) + 1; });
    if (human && c.lastTopic) o.topicHuman[c.lastTopic] = (o.topicHuman[c.lastTopic] || 0) + 1;
    c.concerns.forEach(k => { o.concerns[k.label] = (o.concerns[k.label] || 0) + 1; if (k.systemError) o.systemErrors[k.label] = (o.systemErrors[k.label] || 0) + 1; });
    if (human && c.lastConcern) o.concernHuman[c.lastConcern] = (o.concernHuman[c.lastConcern] || 0) + 1;
    o.channels[c.channel] = (o.channels[c.channel] || 0) + 1;
  });
  return o;
}

/** Period keys: this | last | d7 | d30 | m:YYYY-MM | r:YYYY-MM-DD:YYYY-MM-DD (both days included). */
function periodFor(key, nowMs, logStartMs) {
  const w = wall(nowMs);
  const monthStart = fromWall(w.y, w.m, 1), prevStart = fromWall(w.y, w.m - 1, 1), todayStart = fromWall(w.y, w.m, w.d);
  const p = { key, todayStart, today: { start: todayStart, end: todayStart + DAY }, last7: { start: todayStart - 6 * DAY, end: todayStart + DAY }, notes: [] };
  const monthName = ms => { const x = wall(ms); return MONTHS[x.m] + ' ' + x.y; };
  /** Same number of days just before; if the range runs into today, stop at the same time of day. */
  const before = (start, end) => {
    const len = end - start; const cs = start - len;
    const ce = end > nowMs ? Math.min(cs + (nowMs - start), start) : start;
    return { start: cs, end: ce };
  };
  if (key === 'last' || key.startsWith('m:')) {
    let start;
    if (key === 'last') start = prevStart;
    else { const mm = /^m:(\d{4})-(\d{2})$/.exec(key); start = mm ? fromWall(+mm[1], +mm[2] - 1, 1) : prevStart; }
    const sw = wall(start); const cs = fromWall(sw.y, sw.m - 1, 1);
    p.main = { start, end: fromWall(sw.y, sw.m + 1, 1) };
    p.compare = { start: cs, end: start };
    p.title = monthName(start);
    p.compareText = monthName(cs);
  } else if (key === 'd7' || key === 'd30') {
    const n = key === 'd7' ? 7 : 30; const start = todayStart - (n - 1) * DAY;
    p.main = { start, end: todayStart + DAY };
    p.compare = before(start, todayStart + DAY);
    p.title = 'Last ' + n + ' days · ' + rangeText(start, todayStart + DAY);
    p.compareText = rangeText(p.compare.start, p.compare.end, false);
  } else if (key.startsWith('r:')) {
    const parts = key.slice(2).split(':');
    let a = isoDay(parts[0]), b = isoDay(parts[1]);
    if (a === null || b === null) return periodFor('this', nowMs, logStartMs);
    if (b < a) { const t = a; a = b; b = t; p.notes.push('The dates were the wrong way round, so they were swapped.'); }
    if (b > todayStart) { b = todayStart; p.notes.push('The range stops at today.'); }
    if (a > b) a = b;
    if ((b - a) / DAY + 1 > CFG.MAX_RANGE_DAYS) { a = b - (CFG.MAX_RANGE_DAYS - 1) * DAY; p.notes.push('Ranges are limited to ' + CFG.MAX_RANGE_DAYS + ' days.'); }
    if (logStartMs !== null && b + DAY <= dayStart(logStartMs)) p.notes.push('There are no chats before ' + rangeText(dayStart(logStartMs), dayStart(logStartMs) + DAY) + '.');
    p.main = { start: a, end: b + DAY };
    p.compare = before(a, b + DAY);
    const days = Math.round((b + DAY - a) / DAY);
    p.title = rangeText(a, b + DAY) + ' (' + days + ' day' + (days === 1 ? '' : 's') + ')';
    p.compareText = rangeText(p.compare.start, p.compare.end, false);
  } else {
    const end = Math.min(prevStart + (nowMs - monthStart), monthStart);
    p.main = { start: monthStart, end: fromWall(w.y, w.m + 1, 1) };
    p.compare = { start: prevStart, end };
    p.title = 'This month · ' + rangeText(monthStart, todayStart + DAY);
    p.compareText = rangeText(prevStart, Math.max(end, prevStart + 1), false);
    p.isThisMonth = true;
  }
  p.days = Math.max(1, Math.round((Math.min(p.main.end, todayStart + DAY) - p.main.start) / DAY));
  return p;
}

function diffText(diff) { return diff > 0 ? { t: '▲ ' + diff + ' more', c: 'up' } : diff < 0 ? { t: '▼ ' + (-diff) + ' fewer', c: 'down' } : { t: 'same', c: '' }; }

/** Everything the page shows, for one period. */
function summarize(read, nowMs, key) {
  const p = periodFor(key, nowMs, read.logStartMs);
  const main = countRange(read.chats, p.main), compare = countRange(read.chats, p.compare), today = countRange(read.chats, p.today);
  const canCompare = read.logStartMs !== null && read.logStartMs < p.compare.start && p.compare.end > p.compare.start;
  const topicRows = Object.keys(main.topics).map(name => {
    const c = compare.topics[name] || 0; const isNew = canCompare && read.firstSeenTopic[name] >= p.compare.start;
    return { name, chats: main.topics[name], human: main.topicHuman[name] || 0, compare: c, isNew, vs: !canCompare ? { t: '–', c: '' } : isNew ? { t: 'new', c: 'new' } : diffText(main.topics[name] - c) };
  }).sort((a, b) => b.chats - a.chats || topicOrder(a.name) - topicOrder(b.name) || a.name.localeCompare(b.name));
  const concernRows = Object.keys(main.concerns).map(label => ({ label, chats: main.concerns[label], human: main.concernHuman[label] || 0 }))
    .sort((a, b) => (a.label === OTHER_CONCERN) - (b.label === OTHER_CONCERN) || b.chats - a.chats || a.label.localeCompare(b.label)).slice(0, 10);

  // chats over time: by hour for one day, by day up to 62 days, by week beyond
  const lastEnd = Math.min(p.main.end, p.today.end); const span = Math.max(0, lastEnd - p.main.start);
  const unit = span <= DAY ? 'hour' : span <= 62 * DAY ? 'day' : 'week';
  const buckets = [];
  if (unit === 'hour') for (let h = 0; h < 24; h++) buckets.push({ start: p.main.start + h * 3600000, end: p.main.start + (h + 1) * 3600000, label: (h % 12 || 12) + (h < 12 ? 'am' : 'pm') });
  else if (unit === 'day') for (let t = p.main.start; t < lastEnd; t += DAY) { const x = wall(t); buckets.push({ start: t, end: t + DAY, label: x.d + ' ' + MONTHS[x.m].slice(0, 3) }); }
  else { for (let t = p.main.start; t < lastEnd; t += 7 * DAY) { const e = Math.min(t + 7 * DAY, lastEnd); const x = wall(t); buckets.push({ start: t, end: e, label: x.d + ' ' + MONTHS[x.m].slice(0, 3), partial: e - t < 7 * DAY }); } }
  buckets.forEach(b => { b.total = 0; });
  const size = { hour: 3600000, day: DAY, week: 7 * DAY }[unit];
  read.chats.forEach(c => {
    if (c.ms < p.main.start || c.ms >= lastEnd) return;
    const b = buckets[Math.floor((c.ms - p.main.start) / size)]; if (b) b.total++;
  });

  // busiest day (ranges of 7+ days, average per weekday) and busiest hour (20+ chats)
  const inRange = read.chats.filter(c => c.ms >= p.main.start && c.ms < p.main.end);
  let busiestDay = null, busiestHour = null;
  if (p.days >= 7 && inRange.length) {
    const totals = [0, 0, 0, 0, 0, 0, 0], seen = [0, 0, 0, 0, 0, 0, 0];
    for (let t = p.main.start; t < lastEnd; t += DAY) seen[wall(t).dow]++;
    inRange.forEach(c => { totals[wall(c.ms).dow]++; });
    const avg = totals.map((n, d) => (seen[d] ? n / seen[d] : 0));
    const d = [1, 2, 3, 4, 5, 6, 0].reduce((best, x) => (avg[x] > avg[best] ? x : best), 1);
    busiestDay = { day: DAYS[d], avg: avg[d] };
  }
  if (inRange.length >= CFG.BUSIEST_MIN_CHATS) {
    const byHour = new Array(24).fill(0); inRange.forEach(c => { byHour[wall(c.ms).h]++; });
    busiestHour = byHour.reduce((best, n, h) => (n > byHour[best] ? h : best), 0);
  }

  // last 6 months (whole log, ignores the chosen period)
  const months = []; const nw = wall(nowMs);
  for (let i = 5; i >= 0; i--) {
    const start = fromWall(nw.y, nw.m - i, 1); const sw = wall(start); const end = fromWall(sw.y, sw.m + 1, 1);
    if (read.logStartMs === null || end <= dayStart(read.logStartMs)) continue;
    const r = countRange(read.chats, { start, end });
    months.push({ label: MONTHS[sw.m] + ' ' + sw.y + (i === 0 ? ' (so far)' : ''), chats: r.chats, BOT: r.BOT, HUMAN: r.HUMAN, QUIET: r.QUIET });
  }

  // things to check
  const A = CFG.ALERT; const alerts = [];
  const sys = countRange(read.chats, p.last7).systemErrors;
  Object.keys(sys).sort().forEach(l => alerts.push({ level: 'high', text: l + ': seen ' + sys[l] + ' time' + (sys[l] === 1 ? '' : 's') + ' in the last 7 days. Please tell ' + CFG.ADMIN_NAME + '.' }));
  const longEnough = p.days >= CFG.MIN_ALERT_DAYS && (!p.isThisMonth || wall(nowMs).d >= A.MIN_DAY_OF_MONTH);
  if (canCompare && longEnough) {
    const rises = (n, b) => n >= A.MIN_CHATS && n - b >= A.MIN_RISE && n >= A.MIN_RATIO * b;
    topicRows.forEach(r => { if (!r.isNew && rises(r.chats, r.compare)) alerts.push({ level: 'mid', text: r.name + ' is up: ' + r.chats + ' chats, compared with ' + r.compare + ' in ' + p.compareText + '.' }); });
    Object.keys(main.concerns).forEach(l => { if (l === OTHER_CONCERN) return; const n = main.concerns[l], b = compare.concerns[l] || 0; if (read.firstSeenConcern[l] >= p.compare.start) return; if (rises(n, b)) alerts.push({ level: 'mid', text: 'More customers with "' + l + '": ' + n + ', compared with ' + b + ' in ' + p.compareText + '.' }); });
    const share = (n, t) => (t ? 100 * n / t : 0);
    const shareRise = (n, b) => compare.chats > 0 && main.chats > 0 && share(n, main.chats) - share(b, compare.chats) >= A.SHARE_POINTS && n - b >= A.MIN_RISE;
    if (shareRise(main.topics.Other || 0, compare.topics.Other || 0)) alerts.push({ level: 'mid', text: 'More chats are "Other" than before. The menu may be missing something.' });
    if (shareRise(main.noTopic, compare.noTopic)) alerts.push({ level: 'mid', text: 'More customers leave before picking a topic than before.' });
  }
  return { p, main, compare, today, canCompare, topicRows, concernRows, buckets, unit, busiestDay, busiestHour, months, alerts: alerts.slice(0, A.MAX_LINES) };
}
/* ==================================================================== LOGIC-END */

// ============================================================ page
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const share = (n, t) => (!t ? '–' : t < CFG.SMALL_TOTAL ? String(n) : Math.round(100 * n / t) + '%');
const hourText = h => { const f = x => { x %= 24; return x === 0 ? '12 am' : x < 12 ? x + ' am' : x === 12 ? '12 pm' : (x - 12) + ' pm'; }; return f(h) + ' to ' + f(h + 1); };
const clock = ms => { const w = wall(ms); return (w.h % 12 || 12) + ':' + String(w.mi).padStart(2, '0') + (w.h < 12 ? ' am' : ' pm'); };
const stamp = ms => { const w = wall(ms); return w.d + ' ' + MONTHS[w.m].slice(0, 3) + ' ' + w.y + ', ' + clock(ms); };
const store = (k, v) => { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } };

let READ = null, LAST_TEXT = null, FETCHED_AT = null, LOADING = false, CHART = null, RENDER_DAY = null, KEY = null;

async function load(manual) {
  if (LOADING) return; LOADING = true; $('#refresh').disabled = true;
  const ctrl = new AbortController(); const timer = setTimeout(() => ctrl.abort(), CFG.FETCH_TIMEOUT_S * 1000);
  try {
    const res = await fetch(CFG.CSV_URL + (CFG.CSV_URL.includes('?') ? '&' : '?') + 't=' + Date.now(), { cache: 'no-store', signal: ctrl.signal });
    if (!res.ok) throw new Error('the data link answered ' + res.status + '.');
    const text = await res.text();
    if (/^\s*</.test(text)) throw new Error('the data link returned a web page, not data. Is the sheet still published to the web?');
    FETCHED_AT = Date.now(); LOAD_ERROR = null;
    const newDay = RENDER_DAY !== toIso(Date.now());
    if (text !== LAST_TEXT || newDay) { READ = readChats(parseCSV(text)); LAST_TEXT = text; fillPeriods(); render(!manual && CHART !== null); }
    else { renderMeta(); renderNotices(); }
  } catch (e) {
    LOAD_ERROR = e.name === 'AbortError' ? 'the data link took too long to answer.' : e.message;
    renderNotices();
    if (!READ) $('#app').innerHTML = '';
  } finally { clearTimeout(timer); LOADING = false; $('#refresh').disabled = false; }
}
let LOAD_ERROR = null;

function fillPeriods() {
  const sel = $('#period');
  const nw = wall(Date.now()); const opts = [['this', 'This month'], ['last', 'Last month'], ['d7', 'Last 7 days'], ['d30', 'Last 30 days']];
  const months = [];
  if (READ.logStartMs !== null) {
    const s = wall(READ.logStartMs); let y = s.y, m = s.m;
    while (y < nw.y || (y === nw.y && m < nw.m)) { months.push(['m:' + y + '-' + String(m + 1).padStart(2, '0'), MONTHS[m] + ' ' + y]); m++; if (m > 11) { m = 0; y++; } }
  }
  months.reverse();
  sel.innerHTML = opts.map(([v, t]) => '<option value="' + v + '">' + esc(t) + '</option>').join('') +
    (months.length ? '<optgroup label="Past months">' + months.map(([v, t]) => '<option value="' + v + '">' + esc(t) + '</option>').join('') + '</optgroup>' : '') +
    '<option value="custom">Custom dates</option>';
  const today = toIso(Date.now());
  $('#from').max = today; $('#to').max = today;
  if (READ.logStartMs !== null) { $('#from').min = toIso(READ.logStartMs); $('#to').min = toIso(READ.logStartMs); }
  if (!KEY) KEY = startKey();
  sel.value = KEY.startsWith('r:') ? 'custom' : (opts.concat(months).some(o => o[0] === KEY) ? KEY : 'this');
  if (sel.value === 'this' && KEY !== 'this' && !KEY.startsWith('r:')) KEY = 'this';
}

/** ?from=YYYY-MM-DD&to=YYYY-MM-DD wins, then the last choice, then "This month". */
function startKey() {
  const q = new URLSearchParams(location.search); const f = q.get('from'), t = q.get('to');
  if (isoDay(f) !== null && isoDay(t) !== null) return 'r:' + f + ':' + t;
  const saved = store('period');
  return saved && /^(this|last|d7|d30|m:\d{4}-\d{2}|r:\d{4}-\d{2}-\d{2}:\d{4}-\d{2}-\d{2})$/.test(saved) ? saved : 'this';
}

function setKey(k) {
  KEY = k; store('period', k);
  const url = new URL(location.href);
  if (k.startsWith('r:')) { const [f, t] = k.slice(2).split(':'); url.searchParams.set('from', f); url.searchParams.set('to', t); }
  else { url.searchParams.delete('from'); url.searchParams.delete('to'); }
  try { history.replaceState(null, '', url); } catch (e) { /* file:// */ }
  render();
}

function renderMeta(S) {
  const bits = [];
  if (S) bits.push(S.canCompare ? 'Compared with ' + esc(S.p.compareText) : 'No earlier period to compare with');
  bits.push('Malaysia time');
  if (READ) { const td = countRange(READ.chats, periodFor('this', Date.now()).today).chats; bits.push('Today so far: ' + td + ' chat' + (td === 1 ? '' : 's')); }
  if (FETCHED_AT) bits.push('Data checked ' + esc(clock(FETCHED_AT)));
  $('#meta').innerHTML = bits.join(' · ');
}

function renderNotices(S) {
  const n = [];
  if (LOAD_ERROR) n.push('<div class="notice"><p><b>Couldn\'t load the latest data:</b> ' + esc(LOAD_ERROR) + (READ ? ' Showing the last data that loaded.' : ' Please tell ' + esc(CFG.ADMIN_NAME) + '.') + '</p></div>');
  if (READ && READ.newestMs !== null && Date.now() - READ.newestMs > CFG.STALE_HOURS * 3600000) n.push('<div class="notice"><p><b>No new chats since ' + esc(stamp(READ.newestMs)) + '.</b> If customers have been messaging, the bot may have stopped sending data. Please tell ' + esc(CFG.ADMIN_NAME) + '.</p></div>');
  if (S && S.main.sample) n.push('<div class="notice info"><p><b>Sample data:</b> ' + S.main.sample + ' of the ' + S.main.chats + ' chats in this period are made-up test rows (Flow Version ' + esc(CFG.SAMPLE_VERSION) + '). Delete them from the sheet before using these numbers.</p></div>');
  if (S && S.p.notes.length) n.push('<div class="notice info"><p>' + S.p.notes.map(esc).join(' ') + '</p></div>');
  $('#notices').innerHTML = n.join('');
}

function render(quiet) {
  if (!READ) return;
  const S = summarize(READ, Date.now(), KEY || 'this'); const m = S.main, c = S.compare;
  RENDER_DAY = toIso(Date.now());
  $('#title').textContent = 'Customer chats · ' + S.p.title;
  $('#from').value = toIso(S.p.main.start); $('#to').value = toIso(Math.min(S.p.main.end, S.p.today.end) - 1);
  renderMeta(S); renderNotices(S);

  const d = S.canCompare ? m.chats - c.chats : null;
  const of = (n, t) => (t < CFG.SMALL_TOTAL ? 'out of ' + t + ' chats' : n + ' of ' + t + ' chats');
  const cell = (label, key, value, note) => '<div><div class="s-label">' + (key ? '<span class="key" style="background:var(--' + key + ')"></span>' : '') + label + '</div><div class="s-value">' + value + '</div><div class="s-note">' + note + '</div></div>';
  let h = '';

  // 1 Summary
  h += '<section><h2><span class="n">1</span>Summary</h2>';
  h += '<div class="summary">' +
    cell('Total chats', '', m.chats, d === null ? 'No earlier period to compare' : d === 0 ? 'Same as ' + esc(S.p.compareText) + ' (' + c.chats + ')' : (d > 0 ? '+' : '') + d + ' vs ' + esc(S.p.compareText) + ' (' + c.chats + ')') +
    cell('Finished without staff', 'ok', share(m.BOT, m.chats), of(m.BOT, m.chats)) +
    cell('Needed a person', 'person', share(m.HUMAN, m.chats), of(m.HUMAN, m.chats)) +
    cell('Customer stopped replying', 'quiet', share(m.QUIET, m.chats), of(m.QUIET, m.chats)) + '</div>';
  if (m.chats) {
    const parts = ['BOT', 'HUMAN', 'QUIET', 'UNKNOWN'].filter(k => m[k]);
    h += '<div class="split" role="img" aria-label="How chats ended">' + parts.map(k => '<span title="' + OUTCOME_LABEL[k] + ': ' + m[k] + '" style="width:' + (100 * m[k] / m.chats) + '%;background:var(--' + { BOT: 'ok', HUMAN: 'person', QUIET: 'quiet', UNKNOWN: 'unknown' }[k] + ')"></span>').join('') + '</div>';
    if (m.UNKNOWN) h += '<p class="s-note">' + m.UNKNOWN + ' chat(s) have an ending the page doesn\'t recognise. Please tell ' + esc(CFG.ADMIN_NAME) + '.</p>';
  }
  if (S.alerts.length) h += '<div class="notice" style="margin:12px 0 10px"><p><b>Things to check</b></p>' + S.alerts.map(a => '<p>' + esc(a.text) + '</p>').join('') + '</div>';
  h += '</section>';

  // 2 Topics
  const maxT = Math.max(1, ...S.topicRows.map(r => r.chats), m.noTopic);
  h += '<section><h2><span class="n">2</span>What customers asked about</h2><p class="lead">Biggest first. One chat can cover more than one topic, so the topics add up to more than the total.</p>';
  h += '<div class="tablewrap"><table><thead><tr><th>Topic</th><th class="num">Chats</th><th></th><th class="num">Needed a person</th><th class="num">vs ' + esc(S.p.compareText) + '</th></tr></thead><tbody>';
  S.topicRows.forEach(r => { h += '<tr><td>' + esc(r.name) + '</td><td class="num">' + r.chats + '</td><td class="barcell"><div class="bar" style="width:' + (100 * r.chats / maxT) + '%"></div></td><td class="num">' + r.human + '</td><td class="num muted">' + r.vs.t + '</td></tr>'; });
  if (m.noTopic) { const dv = S.canCompare ? diffText(m.noTopic - c.noTopic) : { t: '–' }; h += '<tr><td class="muted">Didn\'t pick a topic</td><td class="num">' + m.noTopic + '</td><td class="barcell"><div class="bar" style="opacity:.45;width:' + (100 * m.noTopic / maxT) + '%"></div></td><td class="num">' + m.noTopicHuman + '</td><td class="num muted">' + dv.t + '</td></tr>'; }
  if (!S.topicRows.length && !m.noTopic) h += '<tr><td colspan="5" class="muted">No chats in this period.</td></tr>';
  h += '</tbody></table></div></section>';

  // 3 Concerns
  h += '<section><h2><span class="n">3</span>Specific problems</h2><p class="lead">What exactly customers needed inside each topic.</p>';
  if (S.concernRows.length) {
    const maxC = Math.max(...S.concernRows.map(r => r.chats));
    h += '<div class="tablewrap"><table><thead><tr><th>Problem</th><th class="num">Chats</th><th></th><th class="num">Needed a person</th></tr></thead><tbody>' +
      S.concernRows.map(r => '<tr><td' + (r.label === OTHER_CONCERN ? ' class="muted"' : '') + '>' + esc(r.label) + '</td><td class="num">' + r.chats + '</td><td class="barcell"><div class="bar" style="width:' + (100 * r.chats / maxC) + '%"></div></td><td class="num">' + r.human + '</td></tr>').join('') + '</tbody></table></div>';
  } else h += '<p class="muted">None recorded in this period. The bot only sends topics for now.</p>';
  h += '</section>';

  // 4 When
  const unitText = { hour: 'per hour', day: 'per day', week: 'per week' }[S.unit];
  h += '<section><h2><span class="n">4</span>When customers message us</h2><p class="lead">Chats ' + unitText + ', Malaysia time, by the time of the customer\'s last message.</p>';
  h += '<div class="chart"><canvas id="cTime" role="img" aria-label="Chats ' + unitText + '"></canvas></div><p id="nochart" class="muted"></p>';
  const facts = [];
  if (S.busiestDay) facts.push('Busiest day: <b>' + S.busiestDay.day + 's</b> (about ' + (Math.round(S.busiestDay.avg * 10) / 10) + ' chats a day)');
  if (S.busiestHour !== null) facts.push('Busiest time: <b>' + hourText(S.busiestHour) + '</b>');
  if (!facts.length) facts.push('<span class="muted">Busiest day and time show for periods of 7 days or more with at least ' + CFG.BUSIEST_MIN_CHATS + ' chats.</span>');
  h += '<div class="facts">' + facts.map(x => '<span>' + x + '</span>').join('') + '</div></section>';

  // 5 Months
  if (S.months.length) {
    h += '<section><h2><span class="n">5</span>Month by month</h2><p class="lead">All chats in the log, whatever period is picked above.</p><div class="tablewrap"><table><thead><tr><th>Month</th><th class="num">Chats</th><th class="num">Finished without staff</th><th class="num">Needed a person</th><th class="num">Stopped replying</th></tr></thead><tbody>' +
      S.months.map(r => '<tr><td>' + esc(r.label) + '</td><td class="num">' + r.chats + '</td><td class="num">' + share(r.BOT, r.chats) + '</td><td class="num">' + share(r.HUMAN, r.chats) + '</td><td class="num">' + share(r.QUIET, r.chats) + '</td></tr>').join('') + '</tbody></table></div></section>';
  }

  // Notes
  const st = READ.stats; const notes = [
    'Needed a person is often on purpose, for example refunds, damaged items or orders that couldn\'t be found. It is not a failure.',
    'A chat is counted once it reaches an ending in the chat bot. This page doesn\'t measure staff and isn\'t the complaint case list.',
    'Only topics, outcomes and times are stored. No names, phone numbers or messages.',
  ];
  const chans = Object.keys(m.channels); if (chans.length > 1) notes.push('By channel: ' + chans.map(k => k + ' ' + m.channels[k]).join(', ') + '.');
  if (st.test) notes.push('Test chats not counted: ' + st.test + '.');
  if (st.unreadable) notes.push(st.unreadable + ' chat(s) had a date that couldn\'t be read and aren\'t counted. Please tell ' + CFG.ADMIN_NAME + '.');
  if (st.duplicates) notes.push(st.duplicates + ' repeated row(s) ignored.');
  notes.push('Source: SleekFlow Tracker (Google Sheet), ' + READ.chats.length + ' chats in total. Updates every ' + CFG.REFRESH_MINUTES + ' minutes.');
  h += '<section class="notes"><h2>Notes</h2><ul>' + notes.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul></section>';

  $('#app').innerHTML = h;
  drawChart(S, quiet);
}

function drawChart(S, quiet) {
  if (CHART) { CHART.destroy(); CHART = null; }
  const el = document.getElementById('cTime'); if (!el) return;
  if (!window.Chart) { el.parentElement.style.display = 'none'; $('#nochart').textContent = 'The chart couldn\'t load. The tables are still correct.'; return; }
  Chart.defaults.font.family = getComputedStyle(document.body).fontFamily; Chart.defaults.color = css('--muted');
  CHART = new Chart(el, {
    type: 'bar',
    data: { labels: S.buckets.map(b => b.label), datasets: [{ label: 'Chats', data: S.buckets.map(b => b.total), backgroundColor: S.buckets.map(b => css('--accent') + (b.partial ? '66' : '')), borderRadius: 2, maxBarThickness: 36 }] },
    options: {
      animation: quiet ? false : { duration: 300 }, maintainAspectRatio: false,
      plugins: { legend: { display: false }, tooltip: { callbacks: { title: it => (S.unit === 'week' ? 'Week from ' : '') + it[0].label + (S.buckets[it[0].dataIndex].partial ? ' (part week)' : ''), label: x => ' ' + x.raw + ' chat' + (x.raw === 1 ? '' : 's') } } },
      scales: { x: { grid: { display: false }, ticks: { autoSkip: true, maxRotation: 0 } }, y: { beginAtZero: true, grid: { color: css('--line') }, ticks: { precision: 0 } } },
    },
  });
}

function applyDates(changed) {
  let f = $('#from').value, t = $('#to').value;
  if (!f || !t) return;
  if (t < f) { const x = f; f = t; t = x; $('#from').value = f; $('#to').value = t; $('#live').textContent = 'The From date was after the To date, so they were swapped.'; }
  $('#period').value = 'custom';
  setKey('r:' + f + ':' + t);
}

const themeLabel = () => { const cur = document.documentElement.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); $('#theme').textContent = cur === 'dark' ? 'Light mode' : 'Dark mode'; };

$('#period').addEventListener('change', () => {
  const v = $('#period').value;
  if (v === 'custom') { $('#from').focus(); if ($('#from').value && $('#to').value) applyDates(); return; }
  setKey(v);
});
$('#from').addEventListener('change', () => applyDates('from'));
$('#to').addEventListener('change', () => applyDates('to'));
$('#refresh').addEventListener('click', () => load(true));
$('#print').addEventListener('click', () => window.print());
$('#theme').addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', next); store('theme', next); themeLabel(); render(true);
});
window.addEventListener('beforeprint', () => { if (CHART) { CHART.resize(); } });
(function init() {
  const t = store('theme'); if (t) document.documentElement.setAttribute('data-theme', t); themeLabel();
  load(true);
  setInterval(() => { if (!document.hidden) load(false); }, CFG.REFRESH_MINUTES * 60000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden && FETCHED_AT && Date.now() - FETCHED_AT > CFG.REFRESH_MINUTES * 60000) load(false); });
})();
</script>
</body>
</html>
