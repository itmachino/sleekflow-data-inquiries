:root {
  --font-sans: "Plus Jakarta Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 20px; --space-6: 24px; --space-8: 32px; --space-12: 48px;
  --radius-sm: 6px; --radius-md: 10px; --radius-lg: 16px; --radius-full: 999px;
  --control-h: 40px; --control-h-touch: 44px; --control-h-sm: 32px;
  --sidebar-w: 248px; --content-max: 1360px; --phone-min: 390px; --icon: 18px;
}

:root, [data-theme="light"] {
  color-scheme: light;
  --bg: #f5f4f1; --surface: #ffffff; --surface-sunken: #f0efeb; --surface-hover: #f4f3f0;
  --line: #e5e3de; --line-strong: #8c8983;
  --ink: #161615; --ink-muted: #5e5b56; --ink-faint: #8c8983;
  --brand: #111111; --on-brand: #ffffff; --brand-soft: #ebeae6;
  --good: #1f8a5a; --good-text: #1d7346; --good-soft: #e3f2e9;
  --warning: #e09400; --warning-text: #8f5200; --warning-soft: #fbefd9;
  --problem: #d13a2f; --problem-text: #bb2d22; --problem-soft: #fbe7e4;
  --ch-whatsapp: #24a359; --ch-whatsapp-soft: #e2f3e8;
  --ch-instagram: #c2255c; --ch-instagram-soft: #fbe6ee;
  --ch-tiktok: #0f7a80; --ch-tiktok-soft: #dff0f0;
  --ch-email: #8193b5; --ch-email-soft: #e9edf2;
  --reply-bot: #7457e0; --reply-bot-text: #5b3fc4; --reply-bot-soft: #eeeafc;
  --chart-compare: #b9b6af;
  --scrim: #16161566;
  --shadow-card: 0 1px 2px #1616150a, 0 1px 3px #1616150d;
  --shadow-pop: 0 4px 12px #16161514, 0 16px 32px -8px #16161526;
  --focus-ring: 0 0 0 2px #ffffff, 0 0 0 4px #111111;
}

[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0e0e0f; --surface: #18181a; --surface-sunken: #121213; --surface-hover: #222225;
  --line: #2b2b2f; --line-strong: #6e6d73;
  --ink: #f2f1ee; --ink-muted: #a9a7a2; --ink-faint: #6e6d73;
  --brand: #f2f1ee; --on-brand: #111111; --brand-soft: #2a2a2d;
  --good: #3fbf80; --good-text: #4fc98a; --good-soft: #13291d;
  --warning: #f5b743; --warning-text: #f2b24a; --warning-soft: #2e2311;
  --problem: #f2554b; --problem-text: #ff8a7a; --problem-soft: #351612;
  --ch-whatsapp: #3cc47a; --ch-whatsapp-soft: #10291a;
  --ch-instagram: #e0457b; --ch-instagram-soft: #3a1422;
  --ch-tiktok: #5ed6d0; --ch-tiktok-soft: #0e2a2b;
  --ch-email: #6f86b8; --ch-email-soft: #1e242d;
  --reply-bot: #a08cff; --reply-bot-text: #b4a2ff; --reply-bot-soft: #231c3d;
  --chart-compare: #55555b;
  --scrim: #000000a6;
  --shadow-card: 0 1px 2px #00000066;
  --shadow-pop: 0 8px 24px #000000b3;
  --focus-ring: 0 0 0 2px #18181a, 0 0 0 4px #f2f1ee;
}

/* Aliases defined by tokens.json */
:root, [data-theme] {
  --reply-answered: var(--good);
  --reply-waiting: var(--warning);
  --reply-urgent: var(--problem);
  --chart-grid: var(--line);
  --chart-axis: var(--ink-muted);
}

/* Phone artboards: apply the system's under-480px rules regardless of the preview window size. */
.is-phone .mcs-kpi-grid { gap: var(--space-3); grid-template-columns: 1fr 1fr; }
.is-phone .mcs-kpi__value { font-size: 28px; line-height: 34px; }
.is-phone .mcs-kpi__compare { display: none; }
.is-phone .mcs-card { padding: var(--space-4); }
.is-phone .mcs-table { padding: 0; }
.is-phone .mcs-alert { flex-wrap: wrap; align-items: flex-start; }
.is-phone .mcs-alert__text { flex-basis: calc(100% - 80px); flex-direction: column; }
.is-phone .mcs-alert__action { order: 3; margin-left: 32px; }
.is-phone .mcs-date__trigger { height: var(--control-h-touch); }
.is-phone .mcs-date__hint { display: none; }
.is-phone .mcs-tab { height: var(--control-h-touch); }
.is-phone .mcs-btn--md { height: var(--control-h-touch); }

</style>
<style>
/* Machino CS Dashboard — component styles. Every value comes from tokens.css custom properties. */
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; font-family: var(--font-sans); font-size: 14px; line-height: 20px; background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased; }
.mcs-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.mcs-icon { flex: none; display: block; }
:where(button, input, select, [tabindex]):focus-visible { outline: 2px solid transparent; box-shadow: var(--focus-ring); }

/* ---------- Card base ---------- */
.mcs-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); box-shadow: var(--shadow-card); padding: var(--space-5); min-width: 0; color: var(--ink); }
@media (max-width: 480px) { .mcs-card { padding: var(--space-4); } }

/* ---------- Button ---------- */
.mcs-btn { font: inherit; font-size: 14px; font-weight: 600; line-height: 20px; display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2); height: var(--control-h); padding: 0 var(--space-4); border-radius: var(--radius-md); border: 1px solid transparent; cursor: pointer; white-space: nowrap; transition: background-color .15s, border-color .15s, color .15s; }
.mcs-btn--sm { height: var(--control-h-sm); padding: 0 var(--space-3); font-size: 13px; }
.mcs-btn--icon { width: var(--control-h); padding: 0; }
.mcs-btn--sm.mcs-btn--icon { width: var(--control-h-sm); }
.mcs-btn--full { width: 100%; }
.mcs-btn--primary { background: var(--brand); color: var(--on-brand); }
.mcs-btn--primary:hover:not(:disabled) { opacity: .88; }
.mcs-btn--secondary { background: var(--surface); color: var(--ink); border-color: var(--line-strong); }
.mcs-btn--secondary:hover:not(:disabled) { background: var(--surface-hover); }
.mcs-btn--ghost { background: transparent; color: var(--ink); }
.mcs-btn--ghost:hover:not(:disabled) { background: var(--surface-hover); }
.mcs-btn--danger { background: var(--surface); color: var(--problem-text); border-color: var(--problem-text); }
.mcs-btn--danger:hover:not(:disabled) { background: var(--problem-soft); }
.mcs-btn:disabled { cursor: not-allowed; color: var(--ink-faint); background: var(--surface-sunken); border-color: var(--line); opacity: 1; }
.mcs-btn.is-loading { color: var(--ink-muted); }
.mcs-spinner { width: 16px; height: 16px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: mcs-spin .8s linear infinite; }
@keyframes mcs-spin { to { transform: rotate(360deg); } }
@media (max-width: 480px) { .mcs-btn--md { height: var(--control-h-touch); } .mcs-btn--md.mcs-btn--icon { width: var(--control-h-touch); } }

/* ---------- InfoTip ---------- */
.mcs-tip { position: relative; display: inline-flex; vertical-align: middle; }
.mcs-tip__btn { display: inline-grid; place-items: center; width: 24px; height: 24px; margin: -4px; padding: 0; border: 0; border-radius: var(--radius-full); background: transparent; color: var(--ink-muted); cursor: help; }
.mcs-tip__btn:hover { color: var(--ink); background: var(--surface-hover); }
.mcs-tip__bubble { position: absolute; z-index: 30; top: calc(100% + 8px); width: max-content; max-width: min(260px, calc(100vw - 32px)); padding: var(--space-2) var(--space-3); border-radius: var(--radius-sm); background: var(--ink); color: var(--surface); font-size: 13px; line-height: 18px; font-weight: 400; box-shadow: var(--shadow-pop); text-align: left; white-space: normal; }
.mcs-tip--end .mcs-tip__bubble { right: -6px; }
.mcs-tip--start .mcs-tip__bubble { left: -6px; }
.mcs-tip--center .mcs-tip__bubble { left: 50%; transform: translateX(-50%); }

/* ---------- DeltaChip ---------- */
.mcs-delta { display: inline-flex; align-items: center; gap: 2px; height: 22px; padding: 0 var(--space-2) 0 6px; border-radius: var(--radius-full); font-size: 12px; line-height: 16px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.mcs-delta--good { background: var(--good-soft); color: var(--good-text); }
.mcs-delta--problem { background: var(--problem-soft); color: var(--problem-text); }
.mcs-delta--neutral { background: var(--surface-sunken); color: var(--ink-muted); }

/* ---------- KPI ---------- */
.mcs-kpi { display: flex; flex-direction: column; gap: var(--space-2); text-align: left; font: inherit; width: 100%; }
.mcs-kpi--action { cursor: pointer; }
.mcs-kpi--action:hover { border-color: var(--line-strong); }

}

/* ---------- Chart card ---------- */
.mcs-chart { display: flex; flex-direction: column; gap: var(--space-4); }

.mcs-split__bar { display: flex; gap: 2px; height: 12px; border-radius: var(--radius-full); overflow: hidden; }

.mcs-split__label { color: var(--ink); }

/* ---------- Pills & channel badges ---------- */
.mcs-pill { vertical-align: middle; display: inline-flex; align-items: center; gap: var(--space-1); height: 24px; padding: 0 var(--space-2) 0 6px; border-radius: var(--radius-full); font-size: 12px; line-height: 16px; font-weight: 600; white-space: nowrap; }

/* ---------- Alert banner ---------- */

.mcs-tab__count { min-width: 20px; height: 20px; padding: 0 6px; border-radius: var(--radius-full); background: var(--surface-sunken); color: var(--ink-muted); font-size: 12px; font-weight: 600; display: inline-grid; place-items: center; font-variant-numeric: tabular-nums; }

@media (max-width: 480px) { .mcs-tab { height: var(--control-h-touch); } }

/* ---------- Sidebar nav & app shell ---------- */
.mcs-brand { display: flex; align-items: center; gap: var(--space-3); min-width: 0; }
.mcs-brand__logo { width: 32px; height: 32px; border-radius: var(--radius-sm); flex: none; outline: 1px solid var(--line); object-fit: cover; }

.mcs-brand__text span { font-size: 12px; line-height: 16px; color: var(--ink-muted); }
.mcs-nav { display: flex; flex-direction: column; gap: var(--space-6); height: 100%; padding: var(--space-5) var(--space-3); background: var(--surface); }
.mcs-nav > .mcs-brand { padding: 0 var(--space-2); }
.mcs-nav__list { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.mcs-nav__item { font: inherit; width: 100%; display: flex; align-items: center; gap: var(--space-3); height: 40px; padding: 0 var(--space-3); border: 0; border-radius: var(--radius-md); background: transparent; color: var(--ink-muted); font-size: 14px; font-weight: 500; cursor: pointer; text-align: left; position: relative; }

.mcs-nav__label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mcs-nav__count { font-size: 12px; font-weight: 600; color: var(--ink-muted); font-variant-numeric: tabular-nums; }
.mcs-nav__count.is-urgent { color: var(--problem-text); background: var(--problem-soft); padding: 0 6px; border-radius: var(--radius-full); line-height: 20px; }
.mcs-nav__foot { margin-top: auto; padding: 0 var(--space-2); }

.mcs-shell { container-type: inline-size; background: var(--bg); min-height: 100%; }

  .mcs-shell__grid { grid-template-columns: minmax(0, 1fr); position: relative; }
  .mcs-shell__side { position: absolute; z-index: 40; inset: 0 auto 0 0; width: min(300px, 84%); border-right: 1px solid var(--line); box-shadow: var(--shadow-pop); transform: translateX(-105%); transition: transform .2s ease; }
  .mcs-shell__grid.is-open .mcs-shell__side { transform: none; }

  .mcs-shell__topbar { display: flex; align-items: center; gap: var(--space-2); height: 56px; padding: 0 var(--space-3) 0 var(--space-2); background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 20; }

}

/* ---------- Popover & date picker ---------- */

.mcs-date__trigger:hover { background: var(--surface-hover); }
.mcs-date__label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mcs-date__hint { font-weight: 500; color: var(--ink-muted); font-size: 13px; white-space: nowrap; }

.mcs-date__preset:hover { background: var(--surface-hover); }
.mcs-date__preset.is-selected { font-weight: 600; }
.mcs-date__custom { border-top: 1px solid var(--line); margin-top: var(--space-2); padding: var(--space-3) var(--space-2) var(--space-2); display: grid; gap: var(--space-3); }
.mcs-date__custom-title { font-size: 12px; line-height: 16px; font-weight: 600; color: var(--ink-muted); }
.mcs-date__inputs { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--space-2); }

@media (max-width: 480px) { .mcs-date__trigger { height: var(--control-h-touch); } .mcs-date__hint { display: none; } }

/* ---------- Inputs ---------- */
.mcs-input { font: inherit; font-size: 14px; width: 100%; height: var(--control-h); padding: 0 var(--space-3); border: 1px solid var(--line-strong); border-radius: var(--radius-md); background: var(--surface); color: var(--ink); color-scheme: light; }
[data-theme="dark"] .mcs-input { color-scheme: dark; }
.mcs-input::placeholder { color: var(--ink-muted); }
.mcs-input:hover { border-color: var(--ink-muted); }
.mcs-input:disabled { background: var(--surface-sunken); color: var(--ink-faint); border-color: var(--line); cursor: not-allowed; }

@media (max-width: 480px) { .mcs-input { height: var(--control-h-touch); font-size: 16px; } }
.mcs-select { position: relative; }
.mcs-select select { appearance: none; padding-right: 36px; cursor: pointer; }
.mcs-select__chev { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); pointer-events: none; color: var(--ink-muted); }
.mcs-field { display: grid; gap: 6px; min-width: 0; }
.mcs-field__top { display: flex; align-items: center; gap: var(--space-2); }
.mcs-field__label { font-size: 13px; line-height: 18px; font-weight: 600; color: var(--ink); }
.mcs-field__opt { font-weight: 400; color: var(--ink-muted); }
.mcs-field__hint { font-size: 12px; line-height: 16px; color: var(--ink-muted); }
.mcs-field__error { display: flex; align-items: center; gap: 4px; font-size: 12px; line-height: 16px; font-weight: 500; color: var(--problem-text); }

/* ---------- Search & chips ---------- */
.mcs-search { position: relative; min-width: 0; }
.mcs-search__icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--ink-muted); pointer-events: none; }
.mcs-search__input { padding-left: 38px; padding-right: 38px; }
.mcs-search__input::-webkit-search-cancel-button { display: none; }
.mcs-search__clear { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 28px; height: 28px; display: grid; place-items: center; border: 0; border-radius: var(--radius-sm); background: none; color: var(--ink-muted); cursor: pointer; }

.mcs-chips { display: flex; gap: var(--space-2); flex-wrap: wrap; }
@media (max-width: 480px) { .mcs-chips { flex-wrap: nowrap; overflow-x: auto; margin: 0 calc(var(--space-4) * -1); padding: 0 var(--space-4) 2px; scrollbar-width: none; } }
.mcs-chip { font: inherit; display: inline-flex; align-items: center; gap: 6px; height: var(--control-h-sm); padding: 0 var(--space-3); border: 1px solid var(--line-strong); border-radius: var(--radius-full); background: var(--surface); color: var(--ink); font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap; flex: none; }
.mcs-chip:hover { background: var(--surface-hover); }
.mcs-chip.is-selected { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
.mcs-chip__dot { width: 8px; height: 8px; border-radius: 50%; }

.mcs-chip__count { font-size: 12px; font-weight: 600; opacity: .75; font-variant-numeric: tabular-nums; }
.mcs-filterbar { display: flex; flex-direction: column; gap: var(--space-3); }
@media (min-width: 720px) { .mcs-filterbar { flex-direction: row; align-items: center; } .mcs-filterbar .mcs-search { width: 320px; flex: none; } }

/* ---------- Toggle ---------- */
.mcs-toggle { display: flex; align-items: center; justify-content: space-between; gap: var(--space-4); }
.mcs-toggle__text { display: grid; gap: 2px; min-width: 0; }
.mcs-toggle__label { font-size: 14px; font-weight: 600; cursor: pointer; }
.mcs-toggle__desc { font-size: 12px; line-height: 16px; color: var(--ink-muted); }
.mcs-switch { flex: none; position: relative; width: 44px; height: 26px; padding: 0; border-radius: var(--radius-full); border: 1px solid var(--line-strong); background: var(--surface-sunken); cursor: pointer; transition: background-color .15s; }
.mcs-switch__thumb { position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--line-strong); transition: transform .15s, background-color .15s; }
.mcs-switch[aria-checked="true"] { background: var(--brand); border-color: var(--brand); }
.mcs-switch[aria-checked="true"] .mcs-switch__thumb { transform: translateX(18px); background: var(--on-brand); }

/* ---------- Empty / error / loading ---------- */
.mcs-empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: var(--space-2); padding: var(--space-12) var(--space-4); }
.mcs-empty__icon { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-sunken); color: var(--ink-muted); margin-bottom: var(--space-1); }
.mcs-empty--error .mcs-empty__icon { background: var(--problem-soft); color: var(--problem-text); }
.mcs-empty__title { font-size: 15px; line-height: 22px; font-weight: 600; }
.mcs-empty__text { font-size: 14px; line-height: 20px; color: var(--ink-muted); max-width: 340px; }
.mcs-empty .mcs-btn { margin-top: var(--space-2); }
.mcs-skel { display: block; border-radius: var(--radius-sm); background: var(--surface-sunken); position: relative; overflow: hidden; }
.mcs-skel::after { content: ""; position: absolute; inset: 0; transform: translateX(-100%); background: linear-gradient(90deg, transparent, var(--surface-hover), transparent); animation: mcs-shimmer 1.4s ease-in-out infinite; }
@keyframes mcs-shimmer { to { transform: translateX(100%); } }
@media (prefers-reduced-motion: reduce) { .mcs-skel::after, .mcs-spinner { animation: none; } }

/* ---------- Data table ---------- */
.mcs-table { padding: 0; overflow: hidden; container-type: inline-size; }
.mcs-table__head { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); padding: var(--space-4) var(--space-5); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.mcs-table__scroll { overflow-x: auto; }
.mcs-table__wide { width: 100%; border-collapse: collapse; font-size: 14px; line-height: 20px; }
.mcs-table__wide th { position: sticky; top: 0; background: var(--surface-sunken); color: var(--ink-muted); font-size: 13px; line-height: 18px; font-weight: 500; text-align: left; padding: var(--space-2) var(--space-4); white-space: nowrap; border-bottom: 1px solid var(--line); }
.mcs-table__wide td { padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--line); vertical-align: middle; color: var(--ink); }

.mcs-table__wide td.is-num { font-variant-numeric: tabular-nums; text-align: right; }
.mcs-table__wide tr.is-clickable { cursor: pointer; }
.mcs-table__wide tr.is-clickable:hover td { background: var(--surface-hover); }
.mcs-table__cards { display: none; list-style: none; margin: 0; padding: 0; }
.mcs-table__card { padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--line); }
.mcs-table__card:last-child { border-bottom: 0; }
.mcs-table__card.is-clickable { cursor: pointer; }
.mcs-table__card-top { display: flex; align-items: center; justify-content: space-between; gap: var(--space-2); font-weight: 600; color: var(--ink); }
.mcs-table__card-top .mcs-icon { color: var(--ink-muted); }
.mcs-table__card-meta { margin: var(--space-2) 0 0; display: flex; flex-wrap: wrap; gap: var(--space-2) var(--space-4); }
.mcs-table__card-meta dt { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.mcs-table__card-meta dd { margin: 0; font-size: 13px; color: var(--ink-muted); display: flex; align-items: center; }
.mcs-table__loading { padding: var(--space-2) 0; }
.mcs-table__skrow { display: flex; gap: var(--space-6); align-items: center; padding: var(--space-4) var(--space-5); border-bottom: 1px solid var(--line); }
.mcs-table__foot { padding: var(--space-3) var(--space-5); border-top: 1px solid var(--line); font-size: 12px; color: var(--ink-muted); display: flex; justify-content: space-between; align-items: center; gap: var(--space-3); }
@container (max-width: 639px) {
  .mcs-table__scroll { display: none; }
  .mcs-table__cards { display: block; }
  .mcs-table__head { padding: var(--space-3) var(--space-4); }
  .mcs-table__foot { padding: var(--space-3) var(--space-4); }
}

/* ---------- Preview helpers (used by component previews only) ---------- */
.mcs-demo { padding: var(--space-5); display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: center; background: var(--bg); min-height: 100%; }
.mcs-demo--col { flex-direction: column; align-items: stretch; }
.mcs-demo__phone { width: 390px; max-width: 100%; border: 1px dashed var(--line-strong); border-radius: var(--radius-lg); padding: var(--space-4); background: var(--bg); }
.mcs-demo__tag { font-size: 12px; font-weight: 600; color: var(--ink-muted); margin-bottom: var(--space-2); display: block; }
.mcs-demo--top { align-items: flex-start; }
.mcs-page { min-height: 100vh; display: flex; flex-direction: column; }
.mcs-page > .mcs-shell { flex: 1; }

/* ---------- Layout helper: chart row ---------- */
.mcs-chart-grid { display: grid; gap: var(--space-6); grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); }
@container (max-width: 899px) { .mcs-chart-grid { gap: var(--space-4); } }

</style>
<style>

html, body { min-height: 100%; }
body { background: var(--bg); }
.v-root { min-height: 100vh; display: flex; flex-direction: column; }
.v-bar { position: sticky; top: 0; z-index: 60; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px;
  padding: 12px 24px; background: var(--surface-sunken); border-bottom: 1px solid var(--line); }
.v-title { display: flex; flex-direction: column; min-width: 0; }
.v-title strong { font-size: 14px; line-height: 20px; }
.v-title span { font-size: 12px; line-height: 16px; color: var(--ink-muted); }
.v-controls { display: flex; flex-wrap: wrap; gap: 8px; }
.v-seg { display: inline-flex; padding: 3px; gap: 2px; border-radius: var(--radius-md); background: var(--surface); border: 1px solid var(--line); }
.v-seg button { font: inherit; font-size: 13px; font-weight: 500; height: 32px; padding: 0 12px; border: 0; border-radius: 7px; background: transparent; color: var(--ink-muted); cursor: pointer; white-space: nowrap; }
.v-seg button:hover { color: var(--ink); background: var(--surface-hover); }
.v-seg button.is-on { background: var(--brand); color: var(--on-brand); font-weight: 600; }
.v-desktop { flex: 1; display: flex; flex-direction: column; }
.v-desktop > .mcs-shell, .v-desktop > div { flex: 1; }
.v-stage { flex: 1; display: flex; justify-content: center; padding: 32px 16px 64px; background: var(--surface-sunken); }
.v-phone { width: 390px; max-width: 100%; min-height: 844px; background: var(--bg); border: 1px solid var(--line); border-radius: 28px; overflow: hidden; box-shadow: var(--shadow-pop); position: relative; align-self: flex-start; }
.v-phone > .mcs-shell { min-height: 844px; }
.mcs-tabs.no-line { border-bottom: 0; }
@media (max-width: 480px) { .v-bar { padding: 12px 16px; } .v-stage { padding: 0; } .v-phone { border: 0; border-radius: 0; box-shadow: none; width: 100%; } }
@media print { .v-bar { display: none; } }

</style>

  const busiestHandedHour = peak(inRange.filter(c => c.outcome === 'HUMAN'), CFG.BUSIEST_HANDED_MIN);

  // things to check
  const A = CFG.ALERT; const alerts = [];
  const sys = countRange(read.chats, p.last7).systemErrors;
  Object.keys(sys).sort().forEach(l => alerts.push({ level: 'high', text: l + ': seen ' + sys[l] + ' time' + (sys[l] === 1 ? '' : 's') + ' in the last 7 days. Please tell ' + CFG.ADMIN_NAME + '.' }));
  const longEnough = p.days >= CFG.MIN_ALERT_DAYS && (!p.isThisMonth || wall(nowMs).d >= A.MIN_DAY_OF_MONTH);
  if (canCompare && longEnough && !events.length) {
    const rises = (n, b) => n >= A.MIN_CHATS && n - b >= A.MIN_RISE && n >= A.MIN_RATIO * b;
    topicRows.forEach(r => { if (!r.isNew && rises(r.chats, r.compare)) alerts.push({ level: 'mid', text: r.name + ' is up: ' + r.chats + ' bot chats, compared with ' + r.compare + ' in ' + p.compareText + '.' }); });
    Object.keys(main.concerns).forEach(l => { if (l === OTHER_CONCERN) return; const n = main.concerns[l], b = compare.concerns[l] || 0; if (read.firstSeenConcern[l] >= p.compare.start) return; if (rises(n, b)) alerts.push({ level: 'mid', text: 'More customers with "' + l + '": ' + n + ', compared with ' + b + ' in ' + p.compareText + '.' }); });
    const share = (n, t) => (t ? 100 * n / t : 0);
    const shareRise = (n, b) => compare.chats > 0 && main.chats > 0 && share(n, main.chats) - share(b, compare.chats) >= A.SHARE_POINTS && n - b >= A.MIN_RISE;
    if (shareRise(main.topics.Other || 0, compare.topics.Other || 0)) alerts.push({ level: 'mid', text: 'More bot chats are "Other" than before. The menu may be missing something.' });
    if (shareRise(main.noTopic, compare.noTopic)) alerts.push({ level: 'mid', text: 'More customers leave before picking a topic than before.' });
  }
  return { p, main, compare, today, canCompare, events, topicRows, concernRows, res, sub, lists, months, busiestHour, busiestHandedHour, alerts: alerts.slice(0, A.MAX_LINES) };
}

// ------------------------------------------------------------------ Daily Log (all channels)
/** Daily Log rows (title lines above the header are fine) to days. Blank = unknown, never zero. */
function readDaily(values) {
  const hi = values.findIndex(r => norm(r[0]) === 'date');
  if (hi === -1) throw new Error('the Daily Log has no "Date" heading row.');
  const n = values[hi].map(norm); const cols = {};
  Object.keys(CFG.DAILY_COLUMNS).forEach(f => { for (const name of CFG.DAILY_COLUMNS[f]) { const i = n.indexOf(norm(name)); if (i !== -1) { cols[f] = i; break; } } });
  const missing = ['date', 'whatsapp', 'instagram', 'tiktok'].filter(f => cols[f] === undefined);
  if (missing.length) throw new Error('the Daily Log is missing column(s): ' + missing.map(f => CFG.DAILY_COLUMNS[f][0]).join(', ') + '.');
  const num = v => { const s = String(v == null ? '' : v).trim(); if (s === '' || s === '-') return null; const x = Number(s.replace(/,/g, '')); return isFinite(x) && x >= 0 ? Math.round(x) : null; };
  const get = (row, f) => (cols[f] === undefined ? null : num(row[cols[f]]));
  const byDate = {}; let unreadable = 0;
  values.slice(hi + 1).forEach(row => {
    const raw = String(row[cols.date] == null ? '' : row[cols.date]).trim(); if (!raw) return;
    const ms = isoDay(raw); if (ms === null) { unreadable++; return; }
    const wa = get(row, 'whatsapp') || 0, ig = get(row, 'instagram') || 0, tt = get(row, 'tiktok') || 0, em = get(row, 'email') || 0;
    const ch = wa + ig + tt + em; const total = get(row, 'total'); const bot = get(row, 'bot'), staff = get(row, 'staff'), none = get(row, 'noreply');
    const complete = bot !== null && staff !== null && none !== null && bot + staff + none === ch;
    byDate[raw] = { date: raw, ms, wa, ig, tt, em, ch, total: total === null ? ch : total, bot, staff, none, med: get(row, 'replytime'), complete };
  });
  const days = Object.keys(byDate).map(k => byDate[k]).sort((a, b) => a.ms - b.ms);
  return { days, unreadable, firstMs: days.length ? days[0].ms : null, lastMs: days.length ? days[days.length - 1].ms : null };
}

/** Value at position p (0 to 1) of sorted numbers, the "exclusive" way (median for p = 0.5). */
function percentile(xs, p) {
  const n = xs.length; if (!n) return null;
  const pos = p * (n + 1); const j = Math.floor(pos); const d = pos - j;
  if (j < 1) return xs[0]; if (j >= n) return xs[n - 1];
  return xs[j - 1] + d * (xs[j] - xs[j - 1]);
}

/** Totals for a list of days. Volume uses every day; who-answered and reply time use complete days only (rule A2, A3). */
function aggDaily(list) {
  const o = { days: list.length, enq: 0, wa: 0, ig: 0, tt: 0, em: 0, completeDays: 0, incomplete: [], bot: 0, staff: 0, none: 0, meds: [], in24: 0, due24: 0 };
  list.forEach(d => {
    o.enq += d.total; o.wa += d.wa; o.ig += d.ig; o.tt += d.tt; o.em += d.em; o.in24 += d.in24 || 0; o.due24 += d.due24 || 0;
    if (!d.complete) { o.incomplete.push(d); return; }
    o.completeDays++; o.bot += d.bot; o.staff += d.staff; o.none += d.none;
    if (d.med !== null && d.staff >= CFG.MIN_STAFF_FOR_TIME) o.meds.push(d.med);
  });
  o.who = o.bot + o.staff + o.none;
  o.perDay = o.days ? o.enq / o.days : null;
  const s = o.meds.slice().sort((a, b) => a - b);
  o.reply = s.length ? { n: s.length, mid: Math.round(percentile(s, 0.5)), lo: Math.round(percentile(s, 0.25)), hi: Math.round(percentile(s, 0.75)) } : null;
  return o;
}

/** Everything Part A shows, for one period. */
function summarizeA(rd, nowMs, key, logStartMs) {
  const p = periodFor(key, nowMs, logStartMs);
  const lastEnd = rd.days.length ? rd.lastMs + DAY : 0;
  const mainEnd = Math.min(p.main.end, lastEnd);
  // 22 Oct accuracy review: the Daily Log has no row for today until the next morning, so "this month" may hold fewer days
  // than its comparison window (e.g. 1–21 Oct of data vs 1–22 Sep). Compare the same number of days.
  if (mainEnd > p.main.start && mainEnd < p.main.end && p.compare.end - p.compare.start > mainEnd - p.main.start) {
    p.compare = { start: p.compare.start, end: p.compare.start + (mainEnd - p.main.start) };
    p.compareText = rangeText(p.compare.start, p.compare.end, false);
  }
  const inR = (s, e) => rd.days.filter(d => d.ms >= s && d.ms < e);
  // 23 Oct (SleekFlow Data tab): today can be in the list, counted so far ("live"). It is shown, but never compared: the
  // comparison uses the finished days only, against the same number of days before.
  const live = rd.days.find(d => d.live && d.ms >= p.main.start && d.ms < mainEnd) || null;
  const doneEnd = live ? live.ms : mainEnd;
  if (live && doneEnd > p.main.start && p.compare.end - p.compare.start > doneEnd - p.main.start) {
    p.compare = { start: p.compare.start, end: p.compare.start + (doneEnd - p.main.start) };
    p.compareText = rangeText(p.compare.start, p.compare.end, false);
  }
  const mainList = inR(p.main.start, mainEnd), cmpList = inR(p.compare.start, p.compare.end);
  const cmpExpected = Math.ceil((p.compare.end - p.compare.start) / DAY - 1e-9);
  const main = aggDaily(mainList), cmp = aggDaily(cmpList);
  const doneList = live ? mainList.filter(d => d !== live) : mainList;
  const done = live ? aggDaily(doneList) : main;
  const covered = rd.days.length > 0 && cmpExpected > 0 && doneList.length > 0 && p.compare.start >= rd.firstMs && cmpList.length === cmpExpected;
  // "Who replied" is only compared when both periods were measured the same way (Daily Log same day vs SleekFlow Data so far).
  const sameWay = doneList.concat(cmpList).every(d => !!d.sf === !!(doneList[0] && doneList[0].sf));
  const shareOk = covered && sameWay && done.completeDays >= CFG.MIN_COMPLETE_SHARE * done.days && cmp.completeDays >= CFG.MIN_COMPLETE_SHARE * cmp.days;
  const events = uniq(eventsTouching(p.main.start, mainEnd).concat(covered ? eventsTouching(p.compare.start, p.compare.end) : []));

  // busiest / quietest weekday: the middle value per weekday, only with enough of each weekday (rule A5)
  let weekday = null;
  const per = [[], [], [], [], [], [], []]; doneList.forEach(d => per[wall(d.ms).dow].push(d.total));
  if (per.every(a => a.length >= CFG.WEEKDAY_MIN_EACH)) {
    const mid = per.map(a => percentile(a.slice().sort((x, y) => x - y), 0.5));
    const order = [1, 2, 3, 4, 5, 6, 0].sort((a, b) => mid[b] - mid[a]);
    const top = order[0], second = order[1], low = order[6];
    const lowGroup = order.filter(d => mid[d] <= mid[low] * 1.05);            // the quietest day(s), ties included
    const outside = order.filter(d => lowGroup.indexOf(d) === -1);            // everything else, busiest first
    const nextUp = outside.length ? outside[outside.length - 1] : null;       // the quietest day that is NOT in the group
    weekday = {
      busiest: mid[top] >= CFG.WEEKDAY_LEAD * mid[second] ? { day: DAYS[top], n: Math.round(mid[top]) } : null,
      quietest: nextUp !== null && mid[nextUp] >= CFG.WEEKDAY_LEAD * mid[low] && lowGroup.length <= 2 ? { days: lowGroup.slice().sort((a, b) => ((a + 6) % 7) - ((b + 6) % 7)).map(d => DAYS[d]), n: Math.round(mid[low]) } : null,
      mid,
    };
  }

  // chart: enquiries per day (per week for long periods); days inside a special event are marked
  const span = Math.max(0, mainEnd - p.main.start); const unit = span <= 62 * DAY ? 'day' : 'week';
  const buckets = [];
  if (unit === 'day') for (let t = p.main.start; t < mainEnd; t += DAY) { const d = mainList.find(x => x.ms === t); buckets.push({ start: t, end: t + DAY, label: dayText(t), total: d ? d.total : 0, missing: !d }); }
  else for (let t = p.main.start; t < mainEnd; t += 7 * DAY) { const e = Math.min(t + 7 * DAY, mainEnd); buckets.push({ start: t, end: e, label: dayText(t), partial: e - t < 7 * DAY, total: mainList.filter(d => d.ms >= t && d.ms < e).reduce((a, d) => a + d.total, 0) }); }
  buckets.forEach(b => { b.event = eventsTouching(b.start, b.end).length > 0; });

  // months (whole log)
  const months = []; const nw = wall(nowMs);
  for (let i = 5; i >= 0; i--) {
    const start = fromWall(nw.y, nw.m - i, 1); const sw = wall(start); const end = fromWall(sw.y, sw.m + 1, 1);
    const list = inR(start, end); if (!list.length) continue;
    months.push(Object.assign({ label: MONTHS[sw.m] + ' ' + sw.y + (lastEnd < end ? ' (so far)' : '') }, aggDaily(list)));
  }

  // things to check
  const alerts = [];
  if (rd.days.length && nowMs - lastEnd > CFG.DAILY_STALE_HOURS * 3600000) alerts.push({ level: 'high', text: 'The Daily Log has not been filled since ' + dayText(rd.lastMs) + '. Please tell ' + CFG.ADMIN_NAME + '.' });
  if (rd.sfUpdatedMs && nowMs - rd.sfUpdatedMs > CFG.DAILY_STALE_HOURS * 3600000) alerts.push({ level: 'high', text: 'The SleekFlow numbers have not updated since ' + dayText(rd.sfUpdatedMs) + ' ' + String(wall(rd.sfUpdatedMs).h).padStart(2, '0') + ':' + String(wall(rd.sfUpdatedMs).mi).padStart(2, '0') + '. Please tell ' + CFG.ADMIN_NAME + '.' });
  // 26 Oct (D14): when both periods come from the SleekFlow Data tab, the fair comparison is "staff reply within 24 hours"
  // (the same yardstick for every day). "No reply yet" is not compared there: recent days have had less time for replies.
  const sfBoth = shareOk && doneList.length && doneList[0].sf;
  if (sfBoth && doneList.length >= CFG.NOREPLY_ALERT_DAYS && !events.length && done.due24 && cmp.due24) {
    const a = 100 * done.in24 / done.due24, b = 100 * cmp.in24 / cmp.due24;
    if (b - a >= CFG.NOREPLY_ALERT_POINTS) alerts.push({ level: 'mid', text: 'Fewer staff replies within 24 hours: ' + Math.round(a) + '% of enquiries, compared with ' + Math.round(b) + '% in ' + p.compareText + '.' });
  }
  if (!sfBoth && shareOk && doneList.length >= CFG.NOREPLY_ALERT_DAYS && !events.length && done.who && cmp.who) {
    const a = 100 * done.none / done.who, b = 100 * cmp.none / cmp.who;
    if (a - b >= CFG.NOREPLY_ALERT_POINTS) alerts.push({ level: 'mid', text: 'No reply from us is up: ' + Math.round(a) + '% of enquiries, compared with ' + Math.round(b) + '% in ' + p.compareText + '.' });
  }

  // the morning line
  let morning = null;
  const finishedDays = rd.days.filter(d => !d.live);
  if (finishedDays.length) {
    const last = finishedDays[finishedDays.length - 1]; const yes = toIso(nowMs - DAY) === toIso(last.ms);
    morning = (yes ? 'Yesterday (' : 'Latest full day (') + dayText(last.ms) + '): ' + last.total + ' enquiries' + (last.none === null ? '.' : ', ' + last.none + (last.sf ? ' not answered yet.' : ' with no reply from us.'));
  }
  return { p, main, cmp, done, live, covered, shareOk, events, weekday, buckets, unit, months, alerts, morning, mainList, lastMs: rd.lastMs, mainEnd };
}

/** Days with 10+ WhatsApp enquiries in the Daily Log but no bot chats in the Tracker (rule B7). */
function botLogGaps(rd, read, p) {
  if (!rd || !read || read.logStartMs === null) return [];
  const per = {}; read.chats.forEach(c => { const k = dayStart(c.ms); per[k] = (per[k] || 0) + 1; });
  const start = dayStart(read.logStartMs);
  return rd.days.filter(d => d.ms >= p.main.start && d.ms < p.main.end && d.ms >= start && d.wa >= CFG.MISSING_LOG_MIN_WA && !per[d.ms]).map(d => d.ms);
}

/* ==================================================================== EMAIL-LOGIC-START
   R1/R2 email numbers from the private sheet "Machino CS — Private Data" (tabs Email Daily Total, Enquiry Types,
   Email Count Log), which reach the page only through the Dashboard API after login. Counts only: never names,
   addresses or subjects. Tested by google-apps-script/tracker/test-dashboard-email.js (reads this block). */
const EMAIL_CFG = {
  TOTAL: { date: 'Date', total: 'Email enquiries (all mailboxes, de-duplicated)', postco: 'Return portal (PostCo)', contact: 'Of which: contact form (Shopify)', updated: 'Updated at' },
  TYPES: { date: 'Date', channel: 'Channel', total: 'Total', unclear: 'Unclear' },
  TYPES_CHANNEL: 'Email',
  CATEGORIES: [['DEFECT', 'Defect / Complaint'], ['ORDER', 'Order Status / Delivery'], ['RETURN', 'Return / Exchange'], ['SIZING', 'Sizing'], ['STORE', 'Store / Stock'], ['OTHER', 'Other / Unknown']],
  RUNS: { at: 'Run at', date: 'Date', note: 'Note' },
  // Email Log: customer detail. Only arrives when the Dashboard API owner switched SHOW_EMAIL_LOG on.
  LOG: { date: 'Date', time: 'Time', from: 'From', address: 'Email', subject: 'Subject', category: 'Category', keywords: 'Keywords', order: 'Order No', link: 'Link', why: 'Why', counted: 'In the daily email number? (Yes / No / Separate = PostCo)' },
  STALE_HOURS: 16,             // runs at about 9am, 12pm, 4pm and 8pm; the longest normal gap is 8pm → 9am (13 h)
  LOG_SHOW_MAX: 100,           // Email Log rows shown at once (search to narrow down)
  // Amani 21 Oct: promotions, newsletters and automatic mail are not shown in the Email Log (they were never counted).
  LOG_HIDE: /gmail promotions|company \/ platform, not a customer|automatic email/i,
};
const emNum = v => { const s = String(v === null || v === undefined ? '' : v).replace(/,/g, '').trim(); if (s === '') return null; const n = Number(s); return isFinite(n) ? n : null; };
const emNorm = s => String(s === null || s === undefined ? '' : s).trim().toLowerCase().replace(/\s+/g, ' ');

/** values: rows of text. want: { key: header name }. The header row is found by name (first key required). Returns row objects or null. */
function emTable(values, want) {
  if (!Array.isArray(values)) return null;
  const keys = Object.keys(want);
  for (let h = 0; h < Math.min(values.length, 10); h++) {
    const head = (values[h] || []).map(emNorm); const idx = {};
    keys.forEach(k => { idx[k] = head.indexOf(emNorm(want[k])); });
    if (idx[keys[0]] === -1 || idx[keys[1]] === -1) continue;
    return values.slice(h + 1).map(r => { const o = {}; keys.forEach(k => { o[k] = idx[k] >= 0 ? (r || [])[idx[k]] : ''; }); return o; });
  }
  return null;
}

/** "2026-10-21 14:25" (Malaysia time) → ms, or null. Older rows written before 21 Oct may hold another format: null. */
function emStampMs(s) {
  const m = /^\s*'?(\d{4})-(\d{2})-(\d{2})[ T](\d{1,2}):(\d{2})/.exec(String(s || ''));
  return m ? fromWall(+m[1], +m[2] - 1, +m[3], +m[4], +m[5]) : null;
}

/** The API's email part → { days: [{ iso, ms, total, postco, contact, updatedMs }], types: { iso: { DEFECT…, total, unclear } }, lastOkMs, lastRunMs, lastFailed, problems } */
function readEmail(email) {
  const out = { days: [], types: {}, lastOkMs: null, lastRunMs: null, lastFailed: false, problems: [] };
  const total = emTable(email && email.total, EMAIL_CFG.TOTAL);
  if (!total) out.problems.push('the Email Daily Total tab could not be read');
  else total.forEach(r => {
    const ms = isoDay(String(r.date).trim()); const n = emNum(r.total);
    if (ms === null || n === null) return;
    out.days.push({ iso: toIso(ms), ms, total: n, postco: emNum(r.postco) || 0, contact: emNum(r.contact) || 0, updatedMs: emStampMs(r.updated) });
  });
  out.days.sort((a, b) => a.ms - b.ms);
  const want = Object.assign({}, EMAIL_CFG.TYPES); EMAIL_CFG.CATEGORIES.forEach(c => { want[c[0]] = c[1]; });
  const types = emTable(email && email.types, want);
  if (!types) out.problems.push('the Enquiry Types tab could not be read');
  else types.forEach(r => {
    const ms = isoDay(String(r.date).trim());
    if (ms === null || emNorm(r.channel) !== emNorm(EMAIL_CFG.TYPES_CHANNEL)) return;
    const o = { total: emNum(r.total) || 0, unclear: emNum(r.unclear) || 0 }; EMAIL_CFG.CATEGORIES.forEach(c => { o[c[0]] = emNum(r[c[0]]) || 0; });
    out.types[toIso(ms)] = o;
  });
  const runs = emTable(email && email.runs, EMAIL_CFG.RUNS) || [];
  runs.forEach(r => {
    const ms = emStampMs(r.at); if (ms === null) return;
    const ok = /^\s*OK\b/i.test(String(r.note || ''));
    if (out.lastRunMs === null || ms >= out.lastRunMs) { out.lastRunMs = ms; out.lastFailed = !ok; }
    if (ok && (out.lastOkMs === null || ms > out.lastOkMs)) out.lastOkMs = ms;
  });
  if (out.lastOkMs === null) out.days.forEach(d => { if (d.updatedMs !== null && (out.lastOkMs === null || d.updatedMs > out.lastOkMs)) out.lastOkMs = d.updatedMs; });
  // 23 Oct: replied / not replied per day (counts only, from the Email Detail tab via the Dashboard API).
  out.replies = {};
  (Array.isArray(email && email.replies) ? email.replies : []).forEach(r => {
    const ms = isoDay(String(r && r[0] || '').trim()); if (ms === null) return;
    out.replies[toIso(ms)] = { n: emNum(r[1]) || 0, replied: emNum(r[2]) || 0, waiting: emNum(r[3]) || 0, overdue: emNum(r[4]) || 0, in24: emNum(r[5]) || 0, due24: emNum(r[6]) || 0 };
  });
  // 26 Oct: email waiting NOW, each thread once (Dashboard API sfdEmailBacklog). null when the API is older.
  out.backlog = email && email.backlog && isFinite(email.backlog.n) ? { n: Number(email.backlog.n) || 0, over: Number(email.backlog.over) || 0, days: Number(email.backlog.days) || 30 } : null;
  out.log = null;
  if (email && email.log) {
    const rows = emTable(email.log, EMAIL_CFG.LOG);
    const shown = rows ? rows.filter(r => isoDay(String(r.date).trim()) !== null && !(emNorm(r.counted) !== 'yes' && EMAIL_CFG.LOG_HIDE.test(String(r.why || '')))) : null;
    out.logHidden = rows && shown ? rows.length - shown.length : 0;
    out.log = shown ? shown.map(r => Object.assign({}, r, { iso: toIso(isoDay(String(r.date).trim())) })) : null;
  }
  return out;
}

/**
 * The Email tab's filters on the chosen period's days. f: { q, cat, days: 'all'|'weekday'|'weekend', min, postco, contact, sort }.
 * cat = a category key: each day's number becomes that category's count and days without it drop out.
 * q matches the date ("2026-10-21", "21 Oct"), the weekday ("Monday") and the busiest category name.
 */
function filterEmailDays(SE, re, f) {
  f = f || {};
  const q = emNorm(f.q), min = f.min === '' || f.min === null || f.min === undefined ? null : Number(f.min);
  const topCat = t => { if (!t) return ''; let best = null; EMAIL_CFG.CATEGORIES.forEach(([k, name]) => { if ((t[k] || 0) > 0 && (!best || t[k] > t[best[0]])) best = [k, name]; }); return best ? best[1] : ''; };
  let rows = SE.main.list.map(d => {
    const t = re.types[d.iso] || null, dow = wall(d.ms).dow;
    return Object.assign({}, d, { cats: t, dow, top: topCat(t), n: f.cat ? (t ? t[f.cat] || 0 : 0) : d.total });
  }).filter(d => {
    const weekend = d.dow === 0 || d.dow === 6;
    if (f.days === 'weekday' && weekend) return false;
    if (f.days === 'weekend' && !weekend) return false;
    if (f.cat && !(d.n > 0)) return false;
    if (min !== null && isFinite(min) && d.n < min) return false;
    if (f.postco && !(d.postco > 0)) return false;
    if (f.contact && !(d.contact > 0)) return false;
    if (q && emNorm([d.iso, dayText(d.ms), dayText(d.ms) + ' ' + wall(d.ms).y, DAYS[d.dow], d.top].join(' | ')).indexOf(q) === -1) return false;
    return true;
  });
  const by = { newest: (a, b) => b.ms - a.ms, oldest: (a, b) => a.ms - b.ms, most: (a, b) => b.n - a.n || b.ms - a.ms, fewest: (a, b) => a.n - b.n || b.ms - a.ms };
  rows.sort(by[f.sort] || by.newest);
  return { rows, of: SE.main.list.length, n: rows.reduce((a, d) => a + d.n, 0), postco: rows.reduce((a, d) => a + d.postco, 0), contact: rows.reduce((a, d) => a + d.contact, 0),
    label: f.cat ? (EMAIL_CFG.CATEGORIES.find(c => c[0] === f.cat) || [, 'Email enquiries'])[1] : 'Email enquiries' };
}

/**
 * The Daily Log with Email filled in from the HELLO email counter (Amani 21 Oct: show email in the Daily Log too).
 * Only days whose own Email cell is 0/blank are filled, so nothing is ever counted twice (e.g. once PRODUCTION mode

 * "Who replied" stays on the SleekFlow channels it measures: ch and complete are left as they were.
 * Returns a NEW object (the read data is never changed) with emailDays = how many days got an email number.

function withEmail(rd, re) {
  if (!rd || !re || !re.days.length) return rd;
  const by = {}; re.days.forEach(d => { by[d.iso] = d.total; });
  let emailDays = 0;
  const days = rd.days.map(d => {
    const iso = toIso(d.ms);
    if (d.em || !(iso in by)) return d;
    emailDays++;
    return Object.assign({}, d, { em: by[iso], total: d.total + by[iso], emFromCounter: true });
  });
  return Object.assign({}, rd, { days, emailDays });
}

/** Email Log rows (only when the owner switched them on) after search + filters. f: { q, cat, counted, day }. Newest first. */
function filterEmailLog(log, f) {
  f = f || {}; const q = emNorm(f.q);
  return (log || []).filter(r => {
    if (f.day && r.iso !== f.day) return false;
    if (f.counted && emNorm(r.counted) !== emNorm(f.counted)) return false;
    if (!f.counted && f.customersOnly && emNorm(r.counted) !== 'yes') return false;   // 'Customers only' (a Counted? choice wins)
    if (f.cat && emNorm(r.category).indexOf(emNorm(f.cat)) !== 0) return false;
    if (q && emNorm([r.from, r.address, r.subject, r.category, r.keywords, r.order, r.why].join(' | ')).indexOf(q) === -1) return false;
    return true;

  const sum = (list, k) => list.reduce((a, d) => a + d[k], 0);
  const catSum = list => { const o = { total: 0, unclear: 0 }; EMAIL_CFG.CATEGORIES.forEach(c => { o[c[0]] = 0; }); list.forEach(d => { const t = re.types[d.iso]; if (!t) return; Object.keys(o).forEach(k => { o[k] += t[k] || 0; }); }); return o; };
  const main = pick(P.main), cmp = P.compare ? pick(P.compare) : [];

    perDay: finished.length ? sum(finished, 'total') / finished.length : null, includesToday: main.some(d => d.iso === todayIso), list: main, cats: catSum(main) };
  const c = { days: cmp.length, total: sum(cmp, 'total'), postco: sum(cmp, 'postco'), cats: catSum(cmp) };

   Dashboard API). Per day and channel from 1 Sep 2026, today included ("LIVE"): customer conversations, started by us, answered by
   staff, answered by bot only, no reply yet, overdue, still open, staff reply within 24 h (out of "checked for 24 h"). The backlog
   tab = customers waiting for a staff reply NOW, each conversation once. The Daily Log sheet is unchanged (used before 1 Sep and for
   the staff reply time). Counts only. Tested by google-apps-script/tracker/test-dashboard-page.mjs. */
const SFD_COLS = { date: 'Date (MYT)', channel: 'Channel', cust: 'Customer conversations', us: 'Started by us', staff: 'Answered by staff', bot: 'Answered by bot only',
  none: 'No reply yet', overdue: 'Overdue (no reply > 24 h)', open: 'Still open', in24: 'Staff reply within 24 h', due24: 'Checked for 24 h',
  status: 'Status', upTo: 'Counted up to (MYT)', updated: 'Updated at (MYT)' };
const SFD_CH = { whatsapp: 'wa', instagram: 'ig', tiktok: 'tt' };
const SFD_KEYS = ['us', 'staff', 'bot', 'none', 'overdue', 'open', 'in24', 'due24'];

/** The tab's rows → { days: [{ iso, ms, wa, ig, tt, us, staff, bot, none, overdue, open, in24, due24, live, upTo, updatedMs, per }], updatedMs }, or null. */
function readSleekFlowData(values) {
  const rows = emTable(values, SFD_COLS);
  if (!rows) return null;
  const by = {}; let updatedMs = null;
  rows.forEach(r => {
    const ms = isoDay(String(r.date).trim()), ch = SFD_CH[emNorm(r.channel)];
    if (ms === null || !ch) return;
    const iso = toIso(ms);
    const d = by[iso] || (by[iso] = Object.assign({ iso, ms, wa: 0, ig: 0, tt: 0, live: false, upTo: '', updatedMs: null, per: {} }, ...SFD_KEYS.map(k => ({ [k]: 0 }))));
    const n = k => emNum(r[k]) || 0;
    d[ch] = n('cust'); SFD_KEYS.forEach(k => { d[k] += n(k); });
    d.per[ch] = { cust: n('cust') }; SFD_KEYS.forEach(k => { d.per[ch][k] = n(k); });
    if (/^live/i.test(String(r.status).trim())) { d.live = true; d.upTo = String(r.upTo || '').trim(); }
    const u = emStampMs(r.updated); if (u !== null) { if (d.updatedMs === null || u > d.updatedMs) d.updatedMs = u; if (updatedMs === null || u > updatedMs) updatedMs = u; }
  });
  const days = Object.keys(by).sort().map(k => by[k]);
  return days.length ? { days, updatedMs } : null;
}

/** The backlog tab → { wa|ig|tt|all: { n, over, open, closed, bot }, oldestMs, updatedMs }, or null. */
function readBacklog(values) {
  const rows = emTable(values, { channel: 'Channel', n: 'Waiting now', over: 'Of which over 24 h', open: 'Open in SleekFlow', closed: 'Closed in SleekFlow', bot: 'Of which bot reply only', oldest: 'Oldest waiting since (MYT)', updated: 'Updated at (MYT)' });
  if (!rows) return null;
  const out = { updatedMs: null };
  rows.forEach(r => {
    const k = emNorm(r.channel) === 'all' ? 'all' : SFD_CH[emNorm(r.channel)]; if (!k) return;
    out[k] = { n: emNum(r.n) || 0, over: emNum(r.over) || 0, open: emNum(r.open) || 0, closed: emNum(r.closed) || 0, bot: emNum(r.bot) || 0, oldestMs: emStampMs(r.oldest) };
    const u = emStampMs(r.updated); if (u !== null && (out.updatedMs === null || u > out.updatedMs)) out.updatedMs = u;
  });
  return out.all ? out : null;
}

/**
 * The Daily Log with WhatsApp / Instagram / TikTok (and who answered) taken from the SleekFlow Data tab wherever it has that
 * day, today included. Email (Daily Log column) and the staff reply time stay from the Daily Log. Returns a NEW object.
 * "Who answered" from the tab = so far, marked sf so it is never compared with Daily Log days.
 */
function withSleekFlow(rd, sf) {
  if (!sf || !sf.days.length) return rd;
  const by = {}; (rd ? rd.days : []).forEach(d => { by[toIso(d.ms)] = d; });
  sf.days.forEach(s => {
    const old = by[s.iso] || null; const em = old ? old.em : 0;
    const ch = s.wa + s.ig + s.tt;
    by[s.iso] = { date: old ? old.date : s.iso, ms: s.ms, wa: s.wa, ig: s.ig, tt: s.tt, em, ch: ch + em, total: ch + em, bot: s.bot, staff: s.staff, none: s.none,
      med: old && !s.live ? old.med : null, complete: true, sf: true, live: s.live, upTo: s.upTo, us: s.us, overdue: s.overdue, open: s.open, in24: s.in24, due24: s.due24, per: s.per };
  });
  const days = Object.keys(by).map(k => by[k]).sort((a, b) => a.ms - b.ms);
  return Object.assign({}, rd || { unreadable: 0 }, { days, firstMs: days[0].ms, lastMs: days[days.length - 1].ms, sfUpdatedMs: sf.updatedMs, sfDays: sf.days.length });
}

/**
 * Answered by staff / bot only / within 24 h for the chosen period (SleekFlow Data days + email replied counts), and the
 * backlog NOW (SleekFlow Waiting Now tab; each conversation once). Email "not replied" = as the email counter last saw it,
 * last 7 days only. Returns null when there is nothing to show.
 */
function pendingSummary(rd, re, r, bl, nowMs) {
  const sfDays = (rd ? rd.days : []).filter(d => d.sf && d.ms >= r.start && d.ms < r.end);
  const inR = iso => { const ms = isoDay(iso); return ms !== null && ms >= r.start && ms < r.end; };
  const emDays = re && re.replies ? Object.keys(re.replies).filter(inR) : [];
  if (!sfDays.length && !emDays.length && !bl) return null;
  const rows = [['WhatsApp', 'wa'], ['Instagram', 'ig'], ['TikTok', 'tt']].map(([name, k]) => {
    const o = { name, key: k, n: 0, staff: 0, bot: 0, none: 0, in24: 0, due24: 0 };
    sfDays.forEach(d => { const p = (d.per || {})[k]; if (!p) return; o.n += p.cust; o.staff += p.staff; o.bot += p.bot; o.none += p.none; o.in24 += p.in24 || 0; o.due24 += p.due24 || 0; });
    const b = bl && bl[k]; o.waitNow = b ? b.n : null; o.overNow = b ? b.over : null;
    return o;
  });
  const e = { name: 'Email', key: 'em', n: 0, staff: 0, bot: 0, none: 0, in24: 0, due24: 0, waitNow: null, overNow: null, emailStale: true };
  emDays.forEach(iso => { const x = re.replies[iso]; e.n += x.n; e.staff += x.replied; e.none += x.waiting; e.in24 += x.in24 || 0; e.due24 += x.due24 || 0; });
  if (re && re.backlog) { e.waitNow = re.backlog.n; e.overNow = re.backlog.over; e.backlogDays = re.backlog.days; }
  if (emDays.length || e.waitNow !== null) rows.push(e);
  const sum = k => rows.reduce((a, x) => a + (x[k] || 0), 0);
  const total = { n: sum('n'), staff: sum('staff'), bot: sum('bot'), none: sum('none'), in24: sum('in24'), due24: sum('due24') };
  const now = bl ? { n: bl.all.n, over: bl.all.over, open: bl.all.open, closed: bl.all.closed, bot: bl.all.bot, oldestMs: bl.all.oldestMs, updatedMs: bl.updatedMs,
    emailN: e.waitNow, emailOver: e.overNow } : null;
  return { rows, total, now, sfDays: sfDays.length, emDays: emDays.length, emailIncluded: emDays.length > 0 };
}
